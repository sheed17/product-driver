# Neyma Product Driver configuration.
# Copy to driver.config.yaml and edit. CLI flags override anything here.
#
# driver.config.yaml is git-ignored. Never commit a personal one, and never put
# a secret in it — the driver reads no credentials from configuration.

# REQUIRED. The target Neyma product repository. There is no default and no
# fallback: if this path is missing or is not a git checkout, the driver stops
# and says so rather than reading some other directory.
neyma_repo: ~/Desktop/freight-logistics-operational-teammate

# OPTIONAL. The Product Driver's own root. Omit it — the driver derives it from
# where this package is actually installed. Set it only for an unusual layout.
# driver_root: ~/neyma-product-driver

# OPTIONAL. All four default under driver_root and are created on demand.
# These, plus neyma_repo, are the approved roots the builder may write into;
# a write resolving outside every one of them is denied and recorded.
# runs_dir:            ~/neyma-product-driver/runs          # run artifacts, evidence, traces
# preservation_dir:    ~/neyma-product-driver/preservation  # backup refs and git bundles
# temp_workspace_root: ~/neyma-product-driver/tmp           # throwaway probes and scratch
# scenarios_dir:       ~/neyma-product-driver/scenarios

# Additional approved roots, if a scenario genuinely needs one.
# extra_writable_roots: []

# A Driver-maintenance run works on the Product Driver itself, so driver_root
# joins the approved roots. Leave false for ordinary product runs: the driver's
# own source is not the builder's business then.
driver_maintenance: false

# What the builder should do. Override per run with --task.
task: ""

# Scenario name (resolved under scenarios_dir) or an explicit path.
scenario: backend_generic

# Hard ceiling on the correct-and-retest loop. Must be 1..20.
max_iterations: 5

builder:
  model: opus
  # 'default' | 'acceptEdits' | 'plan'. Bypassing modes are rejected outright.
  # 'acceptEdits' matches Neyma's own defaultMode so the builder can Write/Edit
  # ordinary files without an interactive approval the unattended harness cannot
  # service. It does not weaken anything: the PreToolUse hook still denies the
  # hard-blocked set, and Neyma's own deny rules still load underneath.
  permission_mode: acceptEdits
  # Required for the SDK to load Neyma's CLAUDE.md, settings, hooks,
  # skills and subagents. Removing these strips Neyma's authority.
  setting_sources: [user, project, local]
  # Explicit Agent SDK tool permissions. This driver runs UNATTENDED, so the
  # builder's working set is auto-approved here — no interactive approval pause
  # for ordinary source-code work. There is no can_use_tool callback: a
  # whole-tool allow entry would shadow it, and unattended it could only hang.
  # Bash covers pytest, linters, repository scripts, local services and local
  # git (status/diff/log/show/add/restore, and a local commit when repository
  # authority requires one). The PreToolUse hook still hard-denies remote
  # publishing, force push, history rewrites without preservation, secret
  # access, external/production effects, system-wide installs, machine-security
  # changes and writes outside the approved roots.
  allowed_tools:
    [Read, Grep, Glob, NotebookRead, Write, Edit, MultiEdit, NotebookEdit,
     TodoWrite, Bash, BashOutput, KillShell, WebFetch, WebSearch]
  max_turns: 120
  turn_timeout_s: 1800
  stream_progress: true

evaluator:
  model: opus
  max_turns: 30
  turn_timeout_s: 900
  # The evaluator is read-only by construction.
  allowed_tools: [Read, Grep, Glob]

run:
  command_timeout_s: 300
  readiness_timeout_s: 90
  http_timeout_s: 30
  # Enabled automatically for browser scenarios.
  browser_enabled: false
  headless: true
  capture_trace: true

# Dynamic scenario generation and adaptive verification.
#
# OFF by default, and `--auto-scenarios` is the per-run opt-in. Turning this on
# changes what gets executed against your running product, which is not a change
# that should arrive silently.
#
# What generation can and cannot do: a generated scenario chooses WHICH approved
# command runs, WHEN, with what HTTP payloads, in what order, with what
# concurrency and restarts, and what must be observable afterwards. It can never
# author a new shell command. The approved set is derived from commands you
# already wrote into scenarios/*.yaml, plus anything listed below.
scenario_generation:
  # On by default. Generating situations from the diff, the requirements and the
  # failures already seen is the strongest verification here, and making it
  # opt-in meant the command anyone actually typed produced the weakest run
  # available. Switch it off for one run with --no-auto-scenarios.
  enabled: true

  # Bounds. Generation stops at whichever is reached first.
  max_initial_scenarios: 12
  max_adaptive_scenarios_per_wave: 8
  max_waves: 3
  max_total_scenarios: 30
  max_scenarios_per_risk_category: 6
  # Wall clock for one suite execution. Scenarios not reached are recorded as
  # SKIPPED with that reason — never silently dropped.
  execution_budget_s: 1800

  # What informs generation.
  diff_aware: true            # inspect what the builder actually changed
  use_prior_failures: true    # expand around what failed
  use_investigation_findings: true

  # A generated scenario that caught a real defect and later passed becomes a
  # promotion CANDIDATE. Promotion into scenarios/ is always an explicit human
  # action (`scenarios promote`). This cannot be set to false.
  promotion_requires_approval: true

  # Must be 1. The suite executor is sequential by construction — it refuses any
  # other value rather than accepting one it will not act on. Scenarios share
  # services, ports, databases and a workspace, and nothing yet proves a given
  # pair isolated. This key states the execution model; it is not a choice.
  max_parallel: 1

  model: opus
  # Extra commands generated scenarios may run, beyond those already present in
  # your scenario files. Extra arguments are allowed; shell operators are not.
  #
  # A useful pattern, and the one the P6/M3 and P6/M4 configurations use: when a unit
  # ships a probe with a focused `--case <name>` interface, the bare probe in the
  # scenario file already approves every case (approval matches by prefix). What
  # enumerating them here adds is VISIBILITY — the generation brief shows the
  # generator the approved command strings and nothing else, so a case that is
  # never written down is a situation the generator cannot choose to exercise.
  # Listing them widens no boundary; it removes the guessing.
  approved_commands: []
  #   - ".venv/bin/python scripts/inspect_state.py"
  #   - ".venv/bin/python scripts/probe_phase6_external_effect.py --case forged-capability"
  #   - ".venv/bin/python scripts/probe_phase6_approval.py --case provenance-drift-voids"
  # A unit that ships dark has no service and no HTTP surface, so the probe's own
  # argument vocabulary is the ONLY way a generated scenario can vary ordering,
  # concurrency, timing, crash or fault. Teach that shape by example rather than
  # enumerating the combinations — the prefix match already approves them all:
  #   - ".venv/bin/python scripts/probe_phase6_approval.py --case amount-drift-voids --inject drift-amount --seed 7"
  # Requests may only address these hosts. Loopback only, by design.
  local_http_hosts: ["127.0.0.1", "localhost", "::1"]

# Independent review, taken inside the run rather than relayed through you.
#
# WHEN ONE IS OWED. Four independent triggers, each recorded with the evidence
# it came from:
#   - the repository's protocol states an independent-review rule AND this run
#     is building a nested unit that rule governs;
#   - the task actually asked for the parent phase to be completed or accepted,
#     and the phase's contract carries a criterion only an independent session
#     may award;
#   - the diff touches a high-consequence product surface (effect execution,
#     payment or banking, approval authority, authentication, authorization,
#     tenant isolation, secrets, destructive database operations, write-capable
#     external integrations, outbound communication, claims/legal/compliance
#     behaviour, or a weakened runtime safety invariant) — always; or it is
#     large and the run needed more than one pass;
#   - the completion audit found a claim only a session other than the
#     implementing one can support.
#
# A phase's review criterion does NOT bind a unit inside that phase, and a task
# that merely named no unit is not at phase acceptance. Ordinary work — an edit,
# a refactor, a test, a fix — still gets no review at all.
#
# WHAT HAPPENS TO THE VERDICT. Supported: the run continues toward acceptance.
# A grounded defect: back to the same builder, then re-verified, then a NEW
# reviewer for the corrected tree — a review is evidence about one exact tree
# and stops applying the moment that tree changes. Anything the reviewer could
# not determine fails closed with the owner named; it never becomes a product
# change, and an external action is reported rather than performed.
review:
  automatic: true
  # How many refusals may be recycled into builder corrections before the
  # refusal becomes YOUR decision. At 1, a run launches at most two reviews.
  max_automatic_reviews: 1
  # Above either threshold a change counts as large rather than ordinary.
  meaningful_change_files: 10
  meaningful_change_lines: 400
  # Empty means "use the evaluator's model".
  model: ""

  # Whether the reviewer may execute deterministic verification itself.
  #
  # ON BY DEFAULT, and the difference is not cosmetic. A reviewer with no shell
  # can only adjudicate the receipts this harness collected — so the harness's
  # own honesty becomes an unexamined premise of the review that exists to
  # examine it. With this on, the reviewer re-runs this repository's own tests,
  # probes and mutation batteries, and the founder summary reports whether it
  # actually did.
  #
  # It does NOT widen the reviewer. A command runs only when it is both an
  # appropriate read-only verification action AND already allowed by Product
  # Driver policy — the same command guard and the same human-authored scenario
  # vocabulary a generated scenario draws from. Writing a file, `git add`,
  # committing, pushing, merging, deploying, installing, reaching a network,
  # reading a secret and composing shell are all refused whatever this is set
  # to, and every refusal is recorded in the run evidence.
  #
  # Setting it false is a deliberate downgrade: the review still runs and
  # reports evidence_reproduced: false.
  reviewer_can_execute: true
  # How many commands one reviewer may run. A review that needs more than this
  # is describing a verification gap, not performing a verification.
  reviewer_max_commands: 40
  # Extra command HEADS this repository's reviewers may treat as read-only
  # verification, beyond the built-in set (git read-only subcommands, grep/rg,
  # ls/find, cat/head/tail, wc/sort/uniq/cut/diff/jq/stat, pytest). Written by a
  # human, like the scenario approved-command list — never inferred.
  reviewer_extra_read_only: []

# --------------------------------------------------------------------------
# Phase closure: implementation complete -> ready for formal phase acceptance
# --------------------------------------------------------------------------
#
# The step you used to perform by hand between "the last unit landed" and "the
# phase is accepted": checking that the phase's acceptance criteria are actually
# instantiated, that each one's evidence is attached to the exact tree being
# accepted, that CI ran on THIS commit, that a reviewer's finding is a defect
# rather than a suggestion, and that a residual can be closed rather than
# needing your decision.
#
# What it will never do: write acceptance criteria the repository does not
# state, adopt a criterion a reviewer invented mid-acceptance, accept evidence
# about a different tree, close a residual whose closure condition is your
# judgement, or push.

phase_closure:
  # Compute the deterministic preflight at the end of a run that claims the
  # phase. Read-only; it changes no terminal state and launches nothing.
  enabled: true

  # Where this repository keeps its unit registry. Empty means the built-in
  # list (docs/implementation/IMPLEMENTATION-REGISTRY.yaml and friends).
  registry_paths: []

  # Whether a stale-but-harmless probe BLOCKS phase acceptance. This is your
  # acceptance authority's call, not the driver's, so it is configuration
  # rather than a rule. Default: a probe that cannot false-green is debt.
  stale_verification_blocks: false

  # Extra paths that carry THIS repository's acceptance record, as globs.
  # Additive only: a glob can name an unusual status file as part of the
  # record, and it can never reclassify runtime, test, migration, CI or
  # specification code as one.
  #   acceptance_record_globs: ["state/PHASES.json"]
  acceptance_record_globs: []

  # ONE read-only command that reports your external verifier's result for a
  # commit. `{sha}` is substituted with the exact candidate commit. Written by
  # a human, like the scenario approved-command list — never inferred, never
  # generated, and checked against the command guard when this file is READ, so
  # a mutating command fails at startup rather than mid-closure.
  #
  # Nothing here knows about any particular CI provider. Examples:
  #   external_probe_command: "curl -s https://ci.example.com/status/{sha}"
  #   external_probe_command: "python3 tools/ci_status.py {sha}"
  #
  # Leave it empty and the driver simply WAITS instead: it reports
  # WAITING_FOR_EXTERNAL_VERIFICATION with the expected commit and the exact
  # record to bring back, and you supply it with
  #   python -m neyma_product_driver phase external-evidence --sha <commit>
  external_probe_command: ""
  external_probe_timeout_s: 120
  # What to call the gate when your criterion does not name it.
  external_gate_name: ""

  # There is deliberately NO switch here for "let the driver make the acceptance
  # commit". allow_auto_commit below is refused outright — the driver control
  # process never commits or pushes on your behalf — and a second knob that
  # could never take effect would read like a capability this does not have.
  #
  # What the driver does instead is the part worth automating: it classifies
  # every dirty path by surface, refuses the whole preparation if anything
  # outside the acceptance record is dirty (naming each file and its surface),
  # and prints the exact change plus the command to make it. You or a builder
  # session make the commit under the repository's own rules.

# THE TARGET REPOSITORY'S OWN VERIFICATION FOR WHAT THIS RUN CHANGED.
#
# Generated scenarios prove the thing that was built. They cannot prove that the
# repository's standing guarantees about the SURFACE it was built on still hold —
# and those guards are the ones that turn red in CI after you push. So when this
# run's diff touches a surface that carries repository-wide guarantees (persisted
# schema, migrations, storage), the driver finds the repository's OWN guards over
# that surface and runs them on the candidate tree before stating push readiness.
#
# Nothing here is product-specific: no test name, no table name, no phase. What
# runs is discovered by reading the repository, and only tests it already has.
repository_verification:
  # A change outside those surfaces runs nothing at all. Turning this off means
  # a run can declare push readiness without having asked.
  enabled: true

  # A CAP, not a target. Most changes discover none; a change that discovers
  # twenty has not earned twenty, and the run says how many it did not execute.
  max_targets: 3

  # Wall clock for ONE discovered guard.
  timeout_s: 900

# Neyma is normally dirty mid-phase, so this defaults to true.

allow_dirty_tree: true
# Refuse to run unless the repo is on this branch. null = any branch.
require_branch: null

# Local history transformation (git commit --amend, soft-reset consolidation).
# Off by default. Turning it on does NOT make amendment automatic: each one
# still has to pass the mechanical preconditions in preservation.py — the
# affected commits must be unreachable from every remote-tracking ref, the
# repository protocol must require the transformation, and a preservation ref
# plus a git bundle must be written before anything moves.
allow_local_history_rewrite: false
