[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neyma-product-driver"
version = "0.1.0"
description = "Local product-driver that operates a Claude Code builder session against the Neyma repo and tests the running product."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.125",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
neyma-product-driver = "neyma_product_driver.cli:main"

[tool.setuptools]
packages = ["neyma_product_driver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "e2e: end-to-end smoke test using a real local HTTP app and a real browser",
]
