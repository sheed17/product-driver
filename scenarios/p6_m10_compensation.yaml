  - risk_category: regression
    claim: >-
      M10 ships dark and lands beside M1–M9 without touching them. Zero production importers, no
      channel join, no oversight queue, dashboard or notifier, checkpoint.py still the sole gate
      minter, M3 still the sole effect authority, and no M11, M12 or M13 table, module or event
