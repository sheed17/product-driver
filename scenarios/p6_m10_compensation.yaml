name: p6_m10_compensation
phase: P6
mode: backend
description: >-
  P6 M10: the Compensation — undoing an external effect that should not have happened, and the one
  machine in Neyma whose whole job is to prove that an undo gets NO privileged path. A carrier's POD
  was bound to the wrong load, an invoice for GBP 2,850 went out to the customer on the strength of
  it, and a human has now corrected the binding: that invoice rests on a fact known to be wrong, and
  the money has to be credited back. The tempting fix is a rollback — find the effect, call the TMS
  void endpoint, mark the row undone — and that is a second ungated write route into a customer's
  accounting system, reached at the exact moment the system is already known to be wrong about
  something. So M10 does the opposite: the credit note is a NEW external effect, with its own
  pipeline, its own human approval, its own checkpoint, its own single-use grant, its own commit key
  and its own readback. And when the original outcome is UNKNOWN — the TMS timed out and nobody can
  say whether the invoice was issued — compensation is REFUSED outright, because a compensating
  write can CREATE the very state it meant to remove. COMPENSATION_FAILED and NOT_POSSIBLE are the
  most dangerous states the system can be in, so they stay loud, keep a named human owner and carry
  the money at stake, and no timer, sweep or retry ever clears them. M10 ships dark: no oversight
  queue, no notifier, no production write enabled. This scenario measures the DATABASE and the EVENT
  REGISTRY, not the probe's narration.

setup:
  - ".venv/bin/python scripts/check_env.py"

fixtures:
  - "pyproject.toml"
  - "src/freight_recon/compensation.py"
  - "src/freight_recon/migrations/phase6_compensations.py"
  - "eval/tests/test_phase6_compensation.py"
  - "scripts/probe_phase6_compensation.py"
  - "scripts/mutate_phase6_compensation.py"

