  # oracle that cannot pass on a correct product teaches the builder to change the product. Both
  # headlines are still required of the run as a whole — they are in `expect_visible` and the
  # narrative command declares them — so nothing here drops an obligation.
  - name: "the refusal on an unknown outcome mints no pipeline, no grant and no effect"
