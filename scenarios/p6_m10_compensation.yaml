  # EACH LITERAL BELOW IS THE HEADLINE OF THE CASE ACTUALLY NAMED ON THE LINE ABOVE IT. Both of
  # these used to require a headline a DIFFERENT case emits — "YOU CANNOT UNDO WHAT YOU CANNOT
  # PROVE YOU DID" belongs to `refusal-on-unknown-emits-compensationrefused-and-zero-rows`, and
