      persistence failure leaves no APPROVED without its event, no EXECUTING without its pipeline
      binding, no COMPLETED without a verified effect and no half-created compensation. CM-3 starts
      a SEPARATE M2 pipeline, and the scenario does not pretend the whole lifecycle is one
      transaction.
    checks:
      - "drive the Compensation machine through a brokerage narrative, and attack it"
      - "the live database refuses an ownerless compensation, a seventh state, and EXECUTING with no pipeline"
      - "the M10 acceptance battery"
    observations:
      - "EXECUTING with no bound pipeline: refused"
      - "A COMPENSATION IS ITSELF A SEPARATELY GATED EXTERNAL EFFECT"

  - risk_category: restart_recovery
    claim: >-
      Replay reconstructs the compensation record and nothing else. Replaying any F10 event mints
      zero pipelines, zero checkpoint witnesses, zero grants, zero claims, zero adapter invocations
      and zero external effects — the compensating effect, like any effect, is never produced by
      replay. A crash after claim reaches NEEDS_VERIFICATION and then COMPENSATION_FAILED, never a
      silent re-execution.
    checks:
      - "drive the Compensation machine through a brokerage narrative, and attack it"
      - "replay reconstructs the compensation record and produces no compensating effect"
    observations:
      - "REPLAY PRODUCES NO COMPENSATING EFFECT"

  - risk_category: stale_state
    claim: >-
      M10 emits the seven registered F10 contracts and no eighth, and CM-5 emits the SHARED F3
      RealityEstablished coordination event with subject=compensation rather than minting a second
      contract for one semantic fact. The names M10's prose calls "events consumed" are checked
      against the registry rather than believed: four of the six are trigger labels or states, and
      no contract is invented to make a prose list true.
    checks:
      - "M10 uses the seven registered F10 contracts, invents no eighth, and mints no second RealityEstablished"
      - "drive the Compensation machine through a brokerage narrative, and attack it"
    observations:
