verifies:
  - risk_category: safety_invariant
    claim: >-
      A compensation receives NO privileged path. It is itself a separately gated external effect —
      its own M2 Pipeline Instance, its own checkpoint, its own M3 grant, its own commit key, its own
      readback — and there is no rollback, no privileged undo, no raw correction, no adapter fast
      path and no bulk undo anywhere in it. An "undo" that bypasses the gates is an ungated write
      with a good excuse.
    checks:
      - "drive the Compensation machine through a brokerage narrative, and attack it"
      - "execution is a full M2 pipeline, not a privileged undo"
      - "the compensating effect never reuses the original Effect Grant"
      - "the checkpoint is still the only thing that mints a gate decision, and M10 registers none"
      - "a correction storm raises N individually gated compensations, never a bulk undo"
    observations:
      - "A COMPENSATION IS ITSELF A SEPARATELY GATED EXTERNAL EFFECT"
      - "THERE IS NO FAST PATH FOR UNDO"
      - "A COMPENSATING EFFECT NEVER REUSES THE ORIGINAL EFFECT GRANT"
      - "THERE IS NO BULK UNDO"
      - "modules that MINT a gate decision: ['checkpoint.py']"
      - "M10 constructs a GateRegistry: False"

  - risk_category: ambiguous_external_effect
    claim: >-
      M-33. Compensation is FORBIDDEN on an UNKNOWN_OUTCOME. You cannot undo what you cannot prove
      you did, and a compensating write can CREATE the very state it meant to remove. The refusal is
      complete: zero compensation rows, one CompensationRefused carrying the single canonical cause,
      and zero pipelines, grants, claims and external effects. Eligibility is read from the persisted
      M3 ledger, never from a caller flag.
    checks:
      - "drive the Compensation machine through a brokerage narrative, and attack it"
      - "M-33: a compensation of an unknown outcome is refused, and nothing is written"
      - "the refusal on an unknown outcome mints no pipeline, no grant and no effect"
      - "every original-effect state is exercised across the eight-member M3 ledger"
    observations:
      - "YOU CANNOT UNDO WHAT YOU CANNOT PROVE YOU DID"
      - "COMPENSATION IS FORBIDDEN ON AN UNKNOWN OUTCOME"

  - risk_category: approval_required
    claim: >-
      Money-affecting compensation is ALWAYS HUMAN_APPROVAL_REQUIRED. CM-2 is human-triggered, the
      approval_id resolves to a same-tenant M4 approval bound to this compensation's own commit key,
      and a stale, wrong or cross-tenant approval is refused. M10 builds no second approval system,
      and Compensation.APPROVED is not the same fact as Approval.GRANTED.
    checks:
      - "drive the Compensation machine through a brokerage narrative, and attack it"
      - "a model may neither own, approve, nor establish reality for a compensation"
    observations:
      - "A MODEL CAN NEVER APPROVE A COMPENSATION"

  - risk_category: authorization
    claim: >-
      Authority is never laundered. A model can never own, approve, or establish reality for a
      compensation, at any confidence including 1.0; a compensation is never raised from a
      MODEL_INFERRED conclusion; the invalidating decision_ref resolves through M1's landed K-1
      executor rather than a second implementation; and M10 mints no gate decision and engages no
      brake.
    checks:
      - "drive the Compensation machine through a brokerage narrative, and attack it"
      - "the decision_ref resolver is M1's, imported rather than rewritten"
      - "the checkpoint is still the only thing that mints a gate decision, and M10 registers none"
    observations:
      - "A MODEL CAN NEVER OWN A COMPENSATION"
      - "A MODEL CAN NEVER ESTABLISH REALITY"
      - "M10 MINTS NO GATE DECISION"
      - "M10 ENGAGES NO BRAKE AND NARROWS NONE"
      - "M10 imports the K-1 resolver: True"
      - "M10 imports it from M1: True"
      - "M10 defines a second K-1 resolver: False"

  - risk_category: missing_data
    claim: >-
      A compensation carries a named human owner and the dollar exposure from the moment it exists.
      An ownerless compensation is structurally impossible — NOT NULL plus a composite FOREIGN KEY
      into tenant_humans, refused by the live database — and EXECUTING without a bound
      pipeline_instance_id is refused by a CHECK.
    checks:
      - "the live database refuses an ownerless compensation, a seventh state, and EXECUTING with no pipeline"
    observations:
      - "positive control, a well-formed REQUIRED compensation: ACCEPTED"
      - "an ownerless compensation: refused"
      - "an owner who is not a recorded human: refused"
      - "EXECUTING with no bound pipeline: refused"

  - risk_category: malformed_input
