  # THE CANONICAL CHECKPOINT SUITE IS `test_phase3_checkpoint_matrix.py`. This check used to name
  # `eval/tests/test_phase3_checkpoint.py`, which has never existed in the landed tree: pytest
  # answered `ERROR: file or directory not found` and exited 4, so the strongest regression
  # anchor M10 has over the P3 kernel measured nothing at all. A missing path is a check that
  # cannot fail for the reason it was written, which is worse than no check. The claim CAS is
  # now actually run too, because the check's own name promises it.
  - name: "the checkpoint kernel and the claim CAS are unchanged by M10"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase3_checkpoint_matrix.py eval/tests/test_phase3_claim_cas.py eval/tests/test_phase3_step_order.py"
