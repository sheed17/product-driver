  # ------------------------------------------------------------------ acceptance batteries
  #
  # EVERY BATTERY BELOW IS INVOKED AS `python -m pytest`, NEVER AS THE `pytest` CONSOLE SCRIPT.
  # This is not a style preference, it is the difference between running the suite and running a
  # different suite. `python -m pytest` puts the invocation directory on `sys.path`; the console
  # script does not. Neyma's `pyproject.toml` sets `pythonpath = ["src"]` and nothing more, so a
  # test that reaches for the repository's own harness — `from eval.phase0 import import_probe`,
  # which `test_phase6_pipeline_instance.py` uses to decide the M2 dark-surface guard — raises
  # `ModuleNotFoundError: No module named 'eval'` under the console script and passes under
  # `-m`. Run 20260901-082602 reported that as "12 failures in M2, only in combination", and it
  # was neither: the same twelve fail with the file run ALONE under `.venv/bin/pytest`, and all
  # 158 pass alone under `-m`. Every other scenario in this directory already invokes pytest
  # this way; this file was the exception, and the exception was the defect.
  #
  # `-p no:cacheprovider` matches Neyma's own CI so ambient state cannot reshape the run.
  - name: "the M10 acceptance battery"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase6_compensation.py"
    expect_exit_code: 0
    timeout_s: 1800
    expect_contains: ["passed"]

