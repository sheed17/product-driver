      - "a float exposure: refused"
      - "a Decimal exposure: refused"
      - "a boolean exposure: refused"
      - "a lowercase currency code: refused"

  - risk_category: unexpected_state_transition
    claim: >-
      Exactly six states, enforced by a database CHECK, and no seventh. No CANCELLED, no EXPIRED, no
