      print('the canonical tenant authority roles:', sorted(AUTHORITY_ROLES));
      print('authority role count:', len(AUTHORITY_ROLES));
      print('POLICY_OWNER is a landed authority role:', 'POLICY_OWNER' in AUTHORITY_ROLES);
      p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3'); c=sqlite3.connect(p); create_canonical_schema(c);
      refs=sorted(set(r[2] for r in c.execute('pragma foreign_key_list(policies)')));
      print('policies references tenant_humans:', 'tenant_humans' in refs);
      po=pathlib.Path('src/freight_recon/policy.py').read_text(encoding='utf-8');
      print('M11 names the canonical Policy Owner role:', 'POLICY_OWNER' in po);
      print('M11 invents an admin authority:', any(s in po for s in ('ADMIN', 'SUPERUSER', 'ROOT_USER', 'BYPASS')));
      print('M11 defines its own authority role vocabulary:', 'AUTHORITY_ROLES =' in po);
      mig=pathlib.Path('src/freight_recon/migrations/phase6_policies.py').read_text(encoding='utf-8');
      print('the M11 migration redefines the human authority table:', 'CREATE TABLE tenant_humans' in mig)"
    timeout_s: 300
    contains:
      - "the canonical tenant authority roles: ['AUTHORIZED_HUMAN', 'POLICY_OWNER']"
      - "authority role count: 2"
      - "POLICY_OWNER is a landed authority role: True"
      - "policies references tenant_humans: True"
      - "M11 names the canonical Policy Owner role: True"
      - "M11 invents an admin authority: False"
      - "M11 defines its own authority role vocabulary: False"
      - "the M11 migration redefines the human authority table: False"

  # 15 --------------------------------------------------------------------------------------
  #
  # EXPIRY IS THE ONE PLACE A CLOCK COULD BROADEN AUTHORITY, SO IT IS THE ONE PLACE THE COLUMN
  # ITSELF HAS TO BE CONSTRAINED. `expires_at` is optional and NARROWING-ONLY: a broadening policy
  # carrying an expiry is automatic broadening with a delay, which is the whole reason the rule
  # exists. The direction has to be a persisted, checkable fact on the row — not something the
  # machine promises to remember.
  - name: "only a narrowing policy may carry an expiry, and the direction is a persisted fact"
    command: >-
      .venv/bin/python -c "import sys,sqlite3,tempfile,os,re; sys.path.insert(0,'src');
      from freight_recon.schema import create_canonical_schema;
      p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3'); c=sqlite3.connect(p); create_canonical_schema(c);
      cols=[r[1] for r in c.execute('pragma table_info(policies)')];
      ddl=(lambda r: r[0] if r else '')(c.execute('select sql from sqlite_master where name=?', ('policies',)).fetchone());
      print('the policy column set:', sorted(cols));
      print('an expires_at column exists:', 'expires_at' in cols);
      print('expires_at is optional:', 'expires_at' in [r[1] for r in c.execute('pragma table_info(policies)') if not r[3]]);
      direction=[x for x in cols if 'direction' in x.lower() or 'narrow' in x.lower()];
      print('the narrowing direction is a persisted column:', bool(direction));
      print('the direction column(s):', sorted(direction));
      print('a CHECK constrains expiry to the narrowing direction:', bool(re.search('CHECK[^)]*expires_at', ddl, re.S | re.I)));
      print('a superseded_by column exists:', 'superseded_by' in cols);
      print('a revoked_reason column exists:', 'revoked_reason' in cols);
      print('an approval_id column exists:', 'approval_id' in cols);
      print('an effective_from column exists:', 'effective_from' in cols);
      print('an activated_by column exists:', 'activated_by' in cols);
      print('an authored_by column exists:', 'authored_by' in cols);
      print('a predicate column exists:', any(x in cols for x in ('predicate','predicate_ref')));
      print('a caps column exists:', 'caps' in cols)"
    timeout_s: 300
    contains:
      - "an expires_at column exists: True"
      - "expires_at is optional: True"
      - "the narrowing direction is a persisted column: True"
      - "a CHECK constrains expiry to the narrowing direction: True"
      - "a superseded_by column exists: True"
      - "a revoked_reason column exists: True"
      - "an approval_id column exists: True"
      - "an effective_from column exists: True"
      - "an activated_by column exists: True"
      - "an authored_by column exists: True"
      - "a predicate column exists: True"
      - "a caps column exists: True"

  # 16 --------------------------------------------------------------------------------------
  #
  # THE M9 SEAM PO-7 ESCALATES THROUGH, EXERCISED WITHOUT REBUILDING M9. `policy` has been a member
  # of M9's closed `source_kind` vocabulary since `P6-CP-9` — carried deliberately WITHOUT a foreign
  # key, in `SOURCE_KINDS_WITHOUT_TABLE`, and recorded as `M9-AQ-3`, "the kinds whose table does not
  # exist today". M11 lands that table. ### WHETHER `policy` NOW MOVES INTO THE FK-BACKED
  # `SOURCE_KIND_TABLE` IS AN OPEN AUTHORITY QUESTION AND M11 DOES NOT SETTLE IT: CURRENT.md forbids
  # rebuilding M1-M10, so M11 raises its expiry Exception through M9's landed entry point and edits
  # nothing of M9's. This oracle measures BOTH — that the seam is used, and that M9 is untouched.
  - name: "M11 raises its expiry Exception through M9's landed seam and edits no part of M9"
    command: >-
      .venv/bin/python -c "import sys,pathlib; sys.path.insert(0,'src');
      from freight_recon.migrations.phase6_exceptions import SOURCE_KINDS, SOURCE_KIND_TABLE, SOURCE_KINDS_WITHOUT_TABLE;
      import freight_recon.exception as m9;
      print('policy is a canonical M9 exception source:', 'policy' in SOURCE_KINDS);
      print('policy is FK-backed in M9 today:', 'policy' in SOURCE_KIND_TABLE);
      print('policy is carried as a recorded-only kind:', 'policy' in SOURCE_KINDS_WITHOUT_TABLE);
      print('M9 exposes a raise entry point:', hasattr(m9.M9Machine, 'raise_exception'));
      print('the six F9 contracts M9 mints:', sorted(m9.PRODUCED_CONTRACTS));
      po=pathlib.Path('src/freight_recon/policy.py').read_text(encoding='utf-8');
      print('M11 reaches M9 by import:', 'exception' in po);
      print('M11 writes the exceptions table directly:', 'insert into exceptions' in po.lower());
      print('M11 defines an M9 state vocabulary:', any(s in po for s in ('EXCEPTION_STATES', 'class EcState', 'ACKNOWLEDGED')));
      print('M11 mints an F9 contract name:', sorted(n for n in m9.PRODUCED_CONTRACTS if n in po))"
    timeout_s: 300
    contains:
      - "policy is a canonical M9 exception source: True"
      - "M9 exposes a raise entry point: True"
      - "M11 reaches M9 by import: True"
      - "M11 writes the exceptions table directly: False"
      - "M11 defines an M9 state vocabulary: False"
      - "M11 mints an F9 contract name: []"

  # 17 --------------------------------------------------------------------------------------
  #
  # THE PRODUCT CEILING COMPARISON, STRUCTURALLY. "A tenant policy may only NARROW the product
  # ceiling" is the load-bearing sentence of the whole unit, and the tempting implementation is a
  # string comparison or an alphabetical ordering — which would let `AUTONOMOUS_WITHIN_CAPS` sort
  # below `HUMAN_APPROVAL_REQUIRED` and quietly call broadening a narrowing. The ordering has to be
  # a declared, total, canonical relation over the four members, and it has to be the one ADR-010
  # §3.1 states: `AUTONOMOUS_WITHIN_CAPS` is the broadest, `FORBIDDEN` the narrowest, and the two
  # human gates in between are NOT interchangeable (`PERMANENT_HUMAN_ASSERTION_REQUIRED` is a
  # permanent truth and cannot graduate; `HUMAN_APPROVAL_REQUIRED` is current policy and can).
  - name: "the product-ceiling comparison is a declared total order over the four gate members, not a string compare"
    command: >-
      .venv/bin/python -c "import sys,inspect,pathlib; sys.path.insert(0,'src');
      import freight_recon.policy as po; import freight_recon.checkpoint as ck;
      src=inspect.getsource(po);
      ordering=[n for n in dir(po) if 'ORDER' in n.upper() or 'LADDER' in n.upper() or 'RANK' in n.upper() or 'CEILING' in n.upper()];
      print('a declared gate ordering exists:', bool(ordering));
      print('the declared ordering symbol(s):', sorted(ordering));
      obj=getattr(po, sorted(ordering)[0]) if ordering else None;
      members=set(m.value for m in ck.GateDecision);
      covered=set(getattr(x, 'value', x) for x in (obj or ()));
      print('the ordering is total over the four canonical members:', covered == members);
      print('the ordering covers:', sorted(covered));
      narrowing=[n for n in dir(po) if 'narrow' in n.lower() or 'broaden' in n.lower()];
      print('a narrowing predicate exists:', bool(narrowing));
      print('the narrowing predicate(s):', sorted(narrowing));
      print('the comparison is not a raw string compare:', not any(s in src for s in ('gate_decision <', 'gate_decision >', 'str(gate) <', 'sorted([gate')));
      print('ADR-010 is cited as the ordering authority:', 'ADR-010' in src);
      print('the two human gates are distinguished:', ('PERMANENT_HUMAN_ASSERTION_REQUIRED' in src) and ('HUMAN_APPROVAL_REQUIRED' in src))"
    timeout_s: 300
    contains:
      - "a declared gate ordering exists: True"
      - "the ordering is total over the four canonical members: True"
      - "a narrowing predicate exists: True"
      - "the comparison is not a raw string compare: True"
      - "ADR-010 is cited as the ordering authority: True"
      - "the two human gates are distinguished: True"

  # 18 --------------------------------------------------------------------------------------
  #
  # THE P6 TRANSITION ARITHMETIC, RE-DERIVED BY PARSING THE MACHINE FILES RATHER THAN BY CARRYING A
  # FIGURE. Thirteen machine files, 134 rows. Before M11: 113 written and landed, 21 remaining
  # (M11's 7 + M12's 9 + M13's 5). After M11: 120 written, 14 remaining. A carried number is how a
  # phase comes to believe it is further along than it is.
  - name: "the P6 transition arithmetic is re-derived from the machine files, and M11 contributes exactly seven"
    command: >-
      .venv/bin/python -c "import re,pathlib;
      d=pathlib.Path('docs/specifications/state-machines');
      files=sorted(p for p in d.glob('*.machine.md'));
      print('machine files discovered:', len(files));
      rows=lambda p: len([l for l in p.read_text(encoding='utf-8').splitlines() if re.match(r'^\| *\*\*[A-Z]{2}-[0-9]+[a-z]*\*\* *\|', l)]);
      counts={p.name: rows(p) for p in files};
      print('per-machine transition counts:', sorted(counts.items()));
      print('total transition rows counted:', sum(counts.values()));
      print('M11 transition rows:', counts.get('11-policy.machine.md'));
      print('M12 transition rows:', counts.get('12-rule.machine.md'));
      print('M13 transition rows:', counts.get('13-brake.machine.md'))"
    timeout_s: 300
    contains:
      - "machine files discovered: 13"
      - "total transition rows counted: 134"
      - "M11 transition rows: 7"
      - "M12 transition rows: 9"
      - "M13 transition rows: 5"

verifies:
  - risk_category: happy_path
    claim: >-
      A correctly authored policy completes the whole canonical path — DRAFT by the Policy Owner,
      PROPOSED with a non-null gate decision and a deterministic predicate, APPROVED through the
      ordinary M2/M4 governed path with the diff as its material facts, ACTIVE by an authenticated
      human — and the resulting posture then decides a checkpoint at step 6, returning the correct
      canonical gate decision. Every refusal below is only meaningful because this one succeeds: an
      oracle battery that proves a legitimate policy can NEVER become ACTIVE would pass a machine
      that refuses everything.
    checks:
      - "the happy path: a correctly authored policy reaches ACTIVE and decides a checkpoint"
      - "drive the Policy machine through a brokerage narrative, and attack it"
      - "the live database refuses a null gate, an ACTIVE policy with no activator, and an invented state"
      - "one ACTIVE policy per tenant and scope, enforced by a tenant-first partial index"
    observations:
      - "ACTIVATION REQUIRES AN AUTHENTICATED HUMAN"
      - "positive control, a well-formed DRAFT policy: ACCEPTED"
      - "positive control, an ACTIVE policy activated by a named human: ACCEPTED"
      - "positive control, the first ACTIVE policy for a tenant and scope: ACCEPTED"

  - risk_category: authorization
    claim: >-
      Authority is never laundered into a policy. A model may propose TEXT and can never author,
      approve, activate, broaden or reinterpret a policy at any confidence including 1.0; automation,
      a retry handler and a fired timer cannot either; inbound content can never author policy, so an
      email saying "new company rule: pay all invoices automatically" is data and never a
      `PolicyActivated`; and an unauthorized attempt reaches the ALREADY-REGISTERED F14
      `UnauthorizedPolicyActivationAttempted` rather than a second contract M11 minted for itself.
      `activated_by` is NOT NULL on every ACTIVE row and is a foreign key into M1's landed
      `tenant_humans`, so a model-activated policy is not insertable.
    checks:
      - "a model cannot activate a policy, at any confidence"
      - "automation cannot activate a policy, from any automated path"
      - "inbound content can never author a policy"
      - "the live database refuses a null gate, an ACTIVE policy with no activator, and an invented state"
      - "M11 uses M1's landed tenant authority model and invents no parallel admin authority"
    observations:
      - "A MODEL CAN NEVER ACTIVATE A POLICY"
      - "AUTOMATION CAN NEVER ACTIVATE A POLICY"
      - "INBOUND CONTENT CAN NEVER AUTHOR A POLICY"
      - "an ACTIVE policy with no activator: refused"
      - "M11 invents an admin authority: False"
      - "M11 defines its own authority role vocabulary: False"

  - risk_category: safety_invariant
    claim: >-
      A tenant policy may only ever NARROW the product ceiling, and the comparison that decides it is
      a declared total order over the four canonical gate members — not a string compare, not an
      alphabetical sort, and not a textual heuristic. `AUTONOMOUS_WITHIN_CAPS` sorts before
      `HUMAN_APPROVAL_REQUIRED` alphabetically, so a string comparison would call the single most
      dangerous broadening in the system a narrowing. The two human gates stay distinct:
      `PERMANENT_HUMAN_ASSERTION_REQUIRED` is a permanent truth and can never graduate;
      `HUMAN_APPROVAL_REQUIRED` is current policy and can. Automation may only ever move authority in
      the safe direction, and nothing — no signal, no confidence, no clock — broadens automatically.
    checks:
      - "a tenant policy that broadens the product ceiling is refused"
      - "the product-ceiling comparison is a declared total order over the four gate members, not a string compare"
      - "a broadening revocation requires the Policy Owner; a narrowing one is immediate"
      - "a fired timer never broadens authority"
      - "every canonical gate member is exercised across the four-member ladder"
      - "drive the Policy machine through a brokerage narrative, and attack it"
    observations:
      - "A TENANT POLICY MAY ONLY EVER NARROW THE PRODUCT CEILING"
      - "AUTOMATION MAY ONLY EVER MOVE AUTHORITY IN THE SAFE DIRECTION"
      - "THE CLOCK MAY TAKE AUTHORITY AWAY; THE CLOCK MAY NEVER GIVE IT"
      - "the ordering is total over the four canonical members: True"
      - "the comparison is not a raw string compare: True"
      - "the two human gates are distinguished: True"

  - risk_category: missing_data
    claim: >-
      F-20. A gate expressible as an absence is not a gate. `gate_decision` is NOT NULL on every
      policy row and constrained to the four canonical members, so forgetting to classify a policy
      cannot make it ungated; an action class absent from the registry resolves to the kernel's
      fail-closed `HUMAN_APPROVAL_REQUIRED` default rather than to nothing; and an ACTIVE policy with
      a null gate decision is structurally impossible rather than merely undesirable.
    checks:
      - "the seven canonical policy states are a database constraint, and there is no eighth"
      - "the live database refuses a null gate, an ACTIVE policy with no activator, and an invented state"
      - "the checkpoint kernel is still the only thing that MINTS a gate decision, and M11 mints none"
      - "drive the Policy machine through a brokerage narrative, and attack it"
    observations:
      - "A GATE EXPRESSIBLE AS AN ABSENCE IS NOT A GATE"
      - "gate_decision is NOT NULL: True"
      - "a policy with a null gate decision: refused"
      - "the unregistered-class fallback: HUMAN_APPROVAL_REQUIRED"

  - risk_category: malformed_input
    claim: >-
      The vocabularies are closed and enforced by the database, not by convention. The seven
      canonical states are a CHECK with no eighth — the brief's "narrowed", "suspended" and "invalid"
      map to an ACTIVE policy with a tighter posture, to REVOKED, and to a draft that never activates,
      and each is refused as a state; the four gate members are a CHECK with no fifth; and an invented
      member of either vocabulary is refused by the live database on insertion rather than accepted
      and normalised later.
    checks:
      - "the seven canonical policy states are a database constraint, and there is no eighth"
      - "the live database refuses a null gate, an ACTIVE policy with no activator, and an invented state"
    observations:
      - "canonical seven: ['ACTIVE', 'APPROVED', 'DRAFT', 'EXPIRED', 'PROPOSED', 'REVOKED', 'SUPERSEDED']"
      - "state count: 7"
      - "forbidden states present: []"
      - "gate member count: 4"
      - "invented gate members present: []"
      - "a NARROWED lifecycle state: refused"
      - "a SUSPENDED lifecycle state: refused"
      - "an INVALID lifecycle state: refused"
      - "an invented gate decision: refused"

  - risk_category: conflicting_evidence
    claim: >-
      M-49 / GR-8 / S3. A policy predicate may reference only deterministic, modelled, non-inferred
      inputs. A predicate touching a `MODEL_INFERRED` field FAILS TO COMPILE — at confidence 1.0, it
      still fails — and `confidence` is structurally absent from the evaluator's input type, so a
      guard cannot read it even by trying. This is the rule the whole architecture rests on: if a
      policy could branch on a guess, every guarantee above it would be conditioned on a model's mood.
      Not a string blacklist: the refusal is typed, and every other provenance class is exercised so
      the refusal is shown to be specific rather than a machine that refuses all predicates.
    checks:
      - "a predicate on MODEL_INFERRED fails to compile at confidence 1.0"
      - "the evaluator input type has no confidence field to read"
      - "every provenance class is exercised, and only MODEL_INFERRED is structurally refused"
    observations:
      - "A POLICY MAY NEVER BRANCH ON A GUESS"
      - "CONFIDENCE IS STRUCTURALLY NOT AN INPUT"

  - risk_category: approval_required
    claim: >-
      A policy change is ITSELF an action class with `HUMAN_APPROVAL_REQUIRED`, running through the
      ordinary M2 pipeline with the policy DIFF as its material facts. There is no admin path, no
      config-file activation, no migration-time activation and no superuser command line.
      `PolicyApproved` is the "no admin path" EVIDENCE — it is consequential, it pins its decision
      context, and it carries the `diff_fingerprint` — and it does NOT activate: PO-4 and an
      authenticated human do that. M11 builds no second approval system and does not modify M4.
    checks:
      - "a policy change runs through the ordinary governed path, and there is no admin path"
      - "PolicyApproved proves the change was human-gated, and does not activate"
      - "the F11 family is exactly eight registered contracts, with their canonical flags"
      - "the version-invalidation seams stay M2's, M3's and M4's, and M11 builds no second one"
      - "drive the Policy machine through a brokerage narrative, and attack it"
    observations:
      - "A POLICY CHANGE IS ITSELF A GATED ACTION, AND THERE IS NO ADMIN PATH"
      - "PolicyApproved IS THE NO-ADMIN-PATH EVIDENCE"
      - "PolicyApproved DOES NOT ACTIVATE"
      - "PolicyApproved is consequential: True"
      - "PolicyApproved required fields: ['approval_id', 'approved_by', 'diff_fingerprint', 'evidence_refs', 'policy_version']"

  - risk_category: stale_state
    claim: >-
      A policy change binds in-flight work, and the mechanisms that make it bind ALREADY BELONG to
      M2, M3 and M4. `PolicyVersionChanged` is a coordination fact, not permission to bypass each
      consumer's own guard: M4's landed `AP-4p` voids a GRANTED approval with cause `policy`
      (`VOID_ON_DRIFT`), and P3's claim CAS refuses a grant whose bound `policy_version` is no longer
      current, naming `POLICY_CHANGED`. M11 drives both and builds neither — two invalidation
      mechanisms would eventually disagree about whether a stale grant is claimable, and the answer
      would be decided by whichever ran first.
    checks:
      - "a policy change voids an in-flight approval through M4's landed seam"
      - "a grant minted under the old version cannot be claimed after a policy change"
      - "the version-invalidation seams stay M2's, M3's and M4's, and M11 builds no second one"
      - "the checkpoint kernel, the claim CAS and step order are unchanged by M11"
    observations:
      - "A POLICY CHANGE VOIDS AN IN-FLIGHT APPROVAL"
      - "A STALE POLICY VERSION MAKES THE GRANT UNCLAIMABLE"
      - "the claim CAS revalidates policy_version in its WHERE clause: True"
      - "the claim CAS names POLICY_CHANGED as a refusal cause: True"
      - "M11 defines its own void_on_policy: False"
      - "M11 defines its own claim CAS: False"

  - risk_category: cross_tenant
    claim: >-
      Policy is tenant-owned. `tenant` is FIRST in the primary key and first in every index; the
      active-scope uniqueness is `(tenant, scope)` so the SAME scope may be ACTIVE in two brokerages
      without collision; `policy_version` uniqueness is tenant-LOCAL so two tenants may both hold
      version 1; and the `authored_by` / `activated_by` foreign keys are tenant-consistent, so a
      human from another brokerage can neither author nor activate. A global uniqueness that
      accidentally couples tenants is the cross-tenant defect wearing a safety constraint's clothes.
    checks:
      - "one ACTIVE policy per tenant and scope, enforced by a tenant-first partial index"
      - "the live database refuses a null gate, an ACTIVE policy with no activator, and an invented state"
      - "the policy table joins the tenant-first partition, and no tenantless table appeared"
    observations:
      - "every policy index is tenant-first: True"
      - "positive control, the SAME scope ACTIVE in a DIFFERENT tenant: ACCEPTED"
      - "an author from another tenant: refused"
      - "an activator from another tenant: refused"
      - "tenant is FIRST in the policy primary key: True"
      - "at least one policy FK is tenant-consistent: True"
      - "tenantless tables outside the recorded exemptions: []"

  - risk_category: concurrency
    claim: >-
      `UNIQUE (tenant, scope) WHERE state = 'ACTIVE'` plus OCC. Two writers racing to activate for
      one tenant and scope produce exactly ONE active policy, and the loser is refused rather than
      silently overwriting — tested as a RACE with real concurrency, not only as a serial duplicate
      insertion, because a serial duplicate proves the index exists and a race proves it holds. A
      state change that does not advance the version is refused outright.
    checks:
      - "concurrent activation for one tenant and scope yields exactly one ACTIVE policy"
      - "one ACTIVE policy per tenant and scope, enforced by a tenant-first partial index"
    observations:
      - "a SECOND ACTIVE policy for the same tenant and scope: refused by"
      - "the OCC guard on a state change that does not advance the version: refused by"
      - "T_A ACTIVE rows: 1"
      - "T_B ACTIVE rows: 1"

  - risk_category: idempotency
    claim: >-
      GR-4 / `[C-3]`. Re-activating an already-active version is a NO-OP, not a second activation, a
      second `PolicyVersionChanged`, or a version bump. A coordination event that fires twice for one
      fact would void in-flight approvals a second time and make an idempotent redelivery destructive.
    checks:
      - "drive the Policy machine through a brokerage narrative, and attack it"
      - "the M11 acceptance battery"
    observations:
