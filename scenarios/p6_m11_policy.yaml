  # 2 ---------------------------------------------------------------------------------------
  #
  # THE FROZEN SEVEN, AS A DATABASE CONSTRAINT. The machine file's own opening paragraph exists to
  # refuse `NARROWED`, `SUSPENDED` and `INVALID` — "narrowed" is an ACTIVE policy with a tighter
  # posture and a new version, "suspended" is REVOKED, and an invalid draft never activates. Those
  # three, plus the ordinary inventions (`PENDING`, `ENABLED`, `DISABLED`, `CANCELLED`), are the
  # eighth state this asserts cannot exist.
  - name: "the seven canonical policy states are a database constraint, and there is no eighth"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys,re; sys.path.insert(0,'src');
