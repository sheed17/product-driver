  # 5 ---------------------------------------------------------------------------------------
  #
  # MIGRATION PARITY. An upgraded database and a fresh one must be the same database. A migration
  # that creates a slightly different `policies` than `create_canonical_schema` does is how a
  # constraint that passes every test in CI is absent in the one database that matters.
  - name: "an upgraded database and a fresh database carry the identical policy layer"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys,inspect; sys.path.insert(0,'src');
      from freight_recon.schema import (create_canonical_schema, schema_readiness_problems,
      enable_and_verify_foreign_keys);
      import freight_recon.migrations.phase6_policies as mg;
      norm=lambda s: ' '.join((s or '').split());
      shape=lambda c: sorted([(r[0], norm(r[1])) for r in c.execute('select name, sql from sqlite_master where tbl_name=? and sql is not null', ('policies',))]);
      want=('MIGRATION_ID','P6PO_SCHEMA_VERSION','P6PO_TENANT_TABLES','P6PO_EXEMPT_TABLES','P6PO_TARGET_SCHEMA','P6PO_INDEXES','create_phase6_policies_schema','stamp_phase6_policies_version','phase6_policies_readiness_problems');
      print('the migration exposes the canonical P6 symbol set:', sorted(s for s in want if not hasattr(mg, s)) == []);
      print('missing canonical symbols:', sorted(s for s in want if not hasattr(mg, s)));
      print('the policy table is declared tenant-owned:', list(mg.P6PO_TENANT_TABLES) == ['policies']);
      print('the migration declares no tenant-exempt table:', list(mg.P6PO_EXEMPT_TABLES) == []);
      fresh=sqlite3.connect(os.path.join(tempfile.mkdtemp(),'fresh.sqlite3')); create_canonical_schema(fresh); enable_and_verify_foreign_keys(fresh);
      up=sqlite3.connect(os.path.join(tempfile.mkdtemp(),'up.sqlite3')); create_canonical_schema(up); enable_and_verify_foreign_keys(up);
      [up.execute('drop trigger if exists ' + n) for n in list(getattr(mg, 'P6PO_TRIGGERS', {}))];
      [up.execute('drop index if exists ' + n) for n in list(mg.P6PO_INDEXES)];
      up.execute('drop table if exists policies'); up.commit();
      print('the policy layer was actually removed before the upgrade:', shape(up) == []);
      fn=mg.create_phase6_policies_schema;
      kw={'now': '2026-09-02T00:00:00Z'} if 'now' in inspect.signature(fn).parameters else {};
      first=fn(up, **kw);
      print('the migration performed work on a database missing the layer:', bool(first));
      second=fn(up, **kw);
      print('a second application of the migration is a no-op:', second == []);
      print('fresh policy objects:', len(shape(fresh)));
      print('upgraded policy objects:', len(shape(up)));
      print('the upgraded policy layer is identical to the fresh one:', shape(fresh) == shape(up));
      print('upgraded database readiness problems:', schema_readiness_problems(up));
      print('the migration reports no readiness problem:', mg.phase6_policies_readiness_problems(up) == [])"
    timeout_s: 600
