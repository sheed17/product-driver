    observations:
      - "THE OLD VERSION IS RETAINED BECAUSE EFFECTS WERE JUDGED UNDER IT"
      - "A POLICY IS NEVER RETROACTIVE"
      - "a reused policy_version inside one tenant: refused by"
      - "a DELETE against a policy row: refused by"
      - "positive control, a SUPERSEDED policy for the same scope is retained beside it: ACCEPTED"

  - risk_category: service_unavailable
    claim: >-
      FAIL CLOSED. The policy engine unavailable at checkpoint means no policy decision, which means
      no witness, which means no effect. A decision that cannot be REPRODUCED makes the grant
      unclaimable. There is no "allow on error" default anywhere in the path — an allow-on-error
      default is how the money fence dies, and it dies quietly, at exactly the moment the system is
      least able to tell anyone.
    checks:
      - "the policy engine unavailable at checkpoint yields no witness and no effect"
      - "drive the Policy machine through a brokerage narrative, and attack it"
    observations:
      - "NO POLICY DECISION MEANS NO WITNESS AND NO EFFECT"
      - "THERE IS NO ALLOW-ON-ERROR DEFAULT"

  - risk_category: boundary
    claim: >-
      M-50. Given the same inputs and the same `policy_version`, evaluation produces a byte-identical
      `PolicyDecision`, with a mandatory `reason` on PERMIT as well as on DENY. No wall clock, no
      randomness, no model call, no external mutable state and no unordered iteration may move the
      answer. A system that can block but not explain has merely relocated the owner's problem.
    checks:
      - "evaluation is byte-identical reproducible under the same version and inputs"
      - "drive the Policy machine through a brokerage narrative, and attack it"
    observations:
      - "EVALUATION IS BYTE-IDENTICAL REPRODUCIBLE"

  - risk_category: unexpected_state_transition
    claim: >-
      A narrowing policy may carry an expiry; a broadening one may never. Its expiry is itself a
      BROADENING event, so a fired timer raises the canonical human-confirmation Exception through
      M9's landed seam rather than restoring authority on its own — otherwise "temporarily tighten"
      becomes "automatically loosen later, when nobody is watching". The direction is a persisted,
      checkable column and the constraint is a database CHECK, not a promise the machine makes to
      itself, and there is no temporary-tighten-then-automatic-revert path anywhere.
    checks:
      - "a narrowing policy's expiry raises the M9 human-confirmation Exception and broadens nothing"
      - "a fired timer never broadens authority"
      - "only a narrowing policy may carry an expiry, and the direction is a persisted fact"
      - "M11 raises its expiry Exception through M9's landed seam and edits no part of M9"
    observations:
      - "AN EXPIRY THAT BROADENS REQUIRES A HUMAN AT EXPIRY"
      - "the narrowing direction is a persisted column: True"
      - "a CHECK constrains expiry to the narrowing direction: True"
      - "M11 writes the exceptions table directly: False"

  - risk_category: retry_safety
    claim: >-
      Never a model, never automation, never a RETRY HANDLER activates or broadens policy. A retry
      path is the one automated caller that most plausibly looks like a human's intent replayed, and
      it is named explicitly in the authority for exactly that reason. Revocation direction is
      likewise not symmetric: narrowing may be immediate and may be automated; broadening requires
      the named Policy Owner.
    checks:
      - "a broadening revocation requires the Policy Owner; a narrowing one is immediate"
      - "automation cannot activate a policy, from any automated path"
    observations:
      - "A NARROWING REVOCATION IS IMMEDIATE; A BROADENING ONE NEEDS THE OWNER"
      - "AUTOMATION CAN NEVER ACTIVATE A POLICY"

  - risk_category: restart_recovery
    claim: >-
      GR-11 / K-3. Replay reconstructs policy history and the decisions made under each version, and
      creates NO authority: it does not re-activate a policy, does not mint a witness, does not claim
      a grant, and produces no external effect. A replay that could re-activate is a replay that can
      grant authority nobody granted, from a log.
    checks:
      - "replay reconstructs policy history and creates no authority"
      - "the event registry and replay isolation are unchanged by M11"
    observations:
      - "REPLAY CREATES NO AUTHORITY"

  - risk_category: persistence_failure
    claim: >-
      GR-2. The state change and its events are ONE commit. There is no ACTIVE row without its
      `PolicyActivated` and `PolicyVersionChanged`, no APPROVED row without its `PolicyApproved`, and
      a persistence failure leaves no half-activated policy. An event without its state change is a
      lie about authority; a state change without its event is authority nobody can audit.
    checks:
      - "drive the Policy machine through a brokerage narrative, and attack it"
      - "the M11 acceptance battery"
      - "an upgraded database and a fresh database carry the identical policy layer"
    observations:
      - "behaviours as specified, 0 wrong"
      - "the upgraded policy layer is identical to the fresh one: True"
      - "upgraded database readiness problems: []"

  - risk_category: regression
    claim: >-
      M11 integrates with the checkpoint rather than duplicating it, and touches no landed machine.
      `checkpoint.py` remains the SOLE gate minter — a gate decision comes into existence only by
      constructing a `GateEntry` or a `GateRegistry`, and M11 constructs neither — while the ADR-010
      CARRIER boundary legitimately widens to include M11, exactly as `pipeline_instance.py` widened
      it at `P6-CP-2`: a widening with a narrowing attached, and every carrier still cites ADR-010.
      M1 through M10 stay green, the F11 registry keeps exactly eight contracts with no ninth, and
      the P6 transition arithmetic is re-derived from the machine files rather than carried.
    checks:
      - "the checkpoint kernel is still the only thing that MINTS a gate decision, and M11 mints none"
      - "the ADR-010 carrier boundary is stated once, includes M11, and every carrier cites its authority"
      - "the ADR-010 gate boundary still confines minting to the checkpoint kernel"
      - "M1, M2, M3 and M4 stay green beside M11"
      - "M9 and M10, the machines M11 consumes and must not edit, stay green"
      - "M11 emits only registered event names, and mints no ninth F11 contract"
      - "the P6 transition arithmetic is re-derived from the machine files, and M11 contributes exactly seven"
      - "the tenant-first posture and bootstrap hermeticity survive a new canonical table"
      - "drive the Policy machine through a brokerage narrative, and attack it"
      - "the F11 family is exactly eight registered contracts, with their canonical flags"
    observations:
      - "M11 MINTS NO GATE DECISION"
      - "THE CHECKPOINT IS STILL THE ONLY GATE MINTER"
      - "M11 BUILDS NO SECOND CHECKPOINT"
      - "modules that MINT a gate decision: ['checkpoint.py']"
      - "M11 constructs a GateEntry or GateRegistry: False"
      - "the discovered population equals the stated boundary: True"
      - "carriers without an ADR-010 citation: []"
      - "unregistered event names M11 mints: []"
      - "F11 contract count: 8"
      - "total transition rows counted: 134"
      - "M11 transition rows: 7"
      - "THE M1 WORK ITEM MACHINE IS UNCHANGED"
      - "THE M10 COMPENSATION MACHINE IS UNCHANGED"

  - risk_category: partial_failure
    claim: >-
      Precedence is deterministic and a policy is never the top of the ladder: Constraint > Permanent
      Product Truth > Brake > Product Policy > Tenant Policy > Rules > Workflow default. A policy
      never overrides a Permanent Product Truth and never overrides a brake denial, however urgent
      the policy claims to be — and M11 exercises the LANDED P3 brake seam rather than pulling M13
      into scope. A brake denies regardless of what policy permits.
    checks:
      - "a policy never overrides a permanent product truth"
      - "a brake denies regardless of what policy permits, urgent or not"
      - "M11 ships dark: zero production importers, and no channel-capable module reaches it"
    observations:
      - "A POLICY NEVER OVERRIDES A PERMANENT PRODUCT TRUTH"
      - "A POLICY NEVER OVERRIDES A BRAKE DENIAL"
      - "M11 imports the brake store: False"

  - risk_category: unexpected_state_transition
    claim: >-
      The F11 event contracts are exact and the PO-1 / PO-2 naming collision stays RESOLVED.
      `PolicyProposed` is PO-1's — a draft was AUTHORED — and `PolicySubmitted` is PO-2's — a draft
      was PUT FORWARD for approval with a non-null gate decision. They are separate historical facts
      and collapsing them would rewrite the meaning of every historical `PolicyProposed`, which is why
      the 2026-08-12 amendment MINTED the second rather than re-attributing the first. F11 ordering is
      STRICT per aggregate, which is ORDER and never CONTIGUITY.
    checks:
      - "PolicySubmitted is a separate historical fact from PolicyProposed"
      - "the F11 family is exactly eight registered contracts, with their canonical flags"
      - "M11 emits only registered event names, and mints no ninth F11 contract"
    observations:
      - "PolicySubmitted IS NOT A RENAME OF PolicyProposed"
      - "PolicyProposed producer: ['PO-1']"
      - "PolicySubmitted producer: ['PO-2']"
      - "every F11 contract is strict_order: True"
      - "M11 names PolicyEvaluated, which is M2s: False"

  - risk_category: dependency_failure
    claim: >-
      M11 ships dark and grows no reachability. Zero production importers, no channel-capable module
      in its import closure, no network primitive, no timer service, no adapter, no production policy
      editor and no admin surface. And the units after it are NOT built: no M12 Rule lifecycle, no
      M13 Brake lifecycle, no autonomy-graduation engine, no `rules` table. Policy and Rule share
      compilation concepts by canon, which is exactly why "shared machinery" is the door M12 would
      arrive through — so the absence is measured over a discovered population rather than asserted.
      V11 (graduation thresholds) and V12 (per-tenant authorities) stay OPEN at their fail-closed
      defaults: nothing graduates, one Policy Owner, one authority level.
    checks:
      - "M11 ships dark, and M12 and M13 do not exist"
      - "M11 ships dark: zero production importers, and no channel-capable module reaches it"
      - "M12 Rule and M13 Brake are not built, and no autonomy-graduation engine exists"
      - "M11 uses M1's landed tenant authority model and invents no parallel admin authority"
      - "drive the Policy machine through a brokerage narrative, and attack it"
    observations:
      - "M11 SHIPS DARK WITH ZERO PRODUCTION IMPORTERS"
      - "THE M12 RULE MACHINE IS NOT BUILT"
      - "THE M13 BRAKE MACHINE IS NOT BUILT"
      - "NOTHING GRADUATES"
      - "production importers of policy: []"
      - "channel-capable modules that import policy: []"
      - "an M12 rules table exists: False"
      - "M11 defines an autonomy graduation engine: False"
      - "the canonical tenant authority roles: ['AUTHORIZED_HUMAN', 'POLICY_OWNER']"

