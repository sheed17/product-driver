      print('a tenant-local policy_version uniqueness exists:', any(re.search('[(] *tenant *, *policy_version *[)]', s) for s in uniq));
      ddl=lambda t: (lambda r: r[0] if r else '')(c.execute('select sql from sqlite_master where name=?', (t,)).fetchone());
      vocab=lambda t: dict([(m[0], re.findall(chr(39) + '([^' + chr(39) + ']*)' + chr(39), m[2])) for m in reversed(re.findall('([A-Za-z0-9_]+) +(NOT +)?IN *[(]([^)]*)[)]', ddl(t))) if not m[1]]);
      info=lambda t: list(c.execute('pragma table_info(' + t + ')')); colsof=lambda t: [r[1] for r in info(t)];
      env={'c':c,'sqlite3':sqlite3,'vocab':vocab,'info':info,'colsof':colsof,'T':T};
      exec(chr(10).join(['def pick(v, r):',' n = r[1].lower()',' if r[4] is not None: return str(r[4]).strip(chr(39))',\" if r[1] in v and v[r[1]]: return int(v[r[1]][0]) if 'INT' in (r[2] or '').upper() else v[r[1]][0]\",\" if 'INT' in (r[2] or '').upper(): return 1\",\" if n.endswith('_at') or n.endswith('_from'): return '2026-09-02T00:00:00Z'\",\" return 'x'\",'def build(t, known):',' d = dict([(r[1], pick(vocab(t), r)) for r in info(t) if r[3]])',' d.update(dict([(k, v) for k, v in known.items() if k in colsof(t)]))',' return d','def ins(t, d):',\"  c.execute('insert into ' + t + ' (' + ','.join(d) + ') values (' + ','.join(['?']*len(d)) + ')', list(d.values()))\",'def attempt(label, d):',' try:',\"  c.execute('savepoint s'); ins(T, d); c.execute('release s'); print(label + ': ACCEPTED')\",' except sqlite3.Error as exc:',\"  c.execute('rollback to s'); c.execute('release s'); print(label + ': refused by ' + str(exc).split(chr(10))[0])\",'def sql(label, stmt, params):',' try:',\"  c.execute('savepoint m'); cur = c.execute(stmt, params); c.execute('release m'); print(label + ': ACCEPTED, rows=' + str(cur.rowcount))\",' except sqlite3.Error as exc:',\"  c.execute('rollback to m'); c.execute('release m'); print(label + ': refused by ' + str(exc).split(chr(10))[0])\"]), env);
      build=env['build']; ins=env['ins']; attempt=env['attempt']; sql=env['sql'];
