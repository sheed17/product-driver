      tenantless=sorted(t for t in live if 'tenant' not in cols(t) and t not in exempt);
      print('tenantless tables outside the recorded exemptions:', tenantless);
      print('policies carries a tenant column:', 'tenant' in cols('policies'));
      print('tenant is FIRST in the policy primary key:', (pk('policies') or [''])[0] == 'tenant');
      print('the policy primary key:', pk('policies'));
      fks=sorted(set(r[2] for r in c.execute('pragma foreign_key_list(policies)')));
      print('the policy foreign-key referents:', fks);
      comp=[r for r in c.execute('pragma foreign_key_list(policies)') if r[3] == 'tenant' or r[4] == 'tenant'];
      print('at least one policy FK is tenant-consistent:', bool(comp))"
    timeout_s: 300
