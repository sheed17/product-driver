  # 14 --------------------------------------------------------------------------------------
  #
  # THE AUTHORITY MODEL IS M1's, ALREADY LANDED, AND M11 MUST USE EXACTLY IT. `tenant_humans` has
  # carried the two-member `authority_role` vocabulary since `P6-CP-1`, and `POLICY_OWNER` was put
  # there FOR this machine. So V12's fail-closed default — one Policy Owner, one authority level —
  # is already the landed shape, and M11 inventing a parallel "admin" or "superuser" authority is
  # both a scope leak and the exact bypass ADR-010 §4 forbids.
  - name: "M11 uses M1's landed tenant authority model and invents no parallel admin authority"
    command: >-
      .venv/bin/python -c "import sys,pathlib,sqlite3,tempfile,os; sys.path.insert(0,'src');
      from freight_recon.migrations.phase6_work_items import AUTHORITY_ROLES;
