      p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3'); c=sqlite3.connect(p); create_canonical_schema(c);
      live=sorted(r[0] for r in c.execute('select name from sqlite_master where type=' + chr(39) + 'table' + chr(39)) if not r[0].startswith('sqlite_'));
      print('canonical tables declared:', len(CANONICAL_TABLES));
      print('tables actually created:', len(live));
      print('every declared canonical table is created:', sorted(set(CANONICAL_TABLES) - set(live)) == []);
