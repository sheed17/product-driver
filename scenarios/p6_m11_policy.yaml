      - "the migration declares no tenant-exempt table: True"
      - "the policy layer was actually removed before the upgrade: True"
      - "the migration performed work on a database missing the layer: True"
      - "a second application of the migration is a no-op: True"
      - "the upgraded policy layer is identical to the fresh one: True"
