name: p6_m11_policy
phase: P6
mode: backend
description: >-
  P6 M11: the Policy — the typed, versioned, scoped, deterministic tenant posture evaluated at
  CHECKPOINT STEP 6, returning a NEVER-NULL canonical gate decision. This is the machine that
  answers "what may Neyma do alone, for whom, and up to what caps", and the one place in the
  architecture where the answer must be a value the owner can see, version and revoke rather than a
  sentence in a prompt. An owner types "never bill without a POD"; the old system replied
  "noted the procedure" and installed a suggestion. M11 is the mechanism that makes the difference
  real: a policy is a row with a gate decision that cannot be null, a predicate that cannot read a
  guess, a version that is bound into every witness and grant, and an activation that only an
  authenticated human can perform. The tenant posture may only ever NARROW the product ceiling —
  never broaden it — and nothing automatic may move authority in the unsafe direction: not a model
  at confidence 1.0, not a retry handler, not a timer, not an inbound email announcing a new company
  rule. M11 IS checkpoint step 6; it does not build a second checkpoint and it mints no gate
  decision of its own, because a second gate authority is the same defect as no gate authority.
  M11 ships dark. This scenario measures the DATABASE, the EVENT REGISTRY and the AST, not the
  probe's narration.

setup:
  - ".venv/bin/python scripts/check_env.py"

# The files this unit is expected to PRODUCE. Nothing here exists on the pre-M11 tree, and that is
# the point: `tests/test_scenario_pytest_invocation.py` exempts a scenario's own declared fixtures
# from the "every named test path already exists" rule, precisely so a bootstrap can be written
# before the unit it measures. Every OTHER path this file names is a landed regression anchor and
# must exist today.
fixtures:
  - "pyproject.toml"
  - "src/freight_recon/policy.py"
  - "src/freight_recon/migrations/phase6_policies.py"
  - "eval/tests/test_phase6_policy.py"
  - "scripts/probe_phase6_policy.py"
  - "scripts/mutate_phase6_policy.py"

commands:
  # ------------------------------------------------------------------ coverage and axis oracles
  - name: "the M11 probe can exercise every canonical risk family"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --list-cases"
    expect_exit_code: 0
    timeout_s: 180
    expect_contains:
      # ---- PO-1: authorship. A model may propose TEXT. Inbound content may never author.
      - "a-draft-is-authored-by-the-policy-owner-or-a-delegate"
      - "a-model-may-propose-text-and-never-author"
      - "inbound-content-can-never-author-a-policy"
      - "an-email-announcing-a-new-rule-is-data-not-a-policy-change"
      - "a-counterparty-cannot-author-a-policy"
      - "an-offboarded-human-cannot-author-a-policy"
      - "po-1-emits-policyproposed"
      - "policyproposed-does-not-prove-the-policy-is-active"
      # ---- PO-2: submission. Never-null gate, deterministic predicate, narrow-only.
      - "submission-requires-a-non-null-gate-decision"
      - "a-null-gate-decision-is-refused-at-submission"
      - "an-invented-gate-decision-is-refused"
      - "the-four-canonical-gate-members-and-no-fifth"
      - "a-predicate-on-model-inferred-fails-to-compile"
      - "confidence-one-does-not-make-model-inferred-readable"
      - "the-evaluator-input-type-has-no-confidence-field"
      - "a-predicate-on-an-unmodelled-field-fails-to-compile"
      - "a-tenant-policy-that-broadens-the-product-ceiling-is-refused"
      - "narrowing-within-the-product-ceiling-is-accepted"
      - "the-ceiling-comparison-is-structural-not-textual"
      - "po-2-emits-policysubmitted"
      - "policysubmitted-is-not-a-rename-of-policyproposed"
      # ---- PO-3: the governed change. There is no admin path.
      - "approval-runs-through-the-ordinary-m2-governed-path"
      - "the-policy-diff-is-the-material-facts"
      - "there-is-no-admin-path-to-approved"
      - "a-config-file-cannot-approve-or-activate-a-policy"
      - "a-migration-cannot-activate-a-policy"
      - "a-superuser-command-line-cannot-activate-a-policy"
      - "a-model-cannot-approve-a-policy-change"
      - "the-approval-id-resolves-to-a-same-tenant-m4-approval"
      - "policyapproved-carries-the-diff-fingerprint"
      - "policyapproved-is-consequential-and-pins-its-decision-context"
      - "policyapproved-does-not-activate"
      - "m11-builds-no-second-approval-system"
      # ---- PO-4: activation. Human only, at every confidence, from every automated path.
      - "activation-requires-an-authenticated-human"
      - "a-model-cannot-activate-a-policy"
      - "automation-cannot-activate-a-policy"
      - "a-retry-handler-cannot-activate-or-broaden-policy"
      - "a-timer-cannot-activate-a-policy"
      - "an-unauthorized-activation-emits-the-registered-f14-security-event"
      - "m11-mints-no-second-unauthorized-activation-contract"
      - "active-requires-a-non-null-activated-by"
      - "the-activator-is-the-policy-owner-or-an-authorized-delegate"
      - "a-cross-tenant-activator-is-refused"
      - "po-4-emits-policyactivated-and-policyversionchanged"
      - "policyactivated-does-not-apply-retroactively"
      - "re-activating-an-already-active-version-is-a-no-op"
      # ---- PO-5: supersession. The old version is retained, permanently.
      - "a-newer-version-supersedes-the-active-one"
      - "the-superseded-version-is-retained-permanently"
      - "the-superseded-version-still-explains-its-historical-decisions"
      - "supersession-never-edits-history-in-place"
      - "po-5-emits-policysuperseded"
      # ---- PO-6: revocation. Direction is the whole content of the transition.
      - "a-narrowing-revocation-is-immediate"
      - "a-broadening-revocation-requires-the-policy-owner"
      - "automation-cannot-perform-a-broadening-revocation"
      - "policyrevoked-carries-the-canonical-direction"
      - "revocation-emits-policyversionchanged"
      - "there-is-no-temporary-tighten-then-automatic-revert-path"
      # ---- PO-7: expiry. A narrowing policy's expiry BROADENS, so a human confirms it.
      - "only-a-narrowing-policy-may-carry-an-expiry"
      - "a-broadening-policy-cannot-carry-an-expiry"
      - "timerfired-never-broadens-authority"
      - "expiry-raises-the-m9-human-confirmation-exception"
      - "m11-builds-no-part-of-m9"
      - "po-7-emits-policyexpired"
      - "policyexpired-does-not-prove-automatic-broadening"
      # ---- evaluation: deterministic, reproducible, fail-closed
      - "evaluation-is-byte-identical-reproducible"
      - "no-wall-clock-enters-the-policy-decision"
      - "no-randomness-enters-the-policy-decision"
      - "no-model-call-enters-the-policy-decision"
      - "unordered-iteration-does-not-change-the-policy-decision"
      - "the-policy-decision-carries-a-mandatory-reason"
      - "an-unreproducible-decision-makes-the-grant-unclaimable"
      - "the-policy-engine-unavailable-yields-no-witness-and-no-effect"
      - "there-is-no-allow-on-policy-error-path"
      # ---- the checkpoint boundary: M11 IS step 6, and there is only one of it
      - "m11-is-checkpoint-step-6-and-builds-no-second-checkpoint"
      - "m11-mints-no-gate-decision"
      - "checkpoint-py-remains-the-sole-gate-minter"
      - "m11-constructs-no-gateentry-and-no-gateregistry"
      - "an-unregistered-action-class-falls-to-the-human-default"
      - "the-production-gate-registry-population-stays-empty"
      - "the-policy-version-is-bound-into-the-witness-and-the-grant"
      # ---- version binding and staleness: M2/M3/M4 already own the invalidation
      - "a-stale-policy-version-grant-claim-is-refused"
      - "the-claim-cas-revalidates-policy-version-through-p3"
      - "m11-builds-no-second-claim-cas"
      - "policyversionchanged-voids-an-in-flight-m4-approval"
      - "m11-drives-m4s-landed-void-on-policy-seam"
      - "m11-does-not-mutate-m4-state-directly"
      # ---- precedence: a policy is never the top of the ladder
      - "a-policy-never-overrides-a-permanent-product-truth"
      - "a-policy-never-overrides-a-brake-denial"
      - "an-urgent-policy-does-not-bypass-the-brake"
      - "m11-engages-no-brake-and-narrows-none"
      # ---- tenancy
      - "tenant-is-first-in-the-policy-primary-key"
      - "the-same-scope-in-two-tenants-does-not-collide"
      - "a-cross-tenant-policy-lookup-is-refused"
      - "a-cross-tenant-activation-is-refused"
      - "a-cross-tenant-supersession-is-refused"
      - "policy-version-uniqueness-is-tenant-local"
      # ---- uniqueness, concurrency, OCC, monotonicity
      - "one-active-policy-per-tenant-and-scope"
      - "concurrent-activation-yields-exactly-one-active-policy"
      - "a-stale-occ-write-is-refused"
      - "policy-version-is-monotonic-per-tenant"
      - "a-policy-version-is-never-reused"
      # ---- retention: every version, permanently
      - "a-policy-row-cannot-be-deleted"
      - "every-historical-version-is-retained"
      - "a-policy-change-is-never-retroactive"
      - "an-old-decision-is-explained-under-its-own-version"
      # ---- replay creates no authority
      - "replay-reconstructs-policy-history-only"
      - "replay-creates-no-human-authority"
      - "replay-does-not-reactivate-a-policy"
      - "replay-mints-zero-witnesses-grants-and-effects"
      # ---- the event contract, exactly
      - "the-eight-f11-contracts-and-no-ninth"
      - "m11-mints-no-unregistered-event-name"
      - "policyevaluated-belongs-to-m2-and-m11-does-not-mint-it"
      - "f11-strict-order-is-order-not-contiguity"
      # ---- the dark posture, and the machines that are NOT built
      - "m11-ships-dark-with-zero-production-importers"
      - "m11-joins-no-outbound-channel"
      - "m11-builds-no-policy-editor-or-admin-surface"
      - "m12-rule-is-not-built"
      - "m13-brake-lifecycle-is-not-built"
      - "no-autonomy-graduation-engine-is-built"
      - "nothing-graduates-v11-stays-fail-closed"
      - "one-policy-owner-one-authority-level-v12-stays-fail-closed"
      - "m1-through-m10-are-unchanged"

  - name: "the M11 probe exposes a bounded, closed dimension vocabulary to vary cases with"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --list-dimensions"
    expect_exit_code: 0
    timeout_s: 180
    expect_contains:
      - "--concurrency"
      - "--delay-ms"
      - "--repeat"
      - "--tenants"
      - "--seed"
      - "--inject"
      - "--actor"
      - "--direction"
      - "--gate"
      - "--provenance"
      - "--brake"

  # ------------------------------------------------------------------ the machine, driven
  #
  # THE HEADLINES ARE THE UNIT'S OWN SENTENCES. Each one is a claim a wrong implementation cannot
  # print, because the case behind it exercises the mechanism rather than reading the docstring.
  - name: "drive the Policy machine through a brokerage narrative, and attack it"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --all"
    expect_exit_code: 0
    timeout_s: 1800
    expect_contains:
      - "behaviours as specified, 0 wrong"
      - "A POLICY IS A VALUE THE OWNER CAN SEE, NOT A SENTENCE IN A PROMPT"
      - "A TENANT POLICY MAY ONLY EVER NARROW THE PRODUCT CEILING"
      - "AUTOMATION MAY ONLY EVER MOVE AUTHORITY IN THE SAFE DIRECTION"
      - "A GATE EXPRESSIBLE AS AN ABSENCE IS NOT A GATE"
      - "A POLICY MAY NEVER BRANCH ON A GUESS"
      - "CONFIDENCE IS STRUCTURALLY NOT AN INPUT"
      - "A MODEL CAN NEVER ACTIVATE A POLICY"
      - "AUTOMATION CAN NEVER ACTIVATE A POLICY"
      - "INBOUND CONTENT CAN NEVER AUTHOR A POLICY"
      - "A POLICY CHANGE IS ITSELF A GATED ACTION, AND THERE IS NO ADMIN PATH"
      - "PolicyApproved IS THE NO-ADMIN-PATH EVIDENCE"
      - "PolicySubmitted IS NOT A RENAME OF PolicyProposed"
      - "PolicyApproved DOES NOT ACTIVATE"
      - "A POLICY IS NEVER RETROACTIVE"
      - "THE OLD VERSION IS RETAINED BECAUSE EFFECTS WERE JUDGED UNDER IT"
      - "A NARROWING REVOCATION IS IMMEDIATE; A BROADENING ONE NEEDS THE OWNER"
      - "THE CLOCK MAY TAKE AUTHORITY AWAY; THE CLOCK MAY NEVER GIVE IT"
      - "AN EXPIRY THAT BROADENS REQUIRES A HUMAN AT EXPIRY"
      - "EVALUATION IS BYTE-IDENTICAL REPRODUCIBLE"
      - "NO POLICY DECISION MEANS NO WITNESS AND NO EFFECT"
      - "THERE IS NO ALLOW-ON-ERROR DEFAULT"
      - "M11 MINTS NO GATE DECISION"
      - "THE CHECKPOINT IS STILL THE ONLY GATE MINTER"
      - "M11 BUILDS NO SECOND CHECKPOINT"
      - "A STALE POLICY VERSION MAKES THE GRANT UNCLAIMABLE"
      - "A POLICY CHANGE VOIDS AN IN-FLIGHT APPROVAL"
      - "A POLICY NEVER OVERRIDES A PERMANENT PRODUCT TRUTH"
      - "A POLICY NEVER OVERRIDES A BRAKE DENIAL"
      - "REPLAY CREATES NO AUTHORITY"
      - "M11 SHIPS DARK WITH ZERO PRODUCTION IMPORTERS"
      - "THE M12 RULE MACHINE IS NOT BUILT"
      - "THE M13 BRAKE MACHINE IS NOT BUILT"
      - "NOTHING GRADUATES"
      - "THE M1 WORK ITEM MACHINE IS UNCHANGED"
      - "THE M2 PIPELINE MACHINE IS UNCHANGED"
      - "THE M3 EFFECT AUTHORITY IS UNCHANGED"
      - "THE M4 APPROVAL MACHINE IS UNCHANGED"
      - "THE M9 EXCEPTION MACHINE IS UNCHANGED"
      - "THE M10 COMPENSATION MACHINE IS UNCHANGED"

  # ------------------------------------------------------------------ the mutation battery
  - name: "every M11 mutation is caught by the acceptance battery"
    run: ".venv/bin/python scripts/mutate_phase6_policy.py"
    expect_exit_code: 0
    timeout_s: 2400
    expect_contains:
      - "mutations caught"
      - "0 escaped"

  # ------------------------------------------------------------------ acceptance batteries
  #
  # EVERY BATTERY BELOW IS INVOKED AS `python -m pytest`, NEVER AS THE `pytest` CONSOLE SCRIPT.
  # This is the M10 harness-recovery invariant and it is not a style preference: `python -m pytest`
  # puts the invocation directory on `sys.path` and the console script does not, so a test that
  # reaches for the repository's own harness (`from eval.phase0 import gate_scan`) raises
  # `ModuleNotFoundError: No module named 'eval'` under one and passes under the other. M11 reaches
  # for that harness MORE than any unit before it, because `eval/phase0/gate_scan.py` is the
  # ADR-010 boundary M11 has to be measured against.
  #
  # `-p no:cacheprovider` matches Neyma's own CI so ambient state cannot reshape the run.
  # `passed` is required on every battery and `no tests ran` / `file or directory not found` are
  # globally forbidden, so an empty or not-found selection can never read as a green anchor.
  - name: "the M11 acceptance battery"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase6_policy.py"
    expect_exit_code: 0
    timeout_s: 1800
    expect_contains: ["passed"]

  # THE P0 ADR-010 BOUNDARY GUARDS ARE M11's SHARPEST REGRESSION ANCHOR, AND THE ONE MOST LIKELY TO
  # BE "FIXED" IN THE WRONG DIRECTION. `test_phase0_null_gate.py` and `test_phase0_errata_guards.py`
  # confine the typed gate ladder to `gate_scan.GATE_RUNTIME_MODULES` by EXACT SET EQUALITY, and
  # confine MINTING to `checkpoint.py` alone. M11 legitimately acquires gate RUNTIME (it carries a
  # tenant posture typed as a `GateDecision`), so the carrier boundary has to widen the way
  # `pipeline_instance.py` widened it at P6-CP-2 — a widening with a narrowing attached. What must
  # NOT move is the MINT allowlist. Both are run here, on every scenario execution.
  - name: "the ADR-010 gate boundary still confines minting to the checkpoint kernel"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase0_null_gate.py eval/tests/test_phase0_errata_guards.py"
    expect_exit_code: 0
    timeout_s: 900
    expect_contains: ["passed"]

  - name: "M1, M2, M3 and M4 stay green beside M11"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase6_work_item.py eval/tests/test_phase6_pipeline_instance.py eval/tests/test_phase6_external_effect.py eval/tests/test_phase6_approval.py"
    expect_exit_code: 0
    timeout_s: 2400
    expect_contains: ["passed"]

  # M9 IS THE MACHINE PO-7's EXPIRY ESCALATES TO, AND M10 IS THE UNIT IMMEDIATELY BEFORE THIS ONE.
  # M11 must exercise M9's landed human-confirmation seam WITHOUT rebuilding any part of it, and
  # must leave M10 byte-untouched.
  - name: "M9 and M10, the machines M11 consumes and must not edit, stay green"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase6_exception.py eval/tests/test_phase6_compensation.py"
    expect_exit_code: 0
    timeout_s: 1800
    expect_contains: ["passed"]

  # THE CANONICAL CHECKPOINT SUITE IS `test_phase3_checkpoint_matrix.py`. M11 IS checkpoint step 6,
  # so the kernel's own matrix, the claim CAS that revalidates `policy_version`, and the step-order
  # guard are the three anchors that decide whether M11 integrated with the checkpoint or built a
  # second one beside it.
  - name: "the checkpoint kernel, the claim CAS and step order are unchanged by M11"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase3_checkpoint_matrix.py eval/tests/test_phase3_claim_cas.py eval/tests/test_phase3_step_order.py"
    expect_exit_code: 0
    timeout_s: 1200
    expect_contains: ["passed"]

  - name: "the event registry and replay isolation are unchanged by M11"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_p5_event_contracts.py eval/tests/test_p5_replay_and_audit.py"
    expect_exit_code: 0
    timeout_s: 1200
    expect_contains: ["passed"]

  - name: "the false-green defences, including the population-proof guard"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_false_green_defenses.py"
    expect_exit_code: 0
    timeout_s: 900
    expect_contains: ["passed"]

  - name: "the tenant-first posture and bootstrap hermeticity survive a new canonical table"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase0_tenant_posture.py eval/tests/test_bootstrap_hermeticity.py"
    expect_exit_code: 0
    timeout_s: 900
    expect_contains: ["passed"]

  # ------------------------------------------------------------------ the M11 case vocabulary
  #
  # EACH LITERAL BELOW IS THE HEADLINE OF THE CASE ACTUALLY NAMED ON THE LINE ABOVE IT. This is the
  # M10 correction applied from the start: an oracle that cannot pass on a correct product is the
  # mirror image of a false green, because it teaches the builder to change the product.
  - name: "the happy path: a correctly authored policy reaches ACTIVE and decides a checkpoint"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case activation-requires-an-authenticated-human"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["ACTIVATION REQUIRES AN AUTHENTICATED HUMAN"]

  - name: "a model cannot activate a policy, at any confidence"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case a-model-cannot-activate-a-policy"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["A MODEL CAN NEVER ACTIVATE A POLICY"]

  - name: "automation cannot activate a policy, from any automated path"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case automation-cannot-activate-a-policy"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["AUTOMATION CAN NEVER ACTIVATE A POLICY"]

  - name: "inbound content can never author a policy"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case inbound-content-can-never-author-a-policy"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["INBOUND CONTENT CAN NEVER AUTHOR A POLICY"]

  - name: "a tenant policy that broadens the product ceiling is refused"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case a-tenant-policy-that-broadens-the-product-ceiling-is-refused"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["A TENANT POLICY MAY ONLY EVER NARROW THE PRODUCT CEILING"]

  - name: "a predicate on MODEL_INFERRED fails to compile at confidence 1.0"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case confidence-one-does-not-make-model-inferred-readable"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["A POLICY MAY NEVER BRANCH ON A GUESS"]

  - name: "the evaluator input type has no confidence field to read"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case the-evaluator-input-type-has-no-confidence-field"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["CONFIDENCE IS STRUCTURALLY NOT AN INPUT"]

  - name: "a policy change runs through the ordinary governed path, and there is no admin path"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case there-is-no-admin-path-to-approved"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["A POLICY CHANGE IS ITSELF A GATED ACTION, AND THERE IS NO ADMIN PATH"]

  - name: "PolicyApproved proves the change was human-gated, and does not activate"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case policyapproved-does-not-activate"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["PolicyApproved DOES NOT ACTIVATE"]

  - name: "PolicySubmitted is a separate historical fact from PolicyProposed"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case policysubmitted-is-not-a-rename-of-policyproposed"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["PolicySubmitted IS NOT A RENAME OF PolicyProposed"]

  - name: "a policy change voids an in-flight approval through M4's landed seam"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case policyversionchanged-voids-an-in-flight-m4-approval"
    expect_exit_code: 0
    timeout_s: 600
    expect_contains: ["A POLICY CHANGE VOIDS AN IN-FLIGHT APPROVAL"]

  - name: "a grant minted under the old version cannot be claimed after a policy change"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case a-stale-policy-version-grant-claim-is-refused"
    expect_exit_code: 0
    timeout_s: 600
    expect_contains: ["A STALE POLICY VERSION MAKES THE GRANT UNCLAIMABLE"]

  - name: "a narrowing policy's expiry raises the M9 human-confirmation Exception and broadens nothing"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case expiry-raises-the-m9-human-confirmation-exception"
    expect_exit_code: 0
    timeout_s: 600
    expect_contains: ["AN EXPIRY THAT BROADENS REQUIRES A HUMAN AT EXPIRY"]

  - name: "a fired timer never broadens authority"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case timerfired-never-broadens-authority"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["THE CLOCK MAY TAKE AUTHORITY AWAY; THE CLOCK MAY NEVER GIVE IT"]

  - name: "the policy engine unavailable at checkpoint yields no witness and no effect"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case the-policy-engine-unavailable-yields-no-witness-and-no-effect"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["NO POLICY DECISION MEANS NO WITNESS AND NO EFFECT"]

  - name: "evaluation is byte-identical reproducible under the same version and inputs"
    run: ".venv/bin/python scripts/probe_phase6_policy.py --case evaluation-is-byte-identical-reproducible --repeat 25 --seed 11"
    expect_exit_code: 0
    timeout_s: 600
    expect_contains: ["EVALUATION IS BYTE-IDENTICAL REPRODUCIBLE"]

  - name: "M11 mints no gate decision and the checkpoint stays the sole minter"
