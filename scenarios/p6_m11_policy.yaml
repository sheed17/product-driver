      base=build(T, {'tenant':'T_A','scope':'action_class:raise_invoice','gate_decision':'HUMAN_APPROVAL_REQUIRED','authored_by':'policy-owner','activated_by':'policy-owner','version':1,'effective_from':'2026-09-02T00:00:00Z','created_at':'2026-09-02T00:00:00Z','updated_at':'2026-09-02T00:00:00Z'});
