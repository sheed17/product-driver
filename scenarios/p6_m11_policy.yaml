  # SAME scope in a DIFFERENT tenant must be ACCEPTED: a global uniqueness that accidentally couples
  # tenants is the cross-tenant defect wearing a safety constraint's clothes.
  - name: "one ACTIVE policy per tenant and scope, enforced by a tenant-first partial index"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys,re; sys.path.insert(0,'src');
