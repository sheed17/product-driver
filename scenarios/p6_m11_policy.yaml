      c=sqlite3.connect(p); create_canonical_schema(c);
      ddl=(lambda r: r[0] if r else '')(c.execute('select sql from sqlite_master where name=?', ('policies',)).fetchone());
      v=dict([(m[0], re.findall(chr(39) + '([^' + chr(39) + ']*)' + chr(39), m[2])) for m in reversed(re.findall('([A-Za-z0-9_]+) +(NOT +)?IN *[(]([^)]*)[)]', ddl)) if not m[1]]);
      s=v.get('state') or []; g=v.get('gate_decision') or [];
      print('the state vocabulary is a CHECK:', bool(s));
      print('canonical seven:', sorted(s));
      print('state count:', len(s));
      print('forbidden states present:', sorted([x for x in s if x in ('NARROWED','SUSPENDED','INVALID','PENDING','ENABLED','DISABLED','CANCELLED','REJECTED','COMPILED','CONFIRMED','FAILED','ARCHIVED')]));
      print('the gate vocabulary is a CHECK:', bool(g));
      print('canonical four:', sorted(g));
      print('gate member count:', len(g));
      print('invented gate members present:', sorted([x for x in g if x not in ('HUMAN_APPROVAL_REQUIRED','AUTONOMOUS_WITHIN_CAPS','PERMANENT_HUMAN_ASSERTION_REQUIRED','FORBIDDEN')]));
      nn=[r[1] for r in c.execute('pragma table_info(policies)') if r[3]];
      print('gate_decision is NOT NULL:', 'gate_decision' in nn);
      print('the NOT NULL column set:', sorted(nn))"
    timeout_s: 300
    contains:
      - "the state vocabulary is a CHECK: True"
      - "canonical seven: ['ACTIVE', 'APPROVED', 'DRAFT', 'EXPIRED', 'PROPOSED', 'REVOKED', 'SUPERSEDED']"
