  # 6 ---------------------------------------------------------------------------------------
  #
  # THE F11 CONTRACT SET, READ FROM THE REGISTRY RATHER THAN FROM M11's ACCOUNT OF IT. All eight
  # F11 names were registered BEFORE M11 was built — `PolicySubmitted`(PO-2) and `PolicyApproved`
  # (PO-3) by the 2026-08-12 founder/architect amendment — so this oracle is a landed-authority
