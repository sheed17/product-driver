  - name: "the M12 probe exposes a bounded, closed dimension vocabulary to vary cases with"
    run: ".venv/bin/python scripts/probe_phase6_rule.py --list-dimensions"
    expect_exit_code: 0
    timeout_s: 180
    expect_contains:
      - "--concurrency"
      - "--delay-ms"
      - "--repeat"
      - "--tenants"
      - "--seed"
      - "--inject"
      - "--actor"
      - "--direction"
      - "--provenance"
      - "--scope"
      - "--brake"
      # `--kind` AND `--outcome` ARE THIS UNIT'S OWN TWO AXES. The four rule kinds do not behave
      # alike — `GATE_PRECONDITION` and `CONSTRAINT` are evaluated by the checkpoint, `IDENTITY` and
      # `CONFLICT_RESOLUTION` are consulted by two other components entirely — and the whole unit is
      # the claim that exactly TWO outcomes exist, which is a claim a single-outcome case cannot
      # make. A generator that cannot vary the kind can only ever exercise one quarter of the
      # machine, and one that cannot vary the outcome cannot show that the third state is absent.
      - "--kind"
      - "--outcome"

  # ------------------------------------------------------------------ the machine, driven
  #
  # THE HEADLINES ARE THE UNIT'S OWN SENTENCES. Each one is a claim a wrong implementation cannot
  # print, because the case behind it exercises the mechanism rather than reading the docstring.
  - name: "drive the Rule machine through a brokerage narrative, and attack it"
    run: ".venv/bin/python scripts/probe_phase6_rule.py --all"
    expect_exit_code: 0
    timeout_s: 1800
    expect_contains:
      - "behaviours as specified, 0 wrong"
      - "A HUMAN INSTRUCTION EITHER COMPILES INTO AN ENFORCEABLE RULE OR IS HONESTLY REFUSED"
      - "THERE IS NO THIRD OUTCOME"
      - "A MODEL MAY PROPOSE TEXT; IT NEVER COMPILES"
      - "COMPILATION IS DETERMINISTIC, WITH NO MODEL IN THE LOOP"
      - "A RULE MAY NEVER BRANCH ON A GUESS"
      - "CONFIDENCE IS STRUCTURALLY NOT AN INPUT"
      - "AN UNMODELLED FIELD DOES NOT COMPILE"
      - "NEVER BILL WITHOUT A POD COMPILES TO A REAL PRECONDITION"
      - "AN INFERRED POD IS NOT A POD"
      - "DO NOT USE CARRIER X FOR PRODUCE CANNOT COMPILE, AND THE OWNER IS TOLD"
      - "NOTED THE PROCEDURE IS FORBIDDEN WITHOUT AN ACTIVE RULE ID"
      - "AN INSTRUCTION THAT DID NOT COMPILE IS MEMORY, NOT AUTHORITY"
      - "THE OWNER SEES THE COMPILED RULE AND ITS TEST VECTORS BEFORE CONFIRMING"
      - "ACTIVATION REQUIRES AN AUTHENTICATED HUMAN"
      - "A MODEL CAN NEVER ACTIVATE A RULE"
      - "AUTOMATION CAN NEVER ACTIVATE A RULE"
      - "TWO CONFLICTING RULES FAIL CLOSED"
      - "NEYMA NEVER PICKS A WINNER BETWEEN TWO RULES"
      - "M12 RAISES THE M7 RULE_VS_RULE CONFLICT AND BUILDS NO SECOND ONE"
      - "THE NARROWER SCOPE WINS, AND THAT IS NOT A CONFLICT"
      - "THE OLD VERSION IS RETAINED BECAUSE EFFECTS WERE JUDGED UNDER IT"
      - "RE-ACTIVATING AN ACTIVE VERSION IS A NO-OP"
      - "A NARROWING REVOCATION IS IMMEDIATE; A BROADENING ONE NEEDS THE OWNER"
      - "THE CLOCK MAY TAKE AUTHORITY AWAY; THE CLOCK MAY NEVER GIVE IT"
      - "AN EXPIRY THAT BROADENS REQUIRES A HUMAN AT EXPIRY"
      - "A DENYING RULE MEANS NO WITNESS AND NO EFFECT"
      - "THERE IS NO ALLOW-ON-ERROR DEFAULT"
      - "M12 MINTS NO GATE DECISION"
      - "THE CHECKPOINT IS STILL THE ONLY GATE MINTER"
      - "M12 BUILDS NO SECOND CHECKPOINT"
      - "A RULE NEVER OVERRIDES A CONSTRAINT"
      - "A RULE NEVER OVERRIDES A PERMANENT PRODUCT TRUTH"
      - "A RULE NEVER OVERRIDES A BRAKE DENIAL"
      - "A RULE NEVER OVERRIDES POLICY"
      - "REPLAY CREATES NO AUTHORITY"
      - "A REPEATEDLY OVERRIDDEN RULE ASKS A HUMAN AND IS NEVER AUTO-DISABLED"
      - "M12 SHIPS DARK WITH ZERO PRODUCTION IMPORTERS"
      - "THE M13 BRAKE MACHINE IS NOT BUILT"
      - "NOTHING GRADUATES"
      - "THE M1 WORK ITEM MACHINE IS UNCHANGED"
      - "THE M2 PIPELINE MACHINE IS UNCHANGED"
      - "THE M3 EFFECT AUTHORITY IS UNCHANGED"
      - "THE M4 APPROVAL MACHINE IS UNCHANGED"
      - "THE M7 CONFLICT MACHINE IS UNCHANGED"
      - "THE M9 EXCEPTION MACHINE IS UNCHANGED"
      - "THE M11 POLICY MACHINE IS UNCHANGED"

  # ------------------------------------------------------------------ the mutation battery
  - name: "every M12 mutation is caught by the acceptance battery"
    run: ".venv/bin/python scripts/mutate_phase6_rule.py"
    expect_exit_code: 0
    timeout_s: 2400
    expect_contains:
      - "mutations caught"
      - "0 escaped"

  # ------------------------------------------------------------------ acceptance batteries
  #
  # EVERY BATTERY BELOW IS INVOKED AS `python -m pytest`, NEVER AS THE `pytest` CONSOLE SCRIPT.
  # This is the M10 harness-recovery invariant and it is not a style preference: `python -m pytest`
  # puts the invocation directory on `sys.path` and the console script does not, so a test that
  # reaches for the repository's own harness (`from eval.phase0 import gate_scan`) raises
  # `ModuleNotFoundError: No module named 'eval'` under one and passes under the other.
  #
  # `-p no:cacheprovider` matches Neyma's own CI so ambient state cannot reshape the run.
  # `passed` is required on every battery and `no tests ran` / `file or directory not found` are
  # globally forbidden, so an empty or not-found selection can never read as a green anchor.
  - name: "the M12 acceptance battery"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase6_rule.py"
    expect_exit_code: 0
    timeout_s: 1800
    expect_contains: ["passed"]

  # THE P0 ADR-010 BOUNDARY GUARDS ARE M12's SHARPEST REGRESSION ANCHOR, AND THE ONE MOST LIKELY TO
  # BE "FIXED" IN THE WRONG DIRECTION. `test_phase0_null_gate.py` and `test_phase0_errata_guards.py`
  # confine the typed gate ladder to `gate_scan.GATE_RUNTIME_MODULES` by EXACT SET EQUALITY, and
  # confine MINTING to `checkpoint.py` alone. A `GATE_PRECONDITION` rule legitimately names a gate
  # member — ADR-010 §6.1's fourth worked example sets `HUMAN_APPROVAL_REQUIRED` under a condition —
  # so the carrier boundary may widen the way it widened for `pipeline_instance.py` at P6-CP-2 and
  # for `policy.py` at P6-CP-11. What must NOT move is the MINT allowlist.
  - name: "the ADR-010 gate boundary still confines minting to the checkpoint kernel"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase0_null_gate.py eval/tests/test_phase0_errata_guards.py"
    expect_exit_code: 0
    timeout_s: 900
    expect_contains: ["passed"]

  - name: "M1, M2, M3 and M4 stay green beside M12"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase6_work_item.py eval/tests/test_phase6_pipeline_instance.py eval/tests/test_phase6_external_effect.py eval/tests/test_phase6_approval.py"
    expect_exit_code: 0
    timeout_s: 2400
    expect_contains: ["passed"]

  # M7 IS THE MACHINE RU-3 FAILS CLOSED INTO, M9 IS THE MACHINE RU-8's EXPIRY AND THE OVERRIDE-RATE
  # SEAM ESCALATE TO, AND M11 IS THE UNIT IMMEDIATELY BEFORE THIS ONE AND THE LAYER DIRECTLY ABOVE
  # IT IN THE PRECEDENCE LADDER. M12 must drive all three and rebuild none of them.
  - name: "M7, M9 and M11, the machines M12 consumes and must not edit, stay green"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase6_conflict.py eval/tests/test_phase6_exception.py eval/tests/test_phase6_policy.py"
    expect_exit_code: 0
    timeout_s: 1800
    expect_contains: ["passed"]

  - name: "M5, M6, M8 and M10 stay green beside M12"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase6_observation.py eval/tests/test_phase6_identity_binding_claim.py eval/tests/test_phase6_expectation.py eval/tests/test_phase6_compensation.py"
    expect_exit_code: 0
    timeout_s: 2400
    expect_contains: ["passed"]

  # THE CANONICAL CHECKPOINT SUITE IS `test_phase3_checkpoint_matrix.py`. A GATE_PRECONDITION rule is
  # evaluated INSIDE checkpoint step 6, so the kernel's own matrix, the claim CAS and the step-order
  # guard are the three anchors that decide whether M12 integrated with the checkpoint or built a
  # second one beside it.
  - name: "the checkpoint kernel, the claim CAS and step order are unchanged by M12"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase3_checkpoint_matrix.py eval/tests/test_phase3_claim_cas.py eval/tests/test_phase3_step_order.py"
    expect_exit_code: 0
    timeout_s: 1200
    expect_contains: ["passed"]

  - name: "the event registry and replay isolation are unchanged by M12"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_p5_event_contracts.py eval/tests/test_p5_replay_and_audit.py"
    expect_exit_code: 0
    timeout_s: 1200
    expect_contains: ["passed"]

  - name: "the false-green defences, including the population-proof guard"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_false_green_defenses.py"
    expect_exit_code: 0
    timeout_s: 900
    expect_contains: ["passed"]

  - name: "the tenant-first posture and bootstrap hermeticity survive a new canonical table"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase0_tenant_posture.py eval/tests/test_bootstrap_hermeticity.py"
