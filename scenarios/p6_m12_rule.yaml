      .venv/bin/python -c "import sqlite3,tempfile,os,sys,inspect; sys.path.insert(0,'src');
      from freight_recon.schema import (create_canonical_schema, schema_readiness_problems,
      enable_and_verify_foreign_keys);
      import freight_recon.migrations.phase6_rules as mg;
      norm=lambda s: ' '.join((s or '').split());
      shape=lambda c: sorted([(r[0], norm(r[1])) for r in c.execute('select name, sql from sqlite_master where tbl_name=? and sql is not null', ('rules',))]);
      want=('MIGRATION_ID','P6RU_SCHEMA_VERSION','P6RU_TENANT_TABLES','P6RU_EXEMPT_TABLES','P6RU_TARGET_SCHEMA','P6RU_INDEXES','P6RU_SCOPE_FORMS','P6RU_SINGLE_ACTIVE_SCOPES','create_phase6_rules_schema','stamp_phase6_rules_version','phase6_rules_readiness_problems');
      print('the canonical P6 symbol set is complete:', sorted(s for s in want if not hasattr(mg, s)) == []);
