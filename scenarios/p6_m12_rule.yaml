expect_state:
  # 1 ---------------------------------------------------------------------------------------
  - name: "a freshly created canonical database carries the rule layer, tenant-first"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys; sys.path.insert(0,'src');
      from freight_recon.schema import (create_canonical_schema, schema_readiness_problems,
      enable_and_verify_foreign_keys); p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3');
      c=sqlite3.connect(p); create_canonical_schema(c); enable_and_verify_foreign_keys(c);
      print('problems:', schema_readiness_problems(c));
      print(sorted(r[0] for r in c.execute('select name from sqlite_master where type=' + chr(39) + 'table' + chr(39))))"
    timeout_s: 300
    contains:
      - "problems: []"
      - "rules"
      - "policies"
      - "conflicts"
      - "exceptions"
      - "tenant_humans"
      - "approvals"
      - "effect_grants"
      - "checkpoint_witnesses"
      - "pipeline_instances"
      - "event_outbox"
      - "brakes"

  # 2 ---------------------------------------------------------------------------------------
  #
  # THE FROZEN EIGHT AND THE FROZEN FOUR, AS DATABASE CONSTRAINTS. The machine file's own opening
  # paragraph exists to refuse `parsed`, `invalid`, `conflict-detected`, `awaiting-confirmation` and
  # `suspended` BY NAME — they map to PROPOSED, REJECTED, a raised M7 Conflict, COMPILED and REVOKED
  # without a ninth state. Those five, the ordinary inventions (`PENDING`, `ENABLED`, `DISABLED`,
  # `CANCELLED`, `FAILED`, `ARCHIVED`) and — the sharpest of them — M11's OWN states `DRAFT` and
  # `APPROVED` are what this asserts cannot exist on a rule. A machine built by copying M11 acquires
  # `DRAFT`/`APPROVED` silently and looks entirely reasonable doing it.
  - name: "the eight canonical rule states and four canonical kinds are database constraints, and there is no ninth or fifth"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys,re; sys.path.insert(0,'src');
      from freight_recon.schema import create_canonical_schema; p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3');
      c=sqlite3.connect(p); create_canonical_schema(c);
      ddl=(lambda r: r[0] if r else '')(c.execute('select sql from sqlite_master where name=?', ('rules',)).fetchone());
      v=dict([(m[0], re.findall(chr(39) + '([^' + chr(39) + ']*)' + chr(39), m[2])) for m in reversed(re.findall('([A-Za-z0-9_]+) +(NOT +)?IN *[(]([^)]*)[)]', ddl)) if not m[1]]);
      s=v.get('state') or []; k=v.get('kind') or [];
      print('the state vocabulary is a CHECK:', bool(s));
      print('canonical eight:', sorted(s));
      print('state count:', len(s));
      print('forbidden states present:', sorted([x for x in s if x in ('PARSED','INVALID','CONFLICT_DETECTED','AWAITING_CONFIRMATION','SUSPENDED','PENDING','ENABLED','DISABLED','CANCELLED','FAILED','ARCHIVED','DRAFT','APPROVED')]));
      print('the kind vocabulary is a CHECK:', bool(k));
      print('canonical four:', sorted(k));
      print('kind count:', len(k));
      print('invented kinds present:', sorted([x for x in k if x not in ('IDENTITY','CONFLICT_RESOLUTION','GATE_PRECONDITION','CONSTRAINT')]));
      nn=[r[1] for r in c.execute('pragma table_info(rules)') if r[3]];
      print('the NOT NULL column set:', sorted(nn));
      print('compiled_predicate is NOT NULL:', 'compiled_predicate' in nn);
      print('source_instruction is NOT NULL:', 'source_instruction' in nn);
      print('authored_by is NOT NULL:', 'authored_by' in nn);
      print('rule_version is NOT NULL:', 'rule_version' in nn);
      cols=sorted(r[1] for r in c.execute('pragma table_info(rules)'));
      print('the rule column set:', cols);
      print('every canonical required attribute is a column:', sorted(x for x in ('rule_id','tenant','rule_version','scope','kind','compiled_predicate','state','source_instruction','authored_by','activated_by','test_vectors') if x not in cols))"
    timeout_s: 300
    contains:
      - "the state vocabulary is a CHECK: True"
      - "canonical eight: ['ACTIVE', 'COMPILED', 'CONFIRMED', 'EXPIRED', 'PROPOSED', 'REJECTED', 'REVOKED', 'SUPERSEDED']"
      - "state count: 8"
      - "forbidden states present: []"
      - "the kind vocabulary is a CHECK: True"
      - "canonical four: ['CONFLICT_RESOLUTION', 'CONSTRAINT', 'GATE_PRECONDITION', 'IDENTITY']"
      - "kind count: 4"
      - "invented kinds present: []"
      - "compiled_predicate is NOT NULL: True"
      - "source_instruction is NOT NULL: True"
      - "authored_by is NOT NULL: True"
      - "rule_version is NOT NULL: True"
      - "every canonical required attribute is a column: []"

  # 3 ---------------------------------------------------------------------------------------
  #
  # THE FORBIDDEN WRITES, ATTEMPTED AGAINST A LIVE DATABASE, BEHIND THREE POSITIVE CONTROLS. Reading
  # the DDL and believing it is how a CHECK that was never compiled reads as enforcement. Every
  # refusal below is an INSERT the database actually rejected, and the surviving-row count is
  # asserted so a schema that refuses EVERYTHING cannot pass this by being uniformly hostile.
  #
  # ### THE LOAD-BEARING ONE IS `an ACTIVE rule with no activator`. Entity point 16 makes it a CHECK
  # and point 37 makes it a STRUCTURALLY IMPOSSIBLE STATE, and the whole of RU-5 rests on it: if an
  # ACTIVE row can exist with a null `activated_by`, then "an authenticated human activated this" is
  # a convention rather than a fact, and every downstream claim about who authorised an enforcement
  # rests on a row anyone could have written.
  - name: "the live database refuses an ACTIVE rule with no activator, an invented state, an invented kind and a cross-tenant actor"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys,re; sys.path.insert(0,'src');
      from freight_recon.schema import create_canonical_schema, enable_and_verify_foreign_keys;
      p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3'); c=sqlite3.connect(p);
      create_canonical_schema(c); enable_and_verify_foreign_keys(c); T='rules';
      print('rules table present:', bool(c.execute('select 1 from sqlite_master where type=' + chr(39) + 'table' + chr(39) + ' and name=?', (T,)).fetchone()));
      ddl=lambda t: (lambda r: r[0] if r else '')(c.execute('select sql from sqlite_master where name=?', (t,)).fetchone());
      vocab=lambda t: dict([(m[0], re.findall(chr(39) + '([^' + chr(39) + ']*)' + chr(39), m[2])) for m in reversed(re.findall('([A-Za-z0-9_]+) +(NOT +)?IN *[(]([^)]*)[)]', ddl(t))) if not m[1]]);
      info=lambda t: list(c.execute('pragma table_info(' + t + ')')); colsof=lambda t: [r[1] for r in info(t)];
      env={'c':c,'sqlite3':sqlite3,'vocab':vocab,'info':info,'colsof':colsof,'T':T};
      exec(chr(10).join(['def pick(v, r):',' n = r[1].lower()',' if r[4] is not None: return str(r[4]).strip(chr(39))',\" if r[1] in v and v[r[1]]: return int(v[r[1]][0]) if 'INT' in (r[2] or '').upper() else v[r[1]][0]\",\" if 'INT' in (r[2] or '').upper(): return 1\",\" if n.endswith('_at') or n.endswith('_from'): return '2026-09-04T00:00:00Z'\",\" return 'x'\",'def build(t, known):',' d = dict([(r[1], pick(vocab(t), r)) for r in info(t) if r[3]])',' d.update(dict([(k, v) for k, v in known.items() if k in colsof(t)]))',' return d','def ins(t, d):',\"  c.execute('insert into ' + t + ' (' + ','.join(d) + ') values (' + ','.join(['?']*len(d)) + ')', list(d.values()))\",'def attempt(label, d):',' try:',\"  c.execute('savepoint s'); ins(T, d); c.execute('release s'); print(label + ': ACCEPTED')\",' except sqlite3.Error as exc:',\"  c.execute('rollback to s'); c.execute('release s'); print(label + ': refused by ' + str(exc).split(chr(10))[0])\"]), env);
      build=env['build']; ins=env['ins']; attempt=env['attempt'];
      [ins('tenant_humans', dict(zip(('tenant','human_id','display_name','authority_role','state','recorded_at','recorded_by','recorded_by_kind'), (t,h,n,r,'ACTIVE','2026-09-04T00:00:00Z','founder','human')))) for t,h,n,r in (('T_A','rule-owner','Policy Owner','POLICY_OWNER'),('T_A','ops-lead','Ops Lead','AUTHORIZED_HUMAN'),('T_B','other-owner','Other Owner','POLICY_OWNER'))];
      print('the M1 humans the positive controls bind:', sorted(c.execute('select tenant, human_id, authority_role from tenant_humans')));
      fks=dict([(r[3], (r[2], r[4])) for r in c.execute('pragma foreign_key_list(' + T + ')')]);
      print('the authored_by FK target:', str(fks.get('authored_by')));
      print('the activated_by FK target:', str(fks.get('activated_by')));
      base=build(T, {'tenant':'T_A','rule_id':'ru-1','rule_version':1,'scope':'action_class:raise_invoice','kind':'GATE_PRECONDITION','state':'PROPOSED','authored_by':'rule-owner','activated_by':None,'source_instruction':'never bill without a POD','compiled_predicate':'{}','test_vectors':'[]','version':1,'created_at':'2026-09-04T00:00:00Z','updated_at':'2026-09-04T00:00:00Z'});
      print('the derived NOT NULL column set:', sorted(base));
      over=lambda d: dict(list(base.items()) + [(k, v) for k, v in d.items() if k in colsof(T)]);
      [attempt(lbl, over(d)) for lbl, d in [('positive control, a well-formed PROPOSED rule', {'state':'PROPOSED'}), ('positive control, an ACTIVE rule activated by a named human', {'rule_id':'ru-2','rule_version':2,'scope':'action_class:book_carrier','state':'ACTIVE','activated_by':'rule-owner'}), ('positive control, an authorized delegate may activate', {'rule_id':'ru-3','rule_version':3,'scope':'action_class:pay_carrier','state':'ACTIVE','activated_by':'ops-lead'}), ('an ACTIVE rule with no activator', {'rule_id':'ru-4','rule_version':4,'scope':'action_class:send_email','state':'ACTIVE','activated_by':None}), ('a PARSED lifecycle state', {'rule_id':'ru-5','rule_version':5,'scope':'action_class:a','state':'PARSED'}), ('an INVALID lifecycle state', {'rule_id':'ru-6','rule_version':6,'scope':'action_class:b','state':'INVALID'}), ('a SUSPENDED lifecycle state', {'rule_id':'ru-7','rule_version':7,'scope':'action_class:c','state':'SUSPENDED'}), ('an AWAITING_CONFIRMATION lifecycle state', {'rule_id':'ru-8','rule_version':8,'scope':'action_class:d','state':'AWAITING_CONFIRMATION'}), ('a DRAFT lifecycle state borrowed from M11', {'rule_id':'ru-9','rule_version':9,'scope':'action_class:e','state':'DRAFT'}), ('an APPROVED lifecycle state borrowed from M11', {'rule_id':'ru-10','rule_version':10,'scope':'action_class:f','state':'APPROVED'}), ('an invented rule kind', {'rule_id':'ru-11','rule_version':11,'scope':'action_class:g','kind':'ROUTING'}), ('an author who is not a recorded human', {'rule_id':'ru-12','rule_version':12,'scope':'action_class:h','authored_by':'someone-else'}), ('an author from another tenant', {'rule_id':'ru-13','rule_version':13,'scope':'action_class:i','authored_by':'other-owner'}), ('an activator from another tenant', {'rule_id':'ru-14','rule_version':14,'scope':'action_class:j','state':'ACTIVE','activated_by':'other-owner'})]];
      print('rows that survived:', c.execute('select count(*) from ' + T).fetchone()[0]);
      print('surviving ACTIVE rows with a named activator:', c.execute('select count(*) from rules where state=? and activated_by is not null', ('ACTIVE',)).fetchone()[0]);
      print('surviving ACTIVE rows with no activator:', c.execute('select count(*) from rules where state=? and activated_by is null', ('ACTIVE',)).fetchone()[0])"
    timeout_s: 600
    contains:
      - "rules table present: True"
      - "positive control, a well-formed PROPOSED rule: ACCEPTED"
      - "positive control, an ACTIVE rule activated by a named human: ACCEPTED"
      - "positive control, an authorized delegate may activate: ACCEPTED"
      - "an ACTIVE rule with no activator: refused"
      - "a PARSED lifecycle state: refused"
      - "an INVALID lifecycle state: refused"
      - "a SUSPENDED lifecycle state: refused"
      - "an AWAITING_CONFIRMATION lifecycle state: refused"
      - "a DRAFT lifecycle state borrowed from M11: refused"
      - "an APPROVED lifecycle state borrowed from M11: refused"
      - "an invented rule kind: refused"
      - "an author who is not a recorded human: refused"
      - "an author from another tenant: refused"
      - "an activator from another tenant: refused"
      - "rows that survived: 3"
      - "surviving ACTIVE rows with a named activator: 2"
      - "surviving ACTIVE rows with no activator: 0"

  # 4 ---------------------------------------------------------------------------------------
  #
  # ### THE UNIQUENESS ENTITY POINT 17 ACTUALLY STATES, WHICH IS NOT THE ONE A CAREFUL READER
  # EXPECTS. It is CONDITIONAL: `UNIQUE (tenant_id, scope, kind) WHERE state = 'ACTIVE'` ### **where
  # a scope admits one rule; otherwise multiple active rules may coexist (and conflicts are
  # detected)**. Both halves are load-bearing and they fail in opposite directions. Impose the index
  # on every scope and a legitimate second rule is refused by a constraint canon never granted —
