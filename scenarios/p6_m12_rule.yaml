      litsof=lambda t: set(n.value for n in ast.walk(t) if isinstance(n, ast.Constant) and isinstance(n.value, str) and id(n) not in docsof(t));
      evishof=lambda t: sorted(s for s in litsof(t) if s and s[0].isupper() and s.isidentifier() and any(s.startswith(p) for p in ('Rule','Policy','Brake','Conflict','Approval','Checkpoint','Effect','Pipeline','Exception','Compensation','Unauthorized','Illegal','Human','Timer')));
      emitof=lambda t: sorted(set(e.value for n in ast.walk(t) if isinstance(n, ast.Call) for k in n.keywords if k.arg == 'events' for e in ast.walk(k.value) if isinstance(e, ast.Constant) and isinstance(e.value, str)));
