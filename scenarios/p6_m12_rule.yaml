  #
  # ### THE L-C GUARD, ASSERTED ON THE LITERAL REPLY TEXT — WHICH IS THE WHOLE POINT OF THIS MACHINE.
  # M-52 and M-64 are not about a state field. They are about the SENTENCE the owner reads:
  # *"📋 Noted the procedure for raise_invoice"* is FORBIDDEN unless a rule actually compiled and
  # activated, and the honest failure is *"I can't enforce that. Here's why, and here's what I'd
  # need."* Every other oracle in this file could pass while the product still tells the owner a
  # comfortable lie, because every other oracle measures structure. This one measures the words.
  #
  # The guard is exercised in BOTH directions: a claiming reply with no ACTIVE rule id is REFUSED,
  # and the same claiming reply WITH one is ACCEPTED — otherwise a machine that refuses every reply
  # would pass, and a product that can never confirm a real rule is not the safe direction, it is a
  # different broken product.
