      rows=lambda p: [re.match(r'^\| *\*\*([A-Z]{2}-[0-9]+[a-z]*)\*\* *\|', l).group(1) for l in p.read_text(encoding='utf-8').splitlines() if re.match(r'^\| *\*\*[A-Z]{2}-[0-9]+[a-z]*\*\* *\|', l)];
      counts={p.name: len(rows(p)) for p in files};
      print('per-machine transition counts:', sorted(counts.items()));
      print('total transition rows counted:', sum(counts.values()));
      print('M11 transition rows:', counts.get('11-policy.machine.md'));
      print('M12 transition rows:', counts.get('12-rule.machine.md'));
      print('M12 transition row ids:', rows(d / '12-rule.machine.md'));
      print('M13 transition rows:', counts.get('13-brake.machine.md'));
      ac=pathlib.Path('docs/specifications/acceptance/foundational-machine-acceptance.md').read_text(encoding='utf-8');
      print('the acceptance corpus says M12 owes nine:', 'AC-MACH-1201..1209' in ac);
      spec=pathlib.Path('docs/architecture/target-system-specification.md').read_text(encoding='utf-8');
      print('the target spec section 12.12 states the eight rule states:', 'PROPOSED' in spec and 'COMPILED' in spec and 'CONFIRMED' in spec)"
    timeout_s: 300
    contains:
      - "machine files discovered: 13"
      - "total transition rows counted: 134"
      - "M11 transition rows: 7"
      - "M12 transition rows: 9"
      - "M12 transition row ids: ['RU-1', 'RU-2', 'RU-2f', 'RU-3', 'RU-4', 'RU-5', 'RU-6', 'RU-7', 'RU-8']"
      - "M13 transition rows: 5"
      - "the acceptance corpus says M12 owes nine: True"

verifies:
  - risk_category: happy_path
    claim: >-
      OUTCOME A completes end to end. "Never bill without a POD" — the one instruction the owner was
      right to expect enforcement from — is proposed, compiles DETERMINISTICALLY into a real
      GATE_PRECONDITION over modelled, non-inferred evidence fields, ships with generated test
      vectors, is confirmed by an owner who saw them, is activated by an authenticated human, and
      then DECIDES a checkpoint at step 6. Every refusal below is only meaningful because this one
      succeeds: an oracle battery proving no instruction can ever become an enforceable rule would
      pass a machine that refuses everything, which is not the safe direction — it is a different
      broken product.
    checks:
      - "the happy path: never bill without a POD compiles, is confirmed, is activated and decides a checkpoint"
      - "drive the Rule machine through a brokerage narrative, and attack it"
      - "the live database refuses an ACTIVE rule with no activator, an invented state, an invented kind and a cross-tenant actor"
      - "rule uniqueness is tenant-first, conditional on the declared single-admitting scopes, and never global"
      - "the compiler refuses MODEL_INFERRED by type, and confidence is structurally not an input"
    observations:
