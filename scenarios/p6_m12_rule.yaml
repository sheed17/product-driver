  # names a typed gate member in executable code — and ADR-010 §6.1 says one may — then M12's modules
  # join that boundary the way `pipeline_instance.py` did at `P6-CP-2` and `policy.py` did at
  # `P6-CP-11`. ### THAT IS A WIDENING WITH A NARROWING ATTACHED, AND BOTH HALVES ARE MEASURED HERE
  # AND IN ORACLE 7: carrying is permitted, MINTING is refused, and every carrier must cite ADR-010
  # so a module cannot acquire gate runtime by writing a magic string.
  #
  # ### THIS ORACLE DOES NOT REQUIRE M12 TO JOIN. It requires the DISCOVERED population to EQUAL the
  # STATED one, whichever way the builder goes: a module that carries the vocabulary and is absent
  # from the boundary is a drift, and a boundary naming a module that carries nothing is a widening
  # bought for free. Both are failures; joining or not joining is not.
