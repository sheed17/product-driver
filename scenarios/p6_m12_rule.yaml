      - "positive control, a SUPERSEDED rule for the same scope and kind is retained beside it: ACCEPTED"
      - "a DELETE against a rule row: refused by"

  - risk_category: boundary
    claim: >-
      Direction is the whole content of RU-7 and RU-8, and the two directions are not symmetric
      anywhere in this unit. A NARROWING revocation is immediate; a BROADENING one requires the
      Policy Owner and can never be performed by automation. Only a narrowing rule may carry an
      expiry at all, because a narrowing rule's expiry BROADENS authority — so it requires a human AT
      EXPIRY, and a fired timer never gives authority back. Otherwise "temporarily tighten" becomes
      "automatically loosen later, when nobody is watching."
    checks:
