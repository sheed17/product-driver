      - "AN EXPIRY THAT BROADENS REQUIRES A HUMAN AT EXPIRY"
      - "THE CLOCK MAY TAKE AUTHORITY AWAY; THE CLOCK MAY NEVER GIVE IT"

  - risk_category: service_unavailable
    claim: >-
      There is no allow-on-error path. A rule engine that cannot answer produces NO rule decision,
      which produces NO checkpoint witness, which produces NO grant and therefore NO effect. The
