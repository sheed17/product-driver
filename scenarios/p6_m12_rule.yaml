      print('the unit declares no tenant-exempt table:', list(mg.P6RU_EXEMPT_TABLES) == []);
      fresh=sqlite3.connect(os.path.join(tempfile.mkdtemp(),'fresh.sqlite3')); create_canonical_schema(fresh); enable_and_verify_foreign_keys(fresh);
      up=sqlite3.connect(os.path.join(tempfile.mkdtemp(),'up.sqlite3')); create_canonical_schema(up); enable_and_verify_foreign_keys(up);
      [up.execute('drop trigger if exists ' + n) for n in list(getattr(mg, 'P6RU_TRIGGERS', {}))];
      [up.execute('drop index if exists ' + n) for n in list(mg.P6RU_INDEXES)];
      up.execute('drop table if exists rules'); up.commit();
      print('the rule layer was actually removed before the upgrade:', shape(up) == []);
      fn=mg.create_phase6_rules_schema;
