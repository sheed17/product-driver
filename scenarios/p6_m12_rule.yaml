      modelled field on a load; the owner is told exactly that, the sentence is retained as
      organizational memory carrying no authority, and the gap surfaces as a feature request rather
      than as a silent failure that books Carrier X for a load of lettuce. An unmodelled field, an
      undecidable predicate and an unresolvable scope all reach the same honest end.
    checks:
