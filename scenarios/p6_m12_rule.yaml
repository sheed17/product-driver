      - "ru-1-emits-ruleproposed"
      - "ruleproposed-does-not-prove-the-rule-is-enforceable"
      # ---- RU-2: compilation. Deterministic, model-free, modelled and non-inferred fields only.
      - "compilation-is-deterministic-and-model-free"
