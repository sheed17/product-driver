  #
  # ### THE SINGLE MOST IMPORTANT ORACLE IN THIS FILE, AND THE ONE MOST LIKELY TO BE SATISFIED THE
  # WRONG WAY. A `GATE_PRECONDITION` rule decides, inside checkpoint step 6, whether an action may
  # proceed and — ADR-010 §6.1's fourth worked example — may raise the gate to
  # `HUMAN_APPROVAL_REQUIRED` under a condition. The temptation, and it arrives dressed as
  # compliance, is to give the rule engine its own `GateRegistry`, because a thing that decides gates
  # "obviously" owns the gate registry. That is a SECOND GATE AUTHORITY, and a second gate authority
  # is the same defect as no gate authority: two answers to "may Neyma do this alone", and nothing
  # that says which one the grant was minted under.
  #
  # A gate decision comes into existence ONLY by constructing a `GateEntry` or a `GateRegistry`.
  # This walks the AST of every production module and asserts the mint population is exactly
  # `checkpoint.py`. The kernel's own `_DEFAULT` construction is the POSITIVE CONTROL: a confinement
  # assertion over a population containing no mint at all passes vacuously and proves nothing.
