  #
  # MIGRATION PARITY. An upgraded database and a fresh one must be the same database. A migration
  # that creates a slightly different `rules` than `create_canonical_schema` does is how a constraint
  # that passes every test in CI is absent in the one database that matters.
  - name: "an upgraded database and a fresh database carry the identical rule layer"
