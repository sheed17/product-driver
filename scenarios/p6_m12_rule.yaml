      - "entity point 44 tests missing: []"

  - risk_category: conflicting_evidence
    claim: >-
      M-49 / GR-8 / S3. A compiled predicate may reference only deterministic, MODELLED,
      NON-INFERRED inputs. A predicate touching a `MODEL_INFERRED` field FAILS TO COMPILE — at
      confidence 1.0, it still fails — and `confidence` is structurally ABSENT from the compiler's
      input type, so a guard cannot read it even by trying. The refusal is TYPED rather than a string
      blacklist over field names, and the six provenance classes are M7's landed vocabulary rather
      than a private copy. This is the rule the whole architecture rests on: if a rule could branch
      on a guess, every guarantee above it would be conditioned on a model's mood.
    checks:
      - "the compiler refuses MODEL_INFERRED by type, and confidence is structurally not an input"
      - "a margin rule refuses to compile on a MODEL_INFERRED cost at confidence 1.0"
      - "the compiler input type has no confidence field to read"
      - "an unmodelled field does not compile, over every provenance class"
    observations:
      - "A RULE MAY NEVER BRANCH ON A GUESS"
      - "CONFIDENCE IS STRUCTURALLY NOT AN INPUT"
      - "AN UNMODELLED FIELD DOES NOT COMPILE"
      - "confidence is a field on the compiler input: False"
      - "attribute reads of confidence anywhere in M12: []"
      - "a MODEL_INFERRED field compiles: refused by"
      - "a MODEL_INFERRED field with confidence 1.0 compiles: refused by"

  - risk_category: missing_data
