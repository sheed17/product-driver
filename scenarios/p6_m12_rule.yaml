name: p6_m12_rule
phase: P6
mode: backend
description: >-
  P6 M12: the Rule — the registered, versioned, deterministic decision procedure WITH AN ID that
  an owner's sentence either compiles into, or honestly does not. This is the machine that resolves
  Stream B lesson L-C, and L-C is the one lesson about what Neyma SAYS rather than what it does.
  An owner types "never bill without a POD" and the old system replied "📋 Noted the procedure for
  raise_invoice" — installing nothing, enforcing nothing, and leaving the owner believing a control
  existed. M12 makes exactly two outcomes possible and there is no third: OUTCOME A, the instruction
  compiles deterministically into an enforceable Rule with a rule_id, generated test vectors, human
  confirmation and authenticated human activation; or OUTCOME B, it does NOT compile, it is retained
  as non-authoritative organizational memory, and the owner is TOLD IN THE LITERAL REPLY that it is
  not a rule and what is missing. A model may propose the candidate TEXT. After that a model never
  compiles, never confirms, never activates, never evaluates and never resolves. Compilation is
  deterministic: every referenced field MODELLED and NON-INFERRED, the predicate decidable at
  checkpoint time, the scope resolvable — and a rule that would branch on a MODEL_INFERRED field
  fails to compile at confidence 1.0, because a policy that could branch on a guess conditions every
  guarantee above it on a model's mood. Two genuinely conflicting active rules FAIL CLOSED into M7's
  RULE_VS_RULE Conflict and are never auto-merged: Neyma never picks a winner. Rules sit at
  precedence layer 6, beneath Constraint, Permanent Product Truth, Brake, Product Policy and Tenant
  Policy, and may never override any of them. M12 IS checkpoint step 6's rule evaluation; it mints
  no gate decision and builds no second checkpoint, because a second gate authority is the same
  defect as no gate authority. M12 ships dark. This scenario measures the DATABASE, the EVENT
  REGISTRY, the LITERAL REPLY TEXT and the AST, not the probe's narration.

setup:
  - ".venv/bin/python scripts/check_env.py"

# The files this unit is expected to PRODUCE. Nothing here exists on the pre-M12 tree, and that is
# the point: `tests/test_scenario_pytest_invocation.py` exempts a scenario's own declared fixtures
# from the "every named test path already exists" rule, precisely so a bootstrap can be written
# before the unit it measures. Every OTHER path this file names is a landed regression anchor and
# must exist today.
fixtures:
  - "pyproject.toml"
  - "src/freight_recon/rule.py"
  - "src/freight_recon/migrations/phase6_rules.py"
  - "eval/tests/test_phase6_rule.py"
  - "scripts/probe_phase6_rule.py"
  - "scripts/mutate_phase6_rule.py"

commands:
  # ------------------------------------------------------------------ coverage and axis oracles
  - name: "the M12 probe can exercise every canonical risk family"
