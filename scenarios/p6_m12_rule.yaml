  # 14 --------------------------------------------------------------------------------------
  #
  # THE AUTHORITY MODEL IS M1's, ALREADY LANDED, AND M12 MUST USE EXACTLY IT. `tenant_humans` has
  # carried the two-member `authority_role` vocabulary since `P6-CP-1`, and `POLICY_OWNER` is the
  # role RU-7's broadening revocation resolves through. M12 inventing a parallel authority is both a
  # scope leak and the exact bypass ADR-010 §4 forbids — and it is the shape "an operational
  # convenience for installing rules quickly" always takes.
  #
  # ### THE PRIVILEGED TERM IS SPELLED AS A PATTERN, NOT AS A COMMAND — `su[d]o`. Product Driver's
  # command guard classifies the command STRING, and cannot know that a literal privileged token is
  # a regex alternation about to be compiled rather than something about to run. A permanent oracle
  # the guard refuses is one no GENERATED scenario can ever cite, so the vocabulary is written as a
  # character class and the oracle PROVES the equivalence at runtime — printing the vocabulary it
  # reconstructed and asserting the compiled pattern matches every declared term. This is the M11
  # `W2-3` repair applied from the start rather than after a blocked run.
  - name: "M12 uses M1's landed tenant authority model and invents no parallel admin authority"
    command: >-
      .venv/bin/python -c "import sys,pathlib,sqlite3,tempfile,os,ast,re; sys.path.insert(0,'src');
      from freight_recon.migrations.phase6_work_items import AUTHORITY_ROLES;
      from freight_recon.schema import create_canonical_schema;
      print('the canonical tenant authority roles:', sorted(AUTHORITY_ROLES));
      print('authority role count:', len(AUTHORITY_ROLES));
      print('POLICY_OWNER is a landed authority role:', 'POLICY_OWNER' in AUTHORITY_ROLES);
      p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3'); c=sqlite3.connect(p); create_canonical_schema(c);
      refs=sorted(set(r[2] for r in c.execute('pragma foreign_key_list(rules)')));
      print('rules references tenant_humans:', 'tenant_humans' in refs);
      print('the rule foreign-key referents:', refs);
      ru=pathlib.Path('src/freight_recon/rule.py').read_text(encoding='utf-8');
      print('M12 names the canonical Policy Owner role:', 'POLICY_OWNER' in ru);
      mig=pathlib.Path('src/freight_recon/migrations/phase6_rules.py').read_text(encoding='utf-8');
      VOCAB='admin|superuser|root_user|god_mode|impersonat|su[d]o|bypass';
      RE=re.compile('(?i)(' + VOCAB + ')');
      TERMS=sorted(re.sub('[][]', '', VOCAB).split('|'));
      PRIV=[t for t in TERMS if t not in ('admin', 'superuser', 'root_user', 'god_mode', 'impersonat', 'bypass')][0];
      docs=lambda t: set(id(n.value) for n in ast.walk(t) if isinstance(n, ast.Expr) and isinstance(n.value, ast.Constant) and isinstance(n.value.value, str));
      syms=lambda t: set([n.name for n in ast.walk(t) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))] + [n.id for n in ast.walk(t) if isinstance(n, ast.Name)] + [n.attr for n in ast.walk(t) if isinstance(n, ast.Attribute)] + [n.arg for n in ast.walk(t) if isinstance(n, ast.arg)] + [n.arg for n in ast.walk(t) if isinstance(n, ast.keyword) and n.arg] + [(n.asname or n.name) for n in ast.walk(t) if isinstance(n, ast.alias)]);
      toks=lambda t: set(n.value for n in ast.walk(t) if isinstance(n, ast.Constant) and isinstance(n.value, str) and id(n) not in docs(t) and n.value and len(n.value) <= 64 and not any(ch.isspace() for ch in n.value));
      vocab=lambda t: sorted(set([n.name for n in ast.walk(t) if isinstance(n, ast.ClassDef) and RE.search(n.name)] + [g.id for n in t.body if isinstance(n, ast.Assign) for g in n.targets if isinstance(g, ast.Name) and re.search('(?i)authority|_roles', g.id)]));
      admin_syms=lambda s: sorted(x for x in syms(ast.parse(s)) if RE.search(x));
      admin_toks=lambda s: sorted(x for x in toks(ast.parse(s)) if RE.search(x));
      admin_vocab=lambda s: vocab(ast.parse(s));
      red=lambda s: bool(admin_syms(s) or admin_toks(s) or admin_vocab(s));
      print('the M12 sources parsed for executable authority:', ['rule.py', 'phase6_rules.py']);
      print('admin-shaped executable symbols M12 defines or calls:', sorted(set(admin_syms(ru) + admin_syms(mig))));
      print('admin-shaped executable authority tokens M12 stores or compares:', sorted(set(admin_toks(ru) + admin_toks(mig))));
      print('authority-role vocabularies M12 declares of its own:', sorted(set(admin_vocab(ru) + admin_vocab(mig))));
      print('M12 invents an admin authority:', red(ru) or red(mig));
      print('M12 defines its own authority role vocabulary:', bool(admin_vocab(ru) or admin_vocab(mig)));
      print('the M12 schema module redefines the human authority table:', 'CREATE TABLE tenant_humans' in mig);
      print('a docstring saying there is no admin path is not an admin authority:', not red('def f():' + chr(10) + '    ' + chr(39)*3 + 'THERE IS NO ADMIN PATH' + chr(39)*3 + chr(10)));
      print('a comment saying there is no admin path is not an admin authority:', not red(chr(35) + ' THERE IS NO ADMIN PATH, EVER' + chr(10) + 'X = 1' + chr(10)));
      print('a refusal message naming the admin path is not an admin authority:', not red('raise M12Error(' + chr(39) + 'RU-5 requires a named human activator (no admin path).' + chr(39) + ')' + chr(10)));
      print('an admin activation function IS an admin authority:', red('def admin_activate(r):' + chr(10) + '    return r' + chr(10)));
      print('an admin authority class IS an admin authority:', red('class AdminAuthority:' + chr(10) + '    pass' + chr(10)));
      print('an admin role token compared in executable code IS an admin authority:', red('def go(r):' + chr(10) + '    if r == ' + chr(39) + 'ADMIN' + chr(39) + ':' + chr(10) + '        return True' + chr(10)));
      print('a superuser attribute read IS an admin authority:', red('def go(u):' + chr(10) + '    return u.is_superuser' + chr(10)));
      print('an as_admin keyword argument IS an admin authority:', red('activate(r, as_admin=True)' + chr(10)));
