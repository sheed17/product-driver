  # ------------------------------------------------------------------ the M12 case vocabulary
  #
  # EACH LITERAL BELOW IS THE HEADLINE OF THE CASE ACTUALLY NAMED ON THE LINE ABOVE IT. This is the
  # M10 correction applied from the start: an oracle that cannot pass on a correct product is the
  # mirror image of a false green, because it teaches the builder to change the product.
  - name: "the happy path: never bill without a POD compiles, is confirmed, is activated and decides a checkpoint"
    run: ".venv/bin/python scripts/probe_phase6_rule.py --case never-bill-without-a-pod-compiles-to-a-gate-precondition"
    expect_exit_code: 0
    timeout_s: 600
    expect_contains:
      - "NEVER BILL WITHOUT A POD COMPILES TO A REAL PRECONDITION"
      - "AN INFERRED POD IS NOT A POD"

  - name: "the instruction that cannot compile, and the owner who is told so"
    run: ".venv/bin/python scripts/probe_phase6_rule.py --case do-not-use-carrier-x-for-produce-cannot-compile"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains:
      - "DO NOT USE CARRIER X FOR PRODUCE CANNOT COMPILE, AND THE OWNER IS TOLD"
