      - "positive control, an ACTIVE rule activated by a named human: ACCEPTED"
      - "positive control, the first ACTIVE rule for a tenant, scope and kind: ACCEPTED"
      - "positive control, a SYSTEM_IMPORTED field compiles: ACCEPTED"

  - risk_category: authorization
    claim: >-
      Authority is never laundered into a rule. A model may propose the candidate TEXT and can never
      compile, confirm, activate, evaluate or resolve at any confidence including 1.0; automation, a
      retry handler, a fired timer and a counterparty cannot activate either; and an unauthorized
      attempt reaches the ALREADY-REGISTERED F14 `UnauthorizedPolicyActivationAttempted` rather than
      a second contract M12 minted for itself. `activated_by` is NOT NULL on every ACTIVE row and is
      a foreign key into M1's landed `tenant_humans`, so a model-activated rule is not insertable —
      and M12 invents no admin, superuser or service-account authority beside M1's two roles.
    checks:
      - "activation requires an authenticated human"
      - "a model cannot activate a rule, at any confidence"
      - "automation cannot activate a rule, from any automated path"
      - "the live database refuses an ACTIVE rule with no activator, an invented state, an invented kind and a cross-tenant actor"
      - "M12 uses M1's landed tenant authority model and invents no parallel admin authority"
      - "M12 emits only registered event names, and mints no ninth F12 contract"
    observations:
      - "ACTIVATION REQUIRES AN AUTHENTICATED HUMAN"
      - "A MODEL CAN NEVER ACTIVATE A RULE"
      - "AUTOMATION CAN NEVER ACTIVATE A RULE"
      - "an ACTIVE rule with no activator: refused"
      - "M12 invents an admin authority: False"
      - "M12 defines its own authority role vocabulary: False"
      - "the F14 security contract is not minted by M12: True"

  - risk_category: safety_invariant
    claim: >-
      L-C, the lesson this machine exists for. A human instruction either compiles into an
      enforceable Rule or is honestly refused, and THERE IS NO THIRD OUTCOME in which Neyma
      acknowledges a procedure and implies it is enforced. The guard is asserted on the LITERAL REPLY
      TEXT, in both directions: "Noted the procedure" with no ACTIVE rule id is REFUSED, the same
      sentence WITH one is ACCEPTED, and the honest refusal — which names what is missing and says
      plainly that it is not a rule — passes cleanly. Structure alone could not catch this: every
      other oracle in the file can be green while the product still tells the owner a comfortable
      lie.
    checks:
      - "the reply text itself is guarded: no claim of enforcement without an ACTIVE rule id"
      - "the reply never claims a procedure was noted"
      - "the instruction that cannot compile, and the owner who is told so"
      - "there are exactly two outcomes, exercised along the outcome axis"
      - "the acceptance battery carries the canonically named adversarial tests"
    observations:
      - "NOTED THE PROCEDURE IS FORBIDDEN WITHOUT AN ACTIVE RULE ID"
      - "AN INSTRUCTION THAT DID NOT COMPILE IS MEMORY, NOT AUTHORITY"
      - "THERE IS NO THIRD OUTCOME"
      - "a claiming reply with NO active rule id: refused by"
      - "positive control, the same claiming reply WITH an active rule id: ACCEPTED"
