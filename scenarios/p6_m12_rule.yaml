    expect_exit_code: 0
    timeout_s: 180
    expect_contains:
      # ---- RU-1: proposal. A model may propose TEXT, and text is not authority.
      - "a-model-may-propose-structured-candidate-text"
      - "a-proposal-is-not-an-enforceable-rule"
