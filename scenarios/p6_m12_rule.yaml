      - "M12 writes the exceptions table directly: False"
      - "M12 mints an F9 contract name: []"
      - "M12 writes the conflicts table directly: False"
      - "THE M7 CONFLICT MACHINE IS UNCHANGED"
      - "THE M9 EXCEPTION MACHINE IS UNCHANGED"
      - "THE M11 POLICY MACHINE IS UNCHANGED"

  - risk_category: retry_safety
    claim: >-
      No automated path moves authority in the unsafe direction. A retry handler cannot activate a
      rule, a timer cannot activate a rule, and neither can broaden one. Automation may only ever
