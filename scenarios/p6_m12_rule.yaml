      print('the honest refusal says it is not a rule:', 'not a rule' in honest.lower());
      print('the honest refusal offers what would be needed:', any(s in honest.lower() for s in (chr(39) + 'd need', 'to make it a real rule')));
      env={'m12':m12,'claim':claim,'honest':honest};
      exec(chr(10).join(['def attempt(label, text, rule_id):',' try:','  m12.assert_reply_is_honest(text, active_rule_id=rule_id)',\"  print(label + ': ACCEPTED')\",' except Exception as exc:',\"  print(label + ': refused by ' + type(exc).__name__ + ': ' + str(exc).split(chr(10))[0])\"]), env);
      attempt=env['attempt'];
      attempt('a claiming reply with NO active rule id', claim, None);
      attempt('positive control, the same claiming reply WITH an active rule id', claim, 'ru-0001');
      attempt('positive control, the honest refusal with no active rule id', honest, None);
