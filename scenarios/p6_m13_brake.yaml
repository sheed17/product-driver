  # 8 ---------------------------------------------------------------------------------------
  #
  # ### THE READ PATH, IN BOTH ITS DIRECTIONS: the token it derives when the store is readable, and
  # the REFUSAL it must produce when it is not. Entity point 36 makes these one requirement, so
  # they are one oracle.
  #
  # ### THE REFUSAL IS ASSERTED BY EXCEPTION TYPE, NOT BY "SOMETHING WENT WRONG". A raw
  # `sqlite3.OperationalError` escaping the store is ALSO a refusal in effect — the caller does not
  # get a brake state — but it is not the canonical `BrakeStoreUnreachable` contract that checkpoint
  # step 7 and the claim CAS catch by name, and a caller that catches the canonical type would let
  # the raw one through. The catch here is deliberately broad so the oracle REPORTS the type rather
  # than dying with a traceback the scenario globally forbids.
  #
  # THE COMPOSITE VERSION TOKEN, MEASURED THROUGH THE LANDED STORE. The claim CAS binds ONE string
  # that carries BOTH monotonic counters, so a change to EITHER owner moves it. The two failure
  # modes are asymmetric and both are asserted: a tenant-only token would let a GLOBAL brake through,
  # and a global-only token would let a TENANT brake through.
  - name: "the brake version token binds both owners and is monotonic, and an unreadable store refuses rather than reading as off"
    command: >-
