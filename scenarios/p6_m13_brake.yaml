  - risk_category: missing_data
    claim: >-
      The probe can reach every canonical risk family and can vary the two axes this unit turns on.
      `--position` walks the five-position boundary, without which only the half of the brake that
      STOPS things is ever exercised and the half that must NOT stop things — where the unknown
      outcome is made — is never reached. `--owner` varies the two composed admission dimensions,
      without which a composite version check is indistinguishable from a single one.
    checks:
      - "the M13 probe can exercise every canonical risk family"
      - "the M13 probe declares its mutation axes"
      - "every M13 case runs end to end"
      - "the M13 acceptance battery carries the canonically named adversarial tests"
