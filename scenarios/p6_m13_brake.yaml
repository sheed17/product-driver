      - "no-brake-console-or-dashboard-exists"
      - "no-channel-brake-command-exists"
      - "no-production-detector-wiring-exists"
      - "nothing-graduates"
      - "landing-m13-is-not-p6-acceptance"
      - "m1-through-m12-are-unchanged"

  - name: "the M13 probe declares its mutation axes"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --list-dimensions"
    expect_exit_code: 0
    timeout_s: 180
    expect_contains:
      # ---- --position: the FIVE-POSITION BOUNDARY. This unit's own first axis, and the reason it
      # exists: positions 1 and 2 STOP, positions 3, 4 and 5 RUN TO A VERIFIED CONCLUSION. A
      # generator that cannot vary the position can only ever exercise the half of the brake that
      # stops things, and the half that must NOT stop things is where the unknown outcome is made.
      - "position:1-not-yet-executing"
      - "position:2-granted-unclaimed"
      - "position:3-claimed-not-yet-called"
      - "position:4-adapter-called-response-pending"
      - "position:5-verification-in-progress"
      # ---- --owner: the TWO COMPOSED ADMISSION DIMENSIONS. This unit's own second axis. An oracle
      # that only ever engages one of them cannot tell a composite version check from a single one.
      - "owner:platform"
      - "owner:tenant"
      - "owner:both"
      # ---- --actor: the actor classes, which must never be collapsed into one
      - "actor:human"
      - "actor:detector"
      - "actor:model"
      - "actor:automation"
      - "actor:timer"
      - "actor:retry"
      - "actor:counterparty"
      # ---- --transition: the five canonical BR rows
      - "transition:BR-1"
      - "transition:BR-2"
      - "transition:BR-3"
      - "transition:BR-4"
      - "transition:BR-5"
      # ---- --inject: the closed fault set, every member a REFUSAL and never a default-open
      - "inject:brake-store-unreadable"
      - "inject:platform-row-absent"
      - "inject:policy-engine-down"
      - "inject:tms-down"
      - "inject:rule-store-down"
      - "inject:brake-between-mint-and-claim"

  - name: "drive the Brake machine through a brokerage incident, and attack it"
    run: ".venv/bin/python scripts/probe_phase6_brake.py"
    expect_exit_code: 0
    timeout_s: 1800
    expect_contains:
      - "behaviours as specified, 0 wrong"
      - "A BRAKE REFUSES TO MINT AND REFUSES TO CLAIM"
      - "A BRAKE NEVER KILLS A WORKER"
      - "THE BRAKE STOPS THE NEXT EFFECT, NOT THE LAST"

  - name: "every M13 case runs end to end"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --all"
    expect_exit_code: 0
    timeout_s: 3600
    expect_contains:
      - "behaviours as specified, 0 wrong"

  # ------------------------------------------------------------------ BR-1: engagement
  - name: "any authenticated human engages instantly, with the policy engine and the TMS down"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --case the-brake-engages-with-the-policy-engine-down --inject policy-engine-down"
    expect_exit_code: 0
    timeout_s: 600
    expect_contains:
      - "ANY AUTHENTICATED HUMAN ENGAGES INSTANTLY, WITH NO CEREMONY"
      - "THE BRAKE ENGAGES WITH THE POLICY ENGINE AND THE TMS DOWN"
      - "A SAFETY CONTROL THAT REQUIRES A HEALTHY SYSTEM IS NOT A SAFETY CONTROL"

  - name: "engagement is one atomic row write that records scope, actor and reason"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --case engagement-is-a-single-atomic-row-write"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["ENGAGEMENT IS ONE ATOMIC ROW WRITE"]

  - name: "a named Sev-0 detector may engage, and a model may never masquerade as one"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --case a-model-cannot-masquerade-as-a-detector --actor model"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains:
      - "A MODEL IS NOT A SEV-0 DETECTOR"
      - "A MODEL MAY NEVER ENGAGE, NARROW OR RELEASE"

  # ------------------------------------------------------------------ BR-2 / BR-3: the ratchet
  - name: "widening narrows authority and automation may do it"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --case automation-may-widen --actor automation"
    expect_exit_code: 0
    timeout_s: 300
    expect_contains:
      - "WIDENING A BRAKE NARROWS AUTHORITY"
      - "AUTOMATION MAY ENGAGE AND WIDEN"

  - name: "narrowing broadens authority and only an authenticated human may do it"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --case only-an-authenticated-human-narrows --actor all"
    expect_exit_code: 0
    timeout_s: 600
    expect_contains:
      - "NARROWING A BRAKE BROADENS AUTHORITY"
      - "AUTOMATION MAY NEVER NARROW OR RELEASE"

  - name: "the safe-direction ratchet holds over every automated path"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --case the-safe-direction-rule-holds-over-every-automated-path --actor all"
    expect_exit_code: 0
    timeout_s: 900
    expect_contains:
      - "AUTOMATION MAY ENGAGE AND WIDEN"
      - "AUTOMATION MAY NEVER NARROW OR RELEASE"
      - "A DETECTOR MAY NEVER CLEAR ITS OWN ALARM"
      - "behaviours as specified, 0 wrong"

  # ------------------------------------------------------------------ BR-4: release evidence
  - name: "release is not a human and a decision_ref alone"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --case release-is-not-a-human-and-a-decision-ref-alone"
    expect_exit_code: 0
    timeout_s: 600
    expect_contains:
      - "RELEASE REQUIRES POSITIVE EVIDENCE, NOT A DECISION REF ALONE"
      - "A PAGE LOADING IS NOT A POSITIVE HEALTH PROOF"

  - name: "an unaccounted in-flight effect and an unresolved Sev-0 each block release"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --case an-unaccounted-in-flight-effect-blocks-release"
    expect_exit_code: 0
    timeout_s: 600
    expect_contains: ["EVERY IN-FLIGHT EFFECT MUST BE ACCOUNTED FOR BEFORE RELEASE"]

  - name: "unresolved unknown outcomes do not block release, and stay frozen and owned"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --case unresolved-unknown-outcomes-do-not-block-release"
    expect_exit_code: 0
    timeout_s: 600
    expect_contains:
      - "UNRESOLVED UNKNOWN OUTCOMES DO NOT BLOCK RELEASE, AND STAY FROZEN AND OWNED"
      - "THE BRAKE RELEASES NOTHING BUT ITSELF"

  - name: "release requires no ceremony to become safer, and invents no second approval workflow"
