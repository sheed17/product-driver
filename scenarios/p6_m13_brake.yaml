  - risk_category: unexpected_state_transition
    claim: >-
      Two states and no third, as a database constraint on BOTH brake tables rather than as a
      convention. The three tempting inventions are refused BY NAME against a live database:
      `PENDING_RELEASE`, which reads like prudence and IS the forbidden release-approval ceremony;
      `ENGAGING`, which arrives with any author who thinks of engagement as a process; and `EXPIRED`,
      which arrives with any author who thinks in TTLs. "Engaged by a human vs by a detector" is a
      FIELD, "partially released" is a SCOPE CHANGE, and the five BR rows are declared as a table
