  - risk_category: restart_recovery
    claim: >-
      Replay reconstructs the incident timeline and creates nothing. It never engages a live brake,
      mints no witness, mints no grant and produces no external effect — because a replay that
      re-engaged a brake would stop a healthy system, and a replay that minted authority would be a
