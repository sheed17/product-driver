      - "REPLAY NEVER ENGAGES A LIVE BRAKE"

  - risk_category: approval_required
    claim: >-
      A brake withdraws the authority to produce consequential effects; it does not shut the process
      down. Pending approvals stay RECORDED and simply cannot authorize execution, reaching M4's
      landed `VOID_ON_BRAKE` rather than a brake-local approval mechanism. Compensation IS an effect
      and is BLOCKED — uncomfortable and correct, because a system misbehaving badly enough to be
      braked must not start writing "corrections" into the TMS. Observation and reconciliation
      CONTINUE, because blinding yourself during an incident is the opposite of what you want.
    checks:
      - "a pending approval stays recorded and cannot authorize execution"
