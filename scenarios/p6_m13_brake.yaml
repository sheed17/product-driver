    expect_exit_code: 0
    timeout_s: 300
    expect_contains: ["REQUIRING CEREMONY TO BECOME SAFER IS A DESIGN ERROR"]

  - name: "an unauthorized release reaches the already-registered F14 event"
    run: ".venv/bin/python scripts/probe_phase6_brake.py --case an-unauthorized-release-emits-the-registered-f14-security-event --actor all"
