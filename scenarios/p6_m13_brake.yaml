    claim: >-
      ### M13 EDITS THE MODULE IT MEASURES, WHICH NO EARLIER P6 UNIT DID. `brake.py` is P3's landed
      kernel brake, and completing it is the correct build — but P3's checkpoint matrix, claim CAS
      and step-order batteries are what turn red if it is completed carelessly, and M4, M10 and M12
      all consume brake state by their own guard. Every landed machine's semantics must be unchanged,
      and the anchors are RUN rather than cited.
