  # 20 --------------------------------------------------------------------------------------
  #
  # THE SCOPE GRAMMAR IS CLOSED, AND AN UNKNOWN SCOPE IS A REFUSAL. ### THIS IS THE ORACLE FOR THE
  # SCOPE-VOCABULARY AUTHORITY QUESTION (`M13-AQ-6`). Whatever set of the five canonical dimensions
  # this unit lands, the ones it does NOT land must be UNSPELLABLE — raising at the boundary — never
  # silently parsed into something narrower or into nothing. An unknown scope that reads as "no
  # brake" is the fail-closed inversion in its most deniable form.
  - name: "the scope grammar is closed and declared, and an unparseable scope refuses rather than scoping to nothing"
    command: >-
      .venv/bin/python -c "import sys; sys.path.insert(0,'src');
      import freight_recon.brake_lifecycle as m13; from freight_recon.brake import BrakeError;
      print('the canonical scope dimensions:', sorted(m13.CANONICAL_SCOPE_DIMENSIONS));
      print('canonical dimension count:', len(m13.CANONICAL_SCOPE_DIMENSIONS));
      print('the dimensions this unit lands:', sorted(m13.LANDED_SCOPE_DIMENSIONS));
      print('the dimensions this unit records as deferred:', sorted(m13.DEFERRED_SCOPE_DIMENSIONS));
      print('landed and deferred partition the canonical five:', sorted(set(m13.LANDED_SCOPE_DIMENSIONS) | set(m13.DEFERRED_SCOPE_DIMENSIONS)) == sorted(m13.CANONICAL_SCOPE_DIMENSIONS));
      print('landed and deferred do not overlap:', not (set(m13.LANDED_SCOPE_DIMENSIONS) & set(m13.DEFERRED_SCOPE_DIMENSIONS)));
      print('every deferred dimension carries a recorded reason:', sorted(x for x in m13.DEFERRED_SCOPE_DIMENSIONS if not m13.SCOPE_DEFERRAL_REASONS.get(x)));
      env={'m13':m13,'BrakeError':BrakeError};
      exec(chr(10).join(['def check(label, scope):',' try:',\"  m13.parse_scope(scope); print(label + ': PARSED')\",' except BrakeError as exc:',\"  print(label + ': refused by ' + str(exc).split(chr(10))[0])\"]), env);
      check=env['check'];
      [check(lbl, sc) for lbl, sc in [('positive control, a tenant-wide scope', 'tenant'), ('positive control, an action-class scope', 'action:pay_carrier'), ('an unknown scope dimension', 'weather:rainy'), ('an empty scope', ''), ('a scope with no dimension', 'pay_carrier'), ('a deferred dimension that was not landed', 'counterparty:redline')]];
      print('an unknown scope is never treated as no brake:', m13.unknown_scope_denies() is True)"
    timeout_s: 300
    contains:
      - "the canonical scope dimensions: ['ACTION_CLASS', 'COUNTERPARTY', 'GLOBAL', 'INTEGRATION', 'TENANT']"
      - "canonical dimension count: 5"
      - "landed and deferred partition the canonical five: True"
      - "landed and deferred do not overlap: True"
      - "every deferred dimension carries a recorded reason: []"
      - "positive control, a tenant-wide scope: PARSED"
      - "positive control, an action-class scope: PARSED"
      - "an unknown scope dimension: refused"
      - "an empty scope: refused"
      - "a scope with no dimension: refused"
      - "an unknown scope is never treated as no brake: True"

  # 21 --------------------------------------------------------------------------------------
  #
  # THE ONE-WAY RATCHET AS A DECLARED TABLE, NOT AS SCATTERED `if` STATEMENTS. Three actor classes
  # that must never collapse into one, and the safe direction stated once so a property test can
  # quantify over it. ### `system`, `detector` and `model` ARE THREE DIFFERENT THINGS: a model is
  # not a Sev-0 detector, and a detector may never clear its own alarm.
  - name: "the safe-direction ratchet is a declared table over three distinct actor classes"
    command: >-
      .venv/bin/python -c "import sys; sys.path.insert(0,'src');
      import freight_recon.brake_lifecycle as m13;
      print('the actor classes:', sorted(m13.ACTOR_KINDS));
      print('actor class count:', len(m13.ACTOR_KINDS));
      print('system detector and model are distinct:', len({'DETECTOR','MODEL','AUTOMATION'} & set(m13.ACTOR_KINDS)) >= 2);
      print('what a human may do:', sorted(m13.permitted_transitions('HUMAN')));
      print('what a detector may do:', sorted(m13.permitted_transitions('DETECTOR')));
      print('what automation may do:', sorted(m13.permitted_transitions('AUTOMATION')));
      print('what a model may do:', sorted(m13.permitted_transitions('MODEL')));
      print('what a timer may do:', sorted(m13.permitted_transitions('TIMER')));
      print('what a retry handler may do:', sorted(m13.permitted_transitions('RETRY')));
      print('what a counterparty may do:', sorted(m13.permitted_transitions('COUNTERPARTY')));
      print('a detector may never clear its own alarm:', 'BR-4' not in m13.permitted_transitions('DETECTOR'));
      print('every non-human actor is refused BR-3 and BR-4:', sorted(k for k in m13.ACTOR_KINDS if k != 'HUMAN' and ({'BR-3','BR-4'} & set(m13.permitted_transitions(k)))));
      print('the safe direction is stated once:', m13.SAFE_DIRECTION_RULE)"
    timeout_s: 300
    contains:
      - "what a human may do: ['BR-1', 'BR-2', 'BR-3', 'BR-4']"
      - "what a detector may do: ['BR-1', 'BR-2']"
      - "what automation may do: ['BR-1', 'BR-2']"
      - "what a model may do: []"
      - "what a timer may do: []"
      - "what a retry handler may do: []"
      - "what a counterparty may do: []"
      - "a detector may never clear its own alarm: True"
      - "every non-human actor is refused BR-3 and BR-4: []"

  # 22 --------------------------------------------------------------------------------------
  #
  # THE ADVERSARIAL TEST NAMES THE CANONICAL CORPUS SPELLS OUT. Entity point 44 and the machine's
  # §41 name ten tests by name; a battery that covers the same ground under different names is
  # coverage nobody can cite from the specification. The count is asserted so an empty battery
  # cannot satisfy a membership check.
  - name: "the M13 acceptance battery carries the canonically named adversarial tests"
    command: >-
      .venv/bin/python -c "import ast,pathlib;
      f=pathlib.Path('eval/tests/test_phase6_brake.py');
      print('the M13 acceptance battery exists:', f.exists());
      tree=ast.parse(f.read_text() if f.exists() else '');
      names=sorted(n.name for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name.startswith('test_'));
      print('the M13 battery test count:', len(names));
      need=('engaging_the_brake_during_an_adapter_call_does_not_create_an_unknown_outcome','brake_between_mint_and_claim_race_never_both_never_neither','brake_engages_with_policy_engine_and_tms_down','automation_can_engage_but_never_release','release_re_checkpoints_all_queued_work','stale_grant_after_release_is_refused','no_timer_can_move_a_brake','detector_cannot_release_its_own_brake','active_brake_is_reported_unprompted','fail_closed_on_unreadable_brake');
      blob=' '.join(names);
      print('entity point 44 tests missing:', sorted(x for x in need if x not in blob));
      print('the machine section 41 acceptance items missing:', sorted(x for x in ('unknown_outcome','never_both_never_neither','tms_down','never_release','re_checkpoint','never_auto_expires','stay_frozen') if x not in blob))"
    timeout_s: 300
    contains:
      - "the M13 acceptance battery exists: True"
      - "entity point 44 tests missing: []"
      - "the machine section 41 acceptance items missing: []"

verifies:
  - risk_category: happy_path
    claim: >-
      The brake works when everything else does not. An authenticated human engages instantly, with
      the policy engine and the TMS down, in one atomic row write and with no approval and no
      ceremony — and from that instant no new grant is minted and no existing grant is claimed. Every
      refusal in this file is only meaningful because this succeeds: an oracle battery proving that
      nothing can ever engage a brake would pass a product with no brake at all, and a battery
      proving nothing can ever be released would pass a product that can never be restarted.
    checks:
      - "any authenticated human engages instantly, with the policy engine and the TMS down"
      - "engagement is one atomic row write that records scope, actor and reason"
      - "drive the Brake machine through a brokerage incident, and attack it"
      - "the live database refuses a third state, a releaser-less release, a detector releaser and a cross-tenant actor"
      - "a brake row is never deleted, and the incident record is permanent"
    observations:
      - "ANY AUTHENTICATED HUMAN ENGAGES INSTANTLY, WITH NO CEREMONY"
      - "THE BRAKE ENGAGES WITH THE POLICY ENGINE AND THE TMS DOWN"
      - "positive control, a well-formed ACTIVE brake: ACCEPTED"
      - "positive control, a RELEASED brake with a human releaser and a decision_ref: ACCEPTED"
      - "positive control, a lawful release through the one authority: RELEASED"

  - risk_category: safety_invariant
    claim: >-
      ### THE SENTENCE THIS MACHINE EXISTS FOR. A brake is admission control, not process
      termination: it refuses to mint and refuses to claim, and it NEVER kills a worker. An effect at
      position 3, 4 or 5 — claimed, executing, or verifying — RUNS TO A VERIFIED CONCLUSION, because
      killing it would convert a knowable outcome into an unknown one and manufacture the exact
      hazard the operator engaged the brake to avoid. This is exercised at every one of the five
      boundary positions, not asserted once in the middle of the table.
    checks:
      - "the brake never kills a worker, at every one of the five boundary positions"
      - "engaging during an adapter call creates no unknown outcome"
      - "an unclaimed grant becomes unclaimable while a claimed one runs to verification"
      - "verification in progress is a read and the brake has no reason to stop it"
      - "a compensation that already claimed runs to verification like any other effect"
    observations:
      - "A BRAKE NEVER KILLS A WORKER"
      - "THE BRAKE STOPS THE NEXT EFFECT, NOT THE LAST"
      - "KILLING A WORKER WOULD MANUFACTURE AN UNKNOWN OUTCOME"
      - "ENGAGING DURING AN ADAPTER CALL CREATES NO UNKNOWN OUTCOME"
      - "A CLAIMED GRANT RUNS TO VERIFICATION"

  - risk_category: authorization
    claim: >-
      The one-way ratchet, which is the same sentence that governs autonomy. Automation may ENGAGE
      and WIDEN, because both move authority in the safe direction; automation may NEVER NARROW or
      RELEASE, because both broaden it. A detector may never clear its own alarm. A model is not a
      Sev-0 detector and may touch nothing at all — `system`, `detector` and `model` are three actor
      classes and collapsing them into one is how a model acquires the brake. `released_by` is a real
      authenticated human of the acting tenant, enforced by the database, so a detector-released
      brake is not insertable rather than merely unreachable.
    checks:
      - "the safe-direction ratchet holds over every automated path"
      - "narrowing broadens authority and only an authenticated human may do it"
      - "a named Sev-0 detector may engage, and a model may never masquerade as one"
      - "the safe-direction ratchet is a declared table over three distinct actor classes"
      - "the live database refuses a third state, a releaser-less release, a detector releaser and a cross-tenant actor"
      - "an unauthorized release reaches the already-registered F14 event"
    observations:
