    claim: >-
      M13 ships dark and is a landed increment, never a phase acceptance. No brake console, no
      dashboard, no admin screen, no Slack, email, SMS or voice brake command, no production detector
      wiring, no outbound integration, no freight workflow and no P7 or P8 runtime. Landing M13 does
      not mark P6 complete, does not score a P6 criterion and does not unblock P7 — and this is
      asserted rather than assumed, because M13 being the last machine is exactly the reason a
      session would drift into treating its landing as the phase's.
