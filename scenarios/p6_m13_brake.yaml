      - "transition:BR-5"
      - "entity point 44 tests missing: []"
      - "behaviours as specified, 0 wrong"

  - risk_category: regression
    claim: >-
      The battery is measured rather than asserted. Every planted mutant reintroduces a defect whose
      prohibition is canonically established — a third state, automation releasing, a detector
      narrowing, a timer auto-releasing, an absent brake store read as released, a claim CAS that
      stops checking either version component, a brake that kills a worker, a release that leaves a
      witness valid, a fake-tenant global, a second brake authority — and each must turn the
      acceptance battery red for its own reason. An anti-vacuity control proves the count is a
      measurement.
    checks:
      - "the M13 mutation battery catches every planted defect"
      - "the M13 acceptance battery passes"
    observations:
      - "mutations caught, 0 escaped"
      - "passed"

