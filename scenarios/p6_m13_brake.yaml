  - risk_category: partial_failure
    claim: >-
      M13 hardens tables P3 created, which is the migration shape most likely to drift: a fresh
      database gets the new DDL inline while an existing one gets it through an ALTER path, and the
      two diverge silently. The upgraded and fresh brake layers are asserted byte-identical, a second
      application is a no-op, and P3's own readiness still holds afterwards — because a migration
      that hardened the schema by breaking the phase beneath it is not a hardening.
    checks:
