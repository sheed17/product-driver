  - risk_category: timeout_before_effect
    claim: >-
      A brake never expires, and no clock may ever make one less restrictive. There is no TTL column,
      no expiry state, no auto-release path and no expiry identifier in executable code — measured on
      the live schema and on the AST separately, because a brake that expires releases itself while
      nobody is looking and a clock cannot know whether the fire is out. BR-5 is an enumerated
      illegal refusal rather than an unwritten path, so adding a scheduler later cannot quietly find
