  - risk_category: ui_backend_disagreement
    claim: >-
      A hidden brake is a silent degradation and violates R17: a system that has quietly stopped
      working is indistinguishable, to an owner, from a system with nothing to do. The canonical
      report states, unprompted, the scope AND what is still allowed, the reason, the actor and
      whether it was a human or a named detector, the time, the prevented effects, the in-flight
      effects and their status, the unresolved unknown outcomes with exposure, and THE EXACT
      REQUIREMENTS FOR RELEASE — not "contact an administrator". The representation is what M13 owes;
      a channel is P8's and is forbidden here.
