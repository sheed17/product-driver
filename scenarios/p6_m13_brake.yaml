expect_state:
  # 1 ---------------------------------------------------------------------------------------
  #
  # THE BRAKE LAYER EXISTS ON A FRESH CANONICAL DATABASE, AND IT IS THE LANDED ONE. `brakes` and
  # `platform_brake` are P3's tables, not M13's: this oracle is here so that a unit which "added the
  # brake layer" by creating a THIRD table beside them fails on the table set rather than on taste.
  - name: "a freshly created canonical database carries the one brake layer, and exactly two brake tables"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys; sys.path.insert(0,'src');
      from freight_recon.schema import (create_canonical_schema, schema_readiness_problems,
      enable_and_verify_foreign_keys); p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3');
      c=sqlite3.connect(p); create_canonical_schema(c); enable_and_verify_foreign_keys(c);
      print('problems:', schema_readiness_problems(c));
      t=sorted(r[0] for r in c.execute('select name from sqlite_master where type=' + chr(39) + 'table' + chr(39)));
      print('the canonical table set:', t);
      brake_tables=sorted(x for x in t if chr(98)+chr(114)+chr(97)+chr(107)+chr(101) in x);
      print('tables whose name carries the word brake:', brake_tables);
      print('brake state tables:', len(brake_tables));
      print('a second brake state table appeared:', sorted(set(brake_tables) - {'brakes','platform_brake'}))"
    timeout_s: 300
    contains:
      - "problems: []"
      - "brakes"
      - "platform_brake"
      - "checkpoint_witnesses"
      - "effect_grants"
      - "tenant_humans"
      - "approvals"
      - "compensations"
      - "rules"
      - "policies"
      - "event_outbox"
      - "the canonical table set:"
      - "brake state tables: 2"
      - "a second brake state table appeared: []"

  # 2 ---------------------------------------------------------------------------------------
  #
  # TWO STATES, AS A DATABASE CONSTRAINT, ON BOTH BRAKE TABLES — AND THE FORBIDDEN THIRD BY NAME.
  # `PENDING_RELEASE` and `ENGAGING` are the two a careful builder invents while being careful:
  # "pending release" reads like prudence and IS the forbidden ceremony, and `EXPIRED` arrives with
  # any code that thinks in TTLs. This asserts the CHECK exists on BOTH tables, because the platform
  # row is the one an author is most likely to leave loosely typed.
  - name: "the two canonical brake states are a database constraint on both brake tables, and there is no third"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys,re; sys.path.insert(0,'src');
      from freight_recon.schema import create_canonical_schema; p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3');
      c=sqlite3.connect(p); create_canonical_schema(c);
      ddl=lambda t: (lambda r: r[0] if r else '')(c.execute('select sql from sqlite_master where name=?', (t,)).fetchone());
      vocab=lambda t: dict([(m[0], re.findall(chr(39) + '([^' + chr(39) + ']*)' + chr(39), m[2])) for m in reversed(re.findall('([A-Za-z0-9_]+) +(NOT +)?IN *[(]([^)]*)[)]', ddl(t))) if not m[1]]);
      banned=('PENDING','PENDING_RELEASE','ENGAGING','DISENGAGED','EXPIRED','SUSPENDED','PARTIAL','FAILED','CANCELLED','PAUSED','DISABLED','ENABLED','RECOVERING','DRAFT','APPROVED');
      [print('---', t) or
      print('the state vocabulary is a CHECK:', bool(vocab(t).get('state'))) or
      print('canonical two:', sorted(vocab(t).get('state') or [])) or
      print('state count:', len(vocab(t).get('state') or [])) or
      print('forbidden states present:', sorted([x for x in (vocab(t).get('state') or []) if x in banned])) or
      print('the actor_kind vocabulary is a CHECK:', bool(vocab(t).get('actor_kind'))) or
      print('canonical actor kinds:', sorted(vocab(t).get('actor_kind') or []))
      for t in ('brakes','platform_brake')];
      nn=[r[1] for r in c.execute('pragma table_info(brakes)') if r[3]];
      print('the brakes NOT NULL column set:', sorted(nn));
      cols=sorted(r[1] for r in c.execute('pragma table_info(brakes)'));
      print('the brakes column set:', cols);
      print('every canonical required attribute is a column:', sorted(x for x in ('tenant','brake_id','scope','state','brake_version','actor','actor_kind','engaged_reason','engaged_at','released_by','release_decision_ref','released_at') if x not in cols));
      pcols=sorted(r[1] for r in c.execute('pragma table_info(platform_brake)'));
      print('the platform_brake column set:', pcols);
      print('platform_brake carries a tenant column:', any(x.startswith('tenant') for x in pcols))"
    timeout_s: 300
    contains:
      - "the state vocabulary is a CHECK: True"
      - "canonical two: ['ACTIVE', 'RELEASED']"
      - "state count: 2"
      - "forbidden states present: []"
      - "the actor_kind vocabulary is a CHECK: True"
      - "canonical actor kinds: ['DETECTOR', 'HUMAN']"
      - "every canonical required attribute is a column: []"
      - "platform_brake carries a tenant column: False"

  # 3 ---------------------------------------------------------------------------------------
  #
  # NO TTL, NO EXPIRY, NO CLOCK — MEASURED ON THE LIVE SCHEMA AND ON THE EXECUTABLE CODE SEPARATELY.
  #
  # ### THE MEASUREMENT ITSELF IS THE SUBTLE PART, AND THIS BOOTSTRAP GOT IT WRONG ONCE BEFORE
  # FIXING IT. `brake.py`'s module docstring contains the words "TTL" and "expire" — in the sentence
  # explaining that neither exists. A grep over the file text reports a TTL on a tree that has none.
  # So the code half of this oracle walks the AST and reads IDENTIFIERS and NON-DOCSTRING STRING
  # LITERALS only. A guard that fires on the prose describing its own absence is not a guard.
  - name: "no TTL or expiry exists — not as a column, not as an identifier, not as a live code path"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys,ast; sys.path.insert(0,'src');
      from freight_recon.schema import create_canonical_schema; p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3');
      c=sqlite3.connect(p); create_canonical_schema(c);
      cols=[t + '.' + r[1] for t in ('brakes','platform_brake') for r in c.execute('pragma table_info(' + t + ')')];
      print('the brake column universe:', sorted(cols));
      print('TTL or expiry columns on a brake table:', sorted(x for x in cols if any(w in x.lower() for w in ('ttl','expire','expiry','until','deadline'))));
      import pathlib; env={'ast':ast,'pathlib':pathlib};
      exec(chr(10).join([
      'def scan(path):',
      '    tree = ast.parse(pathlib.Path(path).read_text())',
      '    docs = set()',
      '    for node in ast.walk(tree):',
      '        if isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):',
      '            first = node.body[0] if node.body else None',
      '            if isinstance(first, ast.Expr) and isinstance(first.value, ast.Constant) and isinstance(first.value.value, str):',
      '                docs.add(id(first.value))',
      '    idents = set()',
      '    for n in ast.walk(tree):',
      '        if isinstance(n, ast.Name): idents.add(n.id)',
      '        elif isinstance(n, ast.Attribute): idents.add(n.attr)',
      '        elif isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)): idents.add(n.name)',
      '        elif isinstance(n, ast.arg): idents.add(n.arg)',
      '    lits = [n.value for n in ast.walk(tree) if isinstance(n, ast.Constant) and isinstance(n.value, str) and id(n) not in docs]',
      '    return idents, lits']), env);
      scan=env['scan']; words=('ttl','expire','expiry','timerfired','auto_release','autorelease');
      [print(f) or
      print('  expiry identifiers:', sorted(i for i in scan(f)[0] if any(w in i.lower() for w in words))) or
      print('  expiry literals in executable code:', sorted(s for s in scan(f)[1] if any(w in s.lower() for w in words)))
      for f in sorted(x for x in ('src/freight_recon/brake.py','src/freight_recon/brake_lifecycle.py','src/freight_recon/migrations/phase3_checkpoint.py','src/freight_recon/migrations/phase6_brakes.py') if os.path.exists(x))]"
    timeout_s: 300
    contains:
      - "TTL or expiry columns on a brake table: []"
      - "src/freight_recon/brake.py"
      - "src/freight_recon/brake_lifecycle.py"
      - "  expiry identifiers: []"
      - "  expiry literals in executable code: []"

  # 4 ---------------------------------------------------------------------------------------
  #
  # THE FORBIDDEN WRITES, ATTEMPTED AGAINST A LIVE DATABASE, BEHIND POSITIVE CONTROLS. Reading DDL
  # and believing it is how a CHECK that was never compiled reads as enforcement. The surviving-row
  # count is asserted so a schema that refuses EVERYTHING cannot pass by being uniformly hostile.
  #
  # ### THE LOAD-BEARING ONES ARE `a RELEASED brake with no releaser` and `a detector-released
  # brake`. Entity point 16 makes both database constraints and point 37 makes both STRUCTURALLY
  # IMPOSSIBLE STATES. If a RELEASED row can exist with a null `released_by`, then "a human released
  # this" is a convention; if `released_by` may hold a detector id, then the whole one-way ratchet is
  # a runtime `if` that one refactor deletes.
  - name: "the live database refuses a third state, a releaser-less release, a detector releaser and a cross-tenant actor"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys,re; sys.path.insert(0,'src');
      from freight_recon.schema import create_canonical_schema, enable_and_verify_foreign_keys;
      p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3'); c=sqlite3.connect(p);
      create_canonical_schema(c); enable_and_verify_foreign_keys(c); T='brakes';
      print('brakes table present:', bool(c.execute('select 1 from sqlite_master where type=' + chr(39) + 'table' + chr(39) + ' and name=?', (T,)).fetchone()));
      ddl=lambda t: (lambda r: r[0] if r else '')(c.execute('select sql from sqlite_master where name=?', (t,)).fetchone());
      vocab=lambda t: dict([(m[0], re.findall(chr(39) + '([^' + chr(39) + ']*)' + chr(39), m[2])) for m in reversed(re.findall('([A-Za-z0-9_]+) +(NOT +)?IN *[(]([^)]*)[)]', ddl(t))) if not m[1]]);
      info=lambda t: list(c.execute('pragma table_info(' + t + ')')); colsof=lambda t: [r[1] for r in info(t)];
      env={'c':c,'sqlite3':sqlite3,'vocab':vocab,'info':info,'colsof':colsof,'T':T};
