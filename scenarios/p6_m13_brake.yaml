      pkg=sorted(pathlib.Path('src/freight_recon').rglob('*.py'));
      owners=[]; tables=set(); minters=[];
      LIFECYCLE={'engage','release'}; WRITES=('insert into brakes','update brakes','insert into platform_brake','update platform_brake'); GATES=('GateEntry','GateRegistry','register_gate');
      env={'ast':ast,'owners':owners,'tables':tables,'minters':minters,'LIFECYCLE':LIFECYCLE,'WRITES':WRITES,'GATES':GATES};
      exec(chr(10).join([
      'def visit(path):',
      '    tree = ast.parse(path.read_text())',
      '    docs = set()',
      '    for node in ast.walk(tree):',
      '        if isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):',
      '            first = node.body[0] if node.body else None',
      '            if isinstance(first, ast.Expr) and isinstance(first.value, ast.Constant) and isinstance(first.value.value, str):',
      '                docs.add(id(first.value))',
      '    lits = [n.value for n in ast.walk(tree) if isinstance(n, ast.Constant) and isinstance(n.value, str) and id(n) not in docs]',
      '    for cls in [n for n in ast.walk(tree) if isinstance(n, ast.ClassDef)]:',
      '        methods = {m.name for m in cls.body if isinstance(m, (ast.FunctionDef, ast.AsyncFunctionDef))}',
      '        if LIFECYCLE <= methods:',
      '            owners.append(path.name + chr(58) + cls.name)',
      '    for s in lits:',
      '        low = s.lower()',
      '        if any(w in low for w in WRITES):',
      '            tables.add(path.name)',
      '    for call in [n for n in ast.walk(tree) if isinstance(n, ast.Call)]:',
      '        fn = call.func',
      '        name = fn.id if isinstance(fn, ast.Name) else (fn.attr if isinstance(fn, ast.Attribute) else chr(0))',
      '        if name in GATES:',
      '            minters.append(path.name + chr(58) + name)']), env);
      [env['visit'](p) for p in pkg];
      print('classes that own the brake lifecycle:', sorted(set(owners)));
      print('brake authority count:', len(set(owners)));
      print('modules that WRITE brake state directly:', sorted(tables));
      print('brake-writing module count:', len(tables));
      print('modules that construct a gate decision:', sorted(set(minters)));
      import re; texts={p.name: p.read_text() for p in pkg};
      print('modules that import the brake store:', sorted(n for n, t in texts.items() if re.search('from [.]brake import|from freight_recon[.]brake import', t)));
      print('M13 composes with the landed store:', ('brake_lifecycle.py' not in texts) or bool(re.search('from [.]brake import', texts.get('brake_lifecycle.py', ''))))"
    timeout_s: 600
