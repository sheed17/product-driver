      - "total registered contracts: 118"
      - "F13 contract count: 4"
      - "forbidden brake contracts registered: []"
      - "BrakeReleased is human_only: True"
      - "BrakeWidened is human_only: False"
      - "unregistered Brake-shaped names M13 mints: []"
