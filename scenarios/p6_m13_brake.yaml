      - "F13 is strict per aggregate and the envelope carries its ordering fields"
      - "an unauthorized release reaches the already-registered F14 event"
      - "the F13 family is exactly four registered contracts, strictly ordered, and M13 mints no fifth"
      - "M13 emits only registered event names, and the landed consumers of BrakeEngaged still consume it"
    observations:
