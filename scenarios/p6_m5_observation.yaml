# Note what is NOT here. There is no required literal about whether `BOUND` or `UNPARSEABLE` is
# terminal, and none about what a duplicate does to an already-advanced row: the repository's own
# authority does not currently settle any of the three (see the header and
# `tasks/neyma_p6_m5.md` §3.9). Every literal below is one that every reading agrees on.
# ---------------------------------------------------------------------------
