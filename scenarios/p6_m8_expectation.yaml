  - risk_category: retry_safety
    claim: >-
      Replay rebuilds the verdict, not a new one. A full-history rebuild reconstructs `OVERDUE` and
      `INDETERMINATE` from the coverage that was RECORDED at the time rather than from the channel's
      state now — the honesty distinction survives replay, and it reaches the same answer next
