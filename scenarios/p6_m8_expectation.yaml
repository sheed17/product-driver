  - risk_category: concurrency
    claim: >-
      At most one live `RAISED` Expectation exists per `(tenant, expectation_key)`, and that is a
      PARTIAL UNIQUE index rather than an application-level check two writers both pass. Concurrent
      raisers produce one live Expectation; a discharge racing a deadline is won by the discharge, as
      §16's precedence requires, proved under real concurrency rather than by calling the two in a
      convenient order; and a stale expected version raises rather than silently overwriting.
    checks:
