# ---------------------------------------------------------------------------
# The declared risk coverage. Every claim names the checks that can actually EMIT the observations it
# requires — a claim naming commands that cannot produce its literal fails closed forever, on every
# run, no matter how correct the product is, and it fails wearing the costume of a product defect.
# ---------------------------------------------------------------------------
verifies:
  - risk_category: safety_invariant
    claim: >-
      The honesty split is the unit. A missed deadline over a demonstrably HEALTHY window is
      `OVERDUE`; a missed deadline over a window that was DOWN, UNKNOWN, ABSENT or only PARTIALLY
      covered is `INDETERMINATE`. `OVERDUE` without a healthy `coverage_ref` is structurally
      impossible — a database CHECK, not a branch — and the absence of a coverage record is never
      read as health. We do not accuse a counterparty of a failure that was ours.
    checks:
      - "drive the Expectation machine through a brokerage narrative, and attack it"
      - "OVERDUE requires healthy coverage and the human-owned states require an owner, as CHECKs"
      - "the observation-coverage record M8 reads is persisted, tenant-first and windowed"
    observations:
      - "OVERDUE MEANS IT NEVER CAME; INDETERMINATE MEANS WE WERE NOT WATCHING"
      - "A MISSED DEADLINE OVER A DEMONSTRABLY HEALTHY WINDOW IS OVERDUE"
      - "A MISSED DEADLINE OVER A BLIND WINDOW IS INDETERMINATE, NOT OVERDUE"
      - "UNKNOWN COVERAGE IS INDETERMINATE, NOT OVERDUE"
      - "THE ABSENCE OF A COVERAGE RECORD IS NOT HEALTH"
      - "PARTIAL COVERAGE OVER THE WINDOW IS NOT HEALTH"
      - "OVERDUE WITHOUT A HEALTHY coverage_ref IS STRUCTURALLY IMPOSSIBLE"
      - "WE DO NOT ACCUSE A COUNTERPARTY OF A FAILURE THAT WAS OURS"
      - "OVERDUE requires healthy coverage: True"
      - "coverage health is never defaulted: True"

  - risk_category: authorization
    claim: >-
      A model may PROPOSE that an Expectation is owed; the deadline and the coverage are
      runtime-set. Counterparty or model content never asserts that the channel was healthy,
      confidence never turns `INDETERMINATE` into `OVERDUE` at any value including 1.0, and an
      Expectation OWES something rather than authorizing anything — `checkpoint.py` remains the only
      thing that mints a gate decision and M3 remains the single effect authority.
    checks:
      - "drive the Expectation machine through a brokerage narrative, and attack it"
      - "the checkpoint is still the only thing that mints a gate decision"
    observations:
      - "A MODEL MAY PROPOSE AN EXPECTATION; THE DEADLINE AND THE COVERAGE ARE RUNTIME-SET"
      - "COUNTERPARTY CONTENT NEVER ASSERTS THAT THE CHANNEL WAS HEALTHY"
      - "CONFIDENCE NEVER TURNS INDETERMINATE INTO OVERDUE"
      - "AN EXPECTATION OWES SOMETHING; IT DOES NOT AUTHORIZE ANYTHING"
      - "M8 MINTS NO GATE DECISION"
      - "AN UNDISCHARGED EXPECTATION MAKES A FIELD unknown, NEVER consistent"
      - "modules that MINT a gate decision: ['checkpoint.py']"

  - risk_category: missing_data
    claim: >-
      A required basis that is absent fails closed rather than being assumed. An Expectation cannot
      be raised without a declared `expected_source` or without a deadline; an `OVERDUE` or
      `INDETERMINATE` Expectation cannot exist without a named human owner; a discharge cannot happen
      without a bound Observation; and an Expectation is never treated as `conflicting` — we do not
      have too much information, we have too little, and `unknown` is not `conflicting`.
    checks:
      - "drive the Expectation machine through a brokerage narrative, and attack it"
      - "OVERDUE requires healthy coverage and the human-owned states require an owner, as CHECKs"
      - "the owner, the discharging observation and the coverage record are FOREIGN KEYS"
    observations:
      - "THE OBSERVABILITY CHANNEL IS DECLARED AT CREATION OR THERE IS NO EXPECTATION"
      - "AN OVERDUE OR INDETERMINATE EXPECTATION HAS A NAMED HUMAN OWNER"
      - "AN OWNERLESS HUMAN-OWNED STATE IS STRUCTURALLY IMPOSSIBLE"
      - "AN UNBOUND OBSERVATION NEVER DISCHARGES"
      - "AN UNDISCHARGED EXPECTATION MAKES A FIELD unknown, NEVER consistent"
      - "expected_source NOT NULL: True"
      - "human-owned states require owner_id: True"
      - "owner is FK-backed into tenant_humans: True"

  - risk_category: unexpected_state_transition
    claim: >-
      The six canonical states are a database CHECK with no seventh — no `TIMED_OUT`, no `STALE`, no
      bare `RESOLVED` imported from M9, no `SUPERSEDED` — and the eight `EX-*` rows are the whole
      lifecycle. The from-sets are read literally: cancelling an `INDETERMINATE` Expectation is an
      illegal transition because `EX-6`'s from-set is `{RAISED, OVERDUE}`, and a `RAISED` Expectation
      never expires because `EX-7`'s is `{OVERDUE, INDETERMINATE}`. Expiry is explicit and never
      silent, and no sweep, reaper or scan closes an Expectation.
    checks:
      - "drive the Expectation machine through a brokerage narrative, and attack it"
      - "the six canonical expectation states are a database constraint, and there is no seventh"
      - "no sweep, reaper, deletion or unregistered expectation state was invented"
