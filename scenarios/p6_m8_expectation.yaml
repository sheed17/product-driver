      is a real freight event rather than an edge case. `deadline_utc` is UTC, `originating_timezone`
      is retained beside it, an appointment window crossing a DST boundary lands where the facility
      says it lands, and evaluating the window in UTC instead of facility-local is an illegal
      transition rather than an approximation.
