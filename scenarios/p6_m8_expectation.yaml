  # The three landed units M8 reads from and must not reach back into. M5 is the closest: EX-2 and
  # EX-4 READ its rows, so a binding that started requiring an Expectation would be M5 rewritten from
  # inside M8. M3 is the one whose §26.1 `AWAITING_OBSERVATION` outcome entity §39 points at, and M3
  # is tier-1 and landed. M7 is the one an overdue Expectation is NOT.
  - name: "M5's, M3's and M7's landed machines are not rewritten by M8"
    command: >-
      .venv/bin/python -c "import ast,pathlib;
      root=pathlib.Path('src/freight_recon');
      src=lambda n: (root / (n + '.py')).read_text(encoding='utf-8');
      imports=lambda n: {(x.module or '').split('.')[-1] for x in ast.walk(ast.parse(src(n)))
      if isinstance(x,ast.ImportFrom)} | {a.name.split('.')[-1] for x in ast.walk(ast.parse(src(n)))
      if isinstance(x,ast.Import) for a in x.names};
      print('landed machines scanned:',
      sorted(n for n in ('observation','external_effect','conflict') if (root / (n + '.py')).exists()));
