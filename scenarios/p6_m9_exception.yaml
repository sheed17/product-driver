  - risk_category: idempotency
    claim: >-
      `GR-4`'s consumer inbox is the mandatory idempotency mechanism: a redelivered `TimerFired` is
      a no-op, a redelivered raise is a no-op, and a timer that fires at least once still moves the
      machine exactly once. Duplicate pressure produces no second transition and no lost obligation.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "every exception index is tenant-first, and the optional dedup index is recorded not required"
    observations:
