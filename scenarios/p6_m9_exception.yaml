      - "severity vocabulary: 'SEV0', 'SEV1', 'SEV2'"
      - "'SEV0'"
      - "'SEV1'"
      - "'SEV2'"
      - "severity vocabulary is exactly three members: True"
      - "severity is never defaulted: True"

  # ### THE sub_status TRAP, MEASURED. The machine's header paragraph is the whole point: the brief's
  # finer terms (triage / assigned / investigating / awaiting-external / awaiting-human /
  # resolution-proposed) are FIELDS, and adding lifecycle states for them "would diverge from the
  # entity spec".
  #
  # sub_status is OPTIONAL (EC-1 writes `sub_status?`, F9 lists it as an optional payload field), so
  # this check does NOT require it to exist. What it requires is the property that holds either way:
  # ### none of those six names is a value of `state`. Building the column is a choice; promoting one
  # of its values to a lifecycle state is a defect, and it is a defect whether the column exists or
  # not.
  - name: "sub_status is a field if it exists at all, and never a lifecycle state"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys,re;
      sys.path.insert(0,'src');
      from freight_recon.schema import create_canonical_schema;
      p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3');
      c=sqlite3.connect(p); create_canonical_schema(c);
      row=c.execute(\"select sql from sqlite_master where name='exceptions'\").fetchone();
      ddl=re.sub(r'--.*', '', row[0]) if row else '';
      info=list(c.execute('pragma table_info(exceptions)'));
      cols={r[1] for r in info};
      m=re.search(r'state TEXT NOT NULL CHECK \\(state IN \\(([^)]*)\\)', ddl, re.S);
      states={t.strip().strip(chr(39)).upper() for t in m.group(1).split(',')} if m else set();
      FINER={'TRIAGE','ASSIGNED','INVESTIGATING','AWAITING_EXTERNAL','AWAITING-EXTERNAL',
      'AWAITING_HUMAN','AWAITING-HUMAN','RESOLUTION_PROPOSED','RESOLUTION-PROPOSED'};
      print('exceptions table present:', bool(row));
      print('lifecycle states declared:', sorted(states));
      print('sub_status implemented as a column:', 'sub_status' in cols);
      print('finer brief terms promoted to lifecycle states:', sorted(states & FINER));
      print('sub_status is never a lifecycle state:', not (states & FINER) and bool(states))"
    timeout_s: 300
    contains:
      - "exceptions table present: True"
      - "finer brief terms promoted to lifecycle states: []"
      - "sub_status is never a lifecycle state: True"

