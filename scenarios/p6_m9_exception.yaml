      mig=pathlib.Path('src/freight_recon/migrations/phase6_exceptions.py');
      migtext=mig.read_text(encoding='utf-8') if mig.exists() else '';
      print('machine and migration present:', bool(text) and bool(migtext));
      print('mints another machine event:',
      sorted(set(re.findall(r'\\bCompensationRequired\\b|\\bCompensationApproved\\b'
      r'|\\bCompensationCompleted\\b|\\bCompensationFailed\\b|\\bCompensationImpossible\\b'
      r'|\\bPolicyActivated\\b|\\bPolicyProposed\\b|\\bRuleActivated\\b|\\bRuleProposed\\b'
      r'|\\bBrakeEngaged\\b|\\bBrakeWidened\\b|\\bBrakeNarrowed\\b|\\bBrakeReleased\\b'
      r'|\\bOrphanAdapterInvocation\\b|\\bCrossTenantAccessAttempted\\b'
      r'|\\bProjectionRebuildDiverged\\b|\\bOwnerAssertedOverwriteAttempted\\b'
      r'|\\bProvenanceStrengtheningAttempted\\b', text))));
      print('writes another machine transition:',
      sorted(set(re.findall(r'\\b(?:CM|PO|RU|BR)-[0-9]+[a-z]?\\b', text))));
      print('engages a brake from inside M9:',
      sorted(set(re.findall(r'\\.engage\\w*\\(|engage_platform', text))));
      from freight_recon.schema import create_canonical_schema;
      p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3');
      c=sqlite3.connect(p); create_canonical_schema(c);
      tables={r[0] for r in c.execute(\"select name from sqlite_master where type='table'\")};
