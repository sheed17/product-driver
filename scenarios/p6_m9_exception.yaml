  # KEY into it (entity §18) and entity §16's ownership CHECK is unenforceable without a table to
  # point at. `event_outbox` is asserted because that is where M1's landed K-1 resolver RESOLVES a
  # decision_ref against — the canonical event log, not a second audit store.
  - name: "a freshly created canonical database carries the exception layer, tenant-first"
