      - "M9 consumes TimerFired: True"
      - "in-memory sleep in the machine: []"
      - "second timer table created by m9: []"

  - risk_category: stale_state
    claim: >-
      Replay rebuilds the verdict, not a new one. A full-history rebuild reconstructs the Exception
      and its CURRENT severity by folding the recorded `ExceptionSeverityChanged` events at the
      highest aggregate version — never by reading the live row, which is the difference between a
      rebuild that reproduces a Sev-0 and one that quietly reports the Sev-2 it was born as. An open
      Exception stays open, a frozen entity stays blocked, and replay mints no authority and can
      never manufacture a `decision_ref`.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "M9 uses the six registered F9 contracts and invents no seventh"
    observations:
