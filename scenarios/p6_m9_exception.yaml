  # `events/registry.md` is by its own header THE SOLE CANONICAL LIST, and
  # `event_contracts_data.json` is its mechanical projection — so a name outside the six is defective
  # by the registry's own definition, and `ExceptionSeverityChanged`'s FOUR required fields are the
  # rebuild guarantee expressed as a contract: without `previous_severity` a fold cannot tell a
  # missing link from a severity that never moved, and F9 says why that matters (a Sev-0 exception
  # auto-engages the brake at its source, so an under-stated severity is a safety loss). That guard
  # already exists in P5; M9 inherits it rather than inventing it.
  - name: "M9 uses the six registered F9 contracts and invents no seventh"
    command: >-
      .venv/bin/python -c "import json,pathlib,re;
      data=json.loads(pathlib.Path('src/freight_recon/event_contracts_data.json').read_text(encoding='utf-8'));
      rows=data.get('contracts') or [];
      byname={r['name']: r for r in rows} if isinstance(rows,list) else {};
      req=lambda n: sorted(f['name'] for f in (byname.get(n,{}).get('fields') or []) if f.get('required'));
      print('registered F9 contracts:', sorted(n for n,r in byname.items() if r.get('family')=='F9'));
      print('ExceptionRaised requires:', req('ExceptionRaised'));
      print('ExceptionResolved requires:', req('ExceptionResolved'));
      print('ExceptionSeverityChanged requires:', req('ExceptionSeverityChanged'));
      print('ExceptionAcknowledged requires:', req('ExceptionAcknowledged'));
      print('ExceptionResolved producers:',
      sorted(byname.get('ExceptionResolved',{}).get('producers') or []));
      print('ExceptionAgeing producers:',
      sorted(byname.get('ExceptionAgeing',{}).get('producers') or []));
      print('synonym events registered:', sorted(n for n in ('ExceptionCancelled','ExceptionExpired',
      'ExceptionClosed','ExceptionReopened','ExceptionAutoClosed','ExceptionTimedOut',
      'ExceptionSuperseded','ExceptionDismissed') if n in byname));
      src=pathlib.Path('src/freight_recon/exception.py');
      print('machine source:', 'present' if src.exists() else 'MISSING exception.py');
      text=src.read_text(encoding='utf-8') if src.exists() else '';
      used=sorted(set(re.findall(r'\\b(?:Exception|Expectation|Compensation)[A-Z][A-Za-z]*\\b', text)));
      print('Exception*/Expectation*/Compensation* names in the machine:', used);
      print('unregistered names in the machine:', [u for u in used if u not in byname])"
    timeout_s: 300
    contains:
      - "'ExceptionRaised'"
      - "'ExceptionAcknowledged'"
      - "'ExceptionAgeing'"
      - "'ExceptionEscalated'"
      - "'ExceptionSeverityChanged'"
      - "'ExceptionResolved'"
      - "ExceptionRaised requires: ['severity', 'source_ref']"
      - "ExceptionResolved requires: ['decision_ref']"
      - "ExceptionSeverityChanged requires: ['changed_by', 'previous_severity', 'reason', 'severity']"
      - "ExceptionResolved producers: ['EC-3', 'EC-6']"
      - "ExceptionAgeing producers: ['EC-4']"
      - "synonym events registered: []"
      - "machine source: present"
      - "unregistered names in the machine: []"

  # ### THE ONE K-1 RESOLVER, IMPORTED RATHER THAN REWRITTEN. `GR-14` and `AC-SAFE-024` require that
  # a decision_ref RESOLVE — to an `audit_events` human-decision row recording an authenticated human,
  # or to an ACTIVE rule_id. M1 already ships that resolver, M3 already imports it for EF-5, and M7
  # already uses its `DECISION_REF_KINDS`. A second implementation of "does this decision_ref
  # resolve" is two places for one of them to start accepting the string `done`, which is exactly
  # what K-1 exists to close — and `CLAUDE.md` rule 17 forbids a second authority in its own domain.
  #
  # Nothing here asserts WHICH of the two K-1 referents M9 accepts: that is `M9-AQ-1`, and the landed
  # resolver already refuses the RULE branch with a named reason while M12 is unbuilt (`P6-D4`,
  # closing at M12). What is asserted is that M9 uses THE resolver rather than a private one.
  - name: "the decision_ref resolver is M1's, imported rather than rewritten"
    command: >-
      .venv/bin/python -c "import ast,pathlib,re;
      src=pathlib.Path('src/freight_recon/exception.py');
      text=src.read_text(encoding='utf-8') if src.exists() else '';
      print('machine source:', 'present' if src.exists() else 'MISSING exception.py');
      tree=ast.parse(text) if text else ast.parse('');
      imported={a.name for n in ast.walk(tree) if isinstance(n,ast.ImportFrom)
      and (n.module or '').split('.')[-1]=='work_item' for a in n.names};
      print('names imported from M1:', sorted(imported));
      print('M9 imports the K-1 resolver:', 'resolve_decision_ref' in imported);
      print('M9 imports the K-1 kind vocabulary:', 'DECISION_REF_KINDS' in imported);
      print('a second resolver defined in the machine:',
      sorted(n.name for n in ast.walk(tree) if isinstance(n,ast.FunctionDef)
      and re.search(r'resolve.*decision|decision.*resolve', n.name, re.I)));
      others=sorted(f.name for f in pathlib.Path('src/freight_recon').rglob('*.py')
      if f.name!='work_item.py' and re.search(r'^def resolve_decision_ref', f.read_text(encoding='utf-8'), re.M));
      print('modules defining resolve_decision_ref outside M1:', others)"
    timeout_s: 300
    contains:
      - "machine source: present"
      - "M9 imports the K-1 resolver: True"
      - "a second resolver defined in the machine: []"
      - "modules defining resolve_decision_ref outside M1: []"

