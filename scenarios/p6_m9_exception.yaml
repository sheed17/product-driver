  # THE FIVE STATES, STRUCTURALLY. Not a convention, not a Python enum nobody enforces — a CHECK
  # constraint, so a sixth state and a misspelled fifth are both uninsertable. There is deliberately
  # no `CANCELLED` (registry §4 gives M9 five states, and M9-AQ-2 is not settled by minting one), no
  # `EXPIRED` (entity §26: it NEVER expires), no `TIMED_OUT`/`STALE`/`CLOSED`/`AUTO_CLOSED`/
  # `DISMISSED` (each of them a mechanism for forgetting), no `REOPENED` (§27: a recurrence is a new
  # Exception) and no `SUPERSEDED` (§24: N/A).
