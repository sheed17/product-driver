  # M9's product form is an operational exception queue with owners, notifications and an MTTR
  # dashboard — the registry says so in terms. That surface is precisely the thing that must not
  # arrive with the engine primitive (task §3.6), and neither may an alerting or paging integration:
  # an Exception that pages someone is an alert, and an alert is the thing entity §4 says this is not.
  - name: "no oversight queue, alerting, notification or paging surface ships with M9"
    command: >-
      .venv/bin/python -c "import ast,pathlib;
      root=pathlib.Path('src/freight_recon');
      CHANNELS={'ingestion','email_adapter','imap_mailbox','email_corpus','email_triage',
      'inbox_brain','inbox_discovery','extraction','extraction_bridge','browser_use_adapter',
      'browser_use_write','cdp_readonly','cdp_session','cdp_actuator','tms_adapter','tms_write',
      'slack_adapter','slack_delegate','channels','alert_channel','action_callback','ops_control',
      'follow_up','mailbox_intake','delivery','delivery_dispatch','operator_console','review',
      'review_actions','thread_reply','summary','render'};
      mods=lambda tree: {(n.module or '').split('.')[-1] for n in ast.walk(tree)
      if isinstance(n,ast.ImportFrom)} | {a.name.split('.')[-1] for n in ast.walk(tree)
      if isinstance(n,ast.Import) for a in n.names};
      seen=[(f.name, mods(ast.parse(f.read_text(encoding='utf-8'))), f.read_text(encoding='utf-8'))
      for f in root.rglob('*.py')];
      print('modules scanned for a channel join:', len(seen));
      print('modules joining the exception machine to a channel:',
      sorted(name for name,m,src in seen if 'exception' in m and (m & CHANNELS)));
      print('notification or paging surfaces built for exceptions:',
      sorted(name for name,m,src in seen if 'exception' in m
      and ('def notify' in src or 'def page' in src or 'def alert' in src or 'def send' in src)))"
