      ddl=re.sub(r'--.*', '', row[0]) if row else '';
      info=list(c.execute('pragma table_info(exceptions)'));
      dflt={r[1]: r[4] for r in info};
      m=re.search(r'\\bseverity\\b[^,]*?\\bIN\\s*\\(([^)]*)\\)', ddl, re.I);
      vocab=re.findall('\\x27([A-Z0-9_]+)\\x27', m.group(1)) if m else [];
      print('severity vocabulary is enforced by a CHECK:', bool(m));
      print('severity vocabulary:', ', '.join(repr(v) for v in vocab));
      print('severity vocabulary is exactly three members:', vocab == ['SEV0','SEV1','SEV2']);
      print('severity is never defaulted:', dflt.get('severity') is None and bool(info))"
    timeout_s: 300
    contains:
