  - risk_category: malformed_input
    claim: >-
      A malformed exception, an unresolvable `decision_ref`, an invented severity and an invented
      source kind all fail closed rather than becoming half-written rows or authority. An invented
      fault name is refused with a non-zero exit and a readable message; so are a reopen fault, a
      correction fault and a supersession fault, because entity §27, §23 and §24 each say `N/A` and
      a probe that accepted one would be producing passing evidence for a transition that does not
      exist.
