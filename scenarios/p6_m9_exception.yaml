  - risk_category: retry_safety
    claim: >-
      A PERMANENT failure — authentication, authorization, configuration, protocol — raises an
      Exception IMMEDIATELY with ZERO retries, and a transient failure is not a permanent
      classification. The classification is SUPPLIED as an enumerated value and never inferred from
      an error message, a status code or model output: a permanent credential failure retried
      forever is a system hiding a fixable problem from the only person who can fix it.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "the M9 probe exposes a bounded, closed dimension vocabulary to vary cases with"
    observations:
