  # EC-4 and EC-5 are the ONLY transitions that may move an Exception without a human, and machine
  # §37 makes them durable timers and nothing else — "never a resolution timer", and `M-36`: "never a
  # background sweep, never a scan for things that look old". A second timer table, an in-memory
  # sleep or a periodic scan is not a style choice: it is the mechanism by which an obligation stops
  # being durable, and it is exactly the shape "the queue got tidy" arrives in.
  - name: "ageing and escalation ride P5's existing durable timers rather than a second timer mechanism"
    command: >-
      .venv/bin/python -c "import pathlib,sqlite3,tempfile,os,sys,re;
      sys.path.insert(0,'src');
      m=pathlib.Path('src/freight_recon/exception.py');
      g=pathlib.Path('src/freight_recon/migrations/phase6_exceptions.py');
      src=m.read_text(encoding='utf-8') if m.exists() else '';
      mig=g.read_text(encoding='utf-8') if g.exists() else '';
      print('machine source:', 'present' if m.exists() else 'MISSING');
      print('M9 schedules through DurableTimers:', 'DurableTimers' in src);
      print('M9 consumes TimerFired:', 'TimerFired' in src);
      sleeps=sorted({t for t in ('time.sleep','asyncio.sleep','threading.Timer','sched.scheduler')
      if t in src});
      print('in-memory sleep in the machine:', sleeps);
      second=sorted(set(re.findall(r'CREATE TABLE (\\w*timer\\w*)', mig, re.I)));
      print('second timer table created by m9:', second);
      from freight_recon.schema import create_canonical_schema;
      p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3');
      c=sqlite3.connect(p); create_canonical_schema(c);
      print('timer tables in the canonical schema:',
      sorted(r[0] for r in c.execute(\"select name from sqlite_master where type='table'
      and name like '%timer%'\")))"
    timeout_s: 300
    contains:
      - "machine source: present"
      - "M9 schedules through DurableTimers: True"
      - "M9 consumes TimerFired: True"
      - "in-memory sleep in the machine: []"
      - "second timer table created by m9: []"
      - "timer tables in the canonical schema: ['durable_timers']"

  # The five landed units whose human-owned states point AT M9, and which M9 must not reach back
  # into. M1 is the closest and the most dangerous: M9 IMPORTS its K-1 resolver and its
  # `tenant_humans` FK, so a change that made M1's resolver more permissive to suit M9 would be M1
  # rewritten from inside M9 — and `WI-6`'s trigger set is where "an exception blocks a Work Item"
  # would be quietly added (`M9-AQ-5`). M3 is the single effect authority. M5, M7 and M8 each
  # deferred a "→ Exception" seam here by name, and wiring one from this side means editing theirs.
  - name: "M1's, M3's, M5's, M7's and M8's landed machines are not rewritten by M9"
    command: >-
      .venv/bin/python -c "import ast,pathlib;
      root=pathlib.Path('src/freight_recon');
      names=('work_item','external_effect','observation','conflict','expectation','approval',
      'identity_binding_claim');
      read=lambda n: (root / (n + '.py')).read_text(encoding='utf-8');
      imports=lambda n: {(x.module or '').split('.')[-1] for x in ast.walk(ast.parse(read(n)))
      if isinstance(x,ast.ImportFrom)} | {a.name.split('.')[-1] for x in ast.walk(ast.parse(read(n)))
      if isinstance(x,ast.Import) for a in x.names};
      present=sorted(n for n in names if (root / (n + '.py')).exists());
      print('landed machines scanned:', present);
      print('landed machines importing exception:',
      sorted(n for n in present if 'exception' in imports(n)));
      print('work_item.py imports exception:', 'exception' in imports('work_item'));
      print('external_effect.py imports exception:', 'exception' in imports('external_effect'));
      print('observation.py imports exception:', 'exception' in imports('observation'));
      print('conflict.py imports exception:', 'exception' in imports('conflict'));
      print('expectation.py imports exception:', 'exception' in imports('expectation'));
      print('M1 still owns the K-1 resolver:', 'def resolve_decision_ref' in read('work_item'));
      print('M3 UNKNOWN_OUTCOME semantics present:', 'UNKNOWN_OUTCOME' in read('external_effect'));
      print('M8 OVERDUE/INDETERMINATE semantics present:',
      'INDETERMINATE' in read('expectation') and 'OVERDUE' in read('expectation'))"
    timeout_s: 300
    contains:
      - "landed machines importing exception: []"
      - "work_item.py imports exception: False"
      - "external_effect.py imports exception: False"
      - "observation.py imports exception: False"
      - "conflict.py imports exception: False"
      - "expectation.py imports exception: False"
      - "M1 still owns the K-1 resolver: True"
      - "M3 UNKNOWN_OUTCOME semantics present: True"
      - "M8 OVERDUE/INDETERMINATE semantics present: True"

# ---------------------------------------------------------------------------
# The declared risk coverage. Every claim names the checks that can actually EMIT the observations it
# requires — a claim naming commands that cannot produce its literal fails closed forever, on every
# run, no matter how correct the product is, and it fails wearing the costume of a product defect.
# ---------------------------------------------------------------------------
verifies:
  - risk_category: safety_invariant
    claim: >-
      An Exception is never closed by silence. Closure requires a `decision_ref` that RESOLVES — a
      database CHECK plus `K-1`'s resolver, not a non-null test — and inactivity, `AutoClose`,
      expiry, a sweep, a reaper and a timer are each incapable of closing one. A timer may AGE or
      ESCALATE and never resolves. An exception closed without a decision is not closed; it is
      forgotten.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "an owner is required from creation and RESOLVED requires a decision_ref, as CHECKs"
      - "the live database refuses an ownerless exception and a resolution with no decision_ref"
      - "no expiry, sweep, reaper, auto-close or deletion was invented"
      - "the decision_ref resolver is M1's, imported rather than rewritten"
    observations:
      - "AN EXCEPTION CLOSED WITHOUT A DECISION IS NOT CLOSED, IT IS FORGOTTEN"
      - "CLOSURE WITHOUT A decision_ref IS STRUCTURALLY IMPOSSIBLE"
      - "RESOLUTION REQUIRES A decision_ref THAT RESOLVES"
      - "INACTIVITY NEVER CLOSES AN EXCEPTION"
      - "AUTOCLOSE IS AN ILLEGAL TRANSITION"
      - "AN EXCEPTION NEVER EXPIRES AND CANNOT BE OUTLIVED"
      - "NO SWEEP, REAPER OR SCAN CLOSES AN EXCEPTION"
      - "A TIMER MAY AGE OR ESCALATE; A TIMER NEVER RESOLVES"
      - "RESOLVED requires decision_ref: True"
      - "RESOLVED with no decision_ref: refused"
      - "invented sweep/reaper/autoclose surfaces: []"
      - "M9 imports the K-1 resolver: True"

  - risk_category: authorization
    claim: >-
      Only an authenticated human may acknowledge or resolve an Exception, and a model may never
      own, acknowledge, resolve, auto-clear or re-severity one at any confidence. A `decision_ref`
      recorded by automation is authority laundering and is refused. An Exception OWES a human's
      attention rather than authorizing anything: `checkpoint.py` remains the only thing that mints
      a gate decision, M3 remains the single effect authority, and M9 engages no brake.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "the checkpoint is still the only thing that mints a gate decision"
      - "the compensation, policy, rule and brake seams are fed without M10, M11, M12 or M13 being built"
      - "the owner and every human named on the row are FOREIGN KEYS into tenant_humans"
    observations:
      - "AN AUTHENTICATED HUMAN ACKNOWLEDGES AN EXCEPTION"
      - "A MODEL CAN NEVER ACKNOWLEDGE AN EXCEPTION"
      - "A MODEL CAN NEVER RESOLVE OR AUTO-CLEAR AN EXCEPTION"
      - "A MODEL CAN NEVER CHANGE SEVERITY"
      - "A MODEL IS NOT A HUMAN AND MAY NOT OWN AN EXCEPTION"
      - "A decision_ref RECORDED BY AUTOMATION IS NOT A HUMAN DECISION"
      - "M9 MINTS NO GATE DECISION"
      - "AN EXCEPTION IS AN INPUT TO THE CHECKPOINT AND NEVER A GATE"
      - "M9 ENGAGES NO BRAKE AND NARROWS NONE"
      - "modules that MINT a gate decision: ['checkpoint.py']"
      - "engages a brake from inside M9: []"
      - "every human-named column is FK-backed: True"

  - risk_category: missing_data
    claim: >-
      A required basis that is absent fails closed rather than being assumed. An Exception cannot be
      raised without a named human owner, a severity or a source; an ownerless Exception is
      structurally impossible at the database boundary; a `decision_ref` that references nothing is
      not a `decision_ref`; and a severity change without its previous value or its reason is
      refused, because a rebuild that cannot see what the severity moved from can under-state the
      live one.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "an owner is required from creation and RESOLVED requires a decision_ref, as CHECKs"
      - "the live database refuses an ownerless exception and a resolution with no decision_ref"
      - "the owner and every human named on the row are FOREIGN KEYS into tenant_humans"
      - "M9 uses the six registered F9 contracts and invents no seventh"
    observations:
      - "AN EXCEPTION HAS A NAMED HUMAN OWNER FROM CREATION"
      - "AN OWNERLESS EXCEPTION IS STRUCTURALLY IMPOSSIBLE"
      - "THE OWNER IS AN ACTIVE HUMAN OF THIS TENANT"
      - "THE RAISE RECORDS ITS SEVERITY AND THE SOURCE THAT RAISED IT"
      - "A decision_ref THAT REFERENCES NOTHING IS NOT A decision_ref"
      - "A SEVERITY CHANGE REQUIRES A REASON"
      - "owner_id NOT NULL: True"
      - "an ownerless exception: refused"
      - "an owner who is not a recorded human: refused"
      - "owner is FK-backed into tenant_humans: True"
      - "ExceptionSeverityChanged requires: ['changed_by', 'previous_severity', 'reason', 'severity']"

  - risk_category: unexpected_state_transition
    claim: >-
      The five canonical states are a database CHECK with no sixth — no `CANCELLED`, no `EXPIRED`,
      no `TIMED_OUT`, no `STALE`, no `CLOSED` — and the seven `EC-*` rows are the whole lifecycle.
      The brief's finer terms are `sub_status` FIELDS and never lifecycle states. The from-sets are
      read literally: resolving an `AGEING` Exception is illegal because `EC-3`'s from-set is
      `{OPEN, ACKNOWLEDGED}` and `EC-6`'s is `{ESCALATED}`; nothing at all moves a `RESOLVED` one;
      and a severity change is a field mutation rather than a state.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "the five canonical exception states are a database constraint, and there is no sixth"
      - "sub_status is a field if it exists at all, and never a lifecycle state"
      - "the live database refuses an ownerless exception and a resolution with no decision_ref"
      - "no expiry, sweep, reaper, auto-close or deletion was invented"
    observations:
      - "THE FIVE CANONICAL STATES ARE THE WHOLE LIFECYCLE"
      - "sub_status IS A FIELD, NEVER A LIFECYCLE STATE"
      - "THERE IS NO CANCELLED, EXPIRED OR TIMED_OUT STATE"
      - "RESOLVING FROM AGEING IS AN ILLEGAL TRANSITION"
      - "RESOLVED IS THE ONLY TERMINAL STATE"
      - "NOTHING MOVES A RESOLVED EXCEPTION"
      - "A SEVERITY CHANGE IS A FIELD MUTATION, NOT A LIFECYCLE STATE"
      - "AN ILLEGAL TRANSITION PERSISTS NOTHING AND IS RECORDED"
      - "finer brief terms promoted to lifecycle states: []"
      - "a CANCELLED lifecycle state: refused"
      - "unregistered exception states in the migration: []"

  - risk_category: boundary
    claim: >-
      Severity is a closed three-member vocabulary — `SEV0`, `SEV1`, `SEV2` — enforced by a CHECK
      and never defaulted, because a defaulted severity is a safety statement nobody made and a
      Sev-0 auto-engages a brake at its source. The ageing and escalation thresholds are
      caller-supplied with no business default: `V10` is an open validation item and choosing a
      number for it would be inventing a customer's operating policy.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "severity is a closed three-member vocabulary, enforced and never defaulted"
      - "the live database refuses an ownerless exception and a resolution with no decision_ref"
      - "the M9 probe exposes a bounded, closed dimension vocabulary to vary cases with"
    observations:
      - "SEVERITY IS SEV0, SEV1 OR SEV2 AND NOTHING ELSE"
      - "THE AGEING THRESHOLD IS CALLER-SUPPLIED, NOT A BUSINESS DEFAULT"
      - "A SEV0 EXCEPTION ENGAGES NO BRAKE FROM INSIDE M9"
      - "severity vocabulary is exactly three members: True"
      - "severity is never defaulted: True"
      - "an invented SEV3 severity: refused"
      - "--severity"
      - "invented-severity"

  - risk_category: concurrency
    claim: >-
      A lost update on an Exception is refused: every mutation carries an optimistic version check,
      a stale expected version writes zero rows and raises rather than silently overwriting, and
      concurrent raisers are serialized by the database rather than by an application-level
      check-then-insert. Every index on the table is tenant-first, and the open-exception dedup index
      is recorded as the OPTIONAL constraint three authorities call it rather than asserted as a
      requirement.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "every exception index is tenant-first, and the optional dedup index is recorded not required"
    observations:
      - "A LOST UPDATE ON AN EXCEPTION IS REFUSED"
      - "A STALE VERSION NEVER OVERWRITES NEWER STATE"
      - "THE OPEN-EXCEPTION DEDUP INDEX IS OPTIONAL, AND THIS BUILD RECORDS ITS CHOICE"
      - "every index is tenant-first: True"
      - "dedup index, if built, is partial on RESOLVED: True"

  - risk_category: cross_tenant
    claim: >-
      The same source in two tenants are two isolated Exceptions, and no Exception is owned,
      resolved, sourced or READ across a tenant boundary. A cross-tenant owner, a cross-tenant
      source, a cross-tenant `decision_ref` and a cross-tenant queue read each fail closed. Tenant is
      the first partition dimension — in the primary key, in every index, in the foreign keys and in
      every query — and the owner queue is the surface that makes it concrete: "show me the open
      exceptions" must never return another brokerage's.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "a freshly created canonical database carries the exception layer, tenant-first"
      - "every exception index is tenant-first, and the optional dedup index is recorded not required"
