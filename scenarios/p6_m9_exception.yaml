  # ### AND NO PROMOTED sub_status. The machine's own header says the brief's finer terms are FIELDS,
  # not lifecycle states — so `TRIAGE`, `ASSIGNED`, `INVESTIGATING`, `AWAITING_EXTERNAL`,
  # `RESOLUTION_PROPOSED` and above all `AWAITING_HUMAN` (which is M1's REGISTERED state, and
  # registry's binding header forbids a local synonym) are each a sixth state arriving under a
  # reasonable-sounding name.
