      - "permanent-auth-failure"
      - "permanent-config-failure"
      - "inferred-permanence"
      - "retry-permanent"

  - risk_category: persistence_failure
    claim: >-
      Where the source condition materially freezes work, the Exception row, the freeze and the
      emitted event are ONE commit — a persistence failure rolls the whole decision back and leaves
      no half-raised exception, no event without its state and no state without its event. And NOT
      every Exception freezes an entity: the materiality condition is stated and recorded rather
      than assumed, because an engine that froze everything it could not resolve would stop the
      brokerage rather than help it.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "an owner is required from creation and RESOLVED requires a decision_ref, as CHECKs"
    observations:
