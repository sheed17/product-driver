      sql=re.sub(r'--.*', '', row[0]) if row else '';
      m=re.search(r'state TEXT NOT NULL CHECK \\(state IN \\(([^)]*)\\)', sql, re.S) if sql else None;
      print('exception state vocabulary:', sorted(t.strip().strip(chr(39)) for t in m.group(1).split(','))
      if m else 'MISSING: the exceptions table declares no CHECK on state')"
