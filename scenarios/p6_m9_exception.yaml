  # ### THE INVARIANTS ATTEMPTED AGAINST A LIVE DATABASE, NOT READ OUT OF ITS DDL. The check above
  # reads text; this one ISSUES the forbidden writes and records that the engine refuses them, with a
  # positive control first so a refusal cannot be an artefact of a table that rejects everything.
  # `P6-D56` recorded "the migration invariants verified by READING the DDL rather than introspecting
  # a live database" as the M8 run's one weaker instrument. This is that instrument, repaired.
  # ### THE INVARIANTS ATTEMPTED AGAINST A LIVE DATABASE, NOT READ OUT OF ITS DDL. The check above
  # reads text; this one ISSUES the forbidden writes and records that the engine refuses them.
  #
  # ### THE POSITIVE CONTROL IS THE POINT, AND IT IS DERIVED RATHER THAN HARD-CODED. A row that the
  # database refuses for some unrelated reason would make every "refused" line below true of a table
  # that rejects everything, which is a vacuous negative corpus wearing the costume of enforcement.
  # So the well-formed row is BUILT FROM THE SHIPPED DDL — every NOT NULL column takes its own
  # DEFAULT if it has one, else the first member of its own CHECK vocabulary, else a placeholder —
  # and it must be ACCEPTED before any refusal below counts. `rows that survived: 1` is that proof
  # restated as a count: exactly the positive control persisted, and not one forbidden row did.
  #
  # `P6-D56` recorded "the migration invariants verified by READING the DDL rather than introspecting
  # a live database" as the M8 run's one weaker instrument. This is that instrument, repaired.
  - name: "the live database refuses an ownerless exception and a resolution with no decision_ref"
    command: >-
      .venv/bin/python -c "import sqlite3,tempfile,os,sys,re;
      sys.path.insert(0,'src');
      from freight_recon.schema import create_canonical_schema, enable_and_verify_foreign_keys;
      p=os.path.join(tempfile.mkdtemp(),'probe.sqlite3');
      c=sqlite3.connect(p); create_canonical_schema(c); enable_and_verify_foreign_keys(c);
      row=c.execute(\"select sql from sqlite_master where name='exceptions'\").fetchone();
      ddl=re.sub(r'--.*', '', row[0]) if row else '';
      opts=dict(re.findall(r'\\b(\\w+)\\b[^,\\n]*?\\bIN\\s*\\(([^)]*)\\)', ddl));
      first=lambda col: (re.findall(chr(39) + '([^' + chr(39) + ']*)' + chr(39), opts[col])
      or [None])[0] if col in opts else None;
      info=list(c.execute('pragma table_info(exceptions)'));
      cols=[r[1] for r in info];
      pick=lambda name,ty,dflt: (str(dflt).strip(chr(39)) if dflt is not None
      else (first(name) if first(name) is not None
      else (1 if 'INT' in (ty or '').upper() else 'x')));
      base=dict([(r[1], pick(r[1], r[2], r[4])) for r in info if r[3]]);
      c.execute('insert into tenant_humans (tenant,human_id,display_name,authority_role,state,
      recorded_at,recorded_by,recorded_by_kind) values (?,?,?,?,?,?,?,?)',
      ('T_A','dispatch-lead','Dispatch Lead','AUTHORIZED_HUMAN','ACTIVE','2026-08-29T00:00:00Z',
      'founder','human'));
      known={'tenant':'T_A','owner_id':'dispatch-lead','state':'OPEN','severity':'SEV1',
      'version':1,'created_at':'2026-08-29T00:00:00Z','updated_at':'2026-08-29T00:00:00Z',
      'exception_id':'exc-1'};
      base.update(dict([(k,v) for k,v in known.items() if k in base]));
      env={'c':c,'sqlite3':sqlite3};
      exec('def attempt(label, d):\n try:\n  c.execute(\'savepoint s\'); c.execute(\'insert into exceptions (\' + \',\'.join(d) + \') values (\' + \',\'.join([\'?\']*len(d)) + \')\', list(d.values())); c.execute(\'release s\'); print(label + \': ACCEPTED\')\n except sqlite3.Error as exc:\n  c.execute(\'rollback to s\'); c.execute(\'release s\'); print(label + \': refused (\' + type(exc).__name__ + \')\')', env);
      attempt=env['attempt'];
      variants=[('positive control, a well-formed OPEN exception', {}),
      ('an ownerless exception', {'exception_id':'exc-2','owner_id':None}),
      ('an owner who is not a recorded human', {'exception_id':'exc-3','owner_id':'someone-else'}),
      ('an owner from another tenant', {'exception_id':'exc-4','tenant':'T_B'}),
      ('RESOLVED with no decision_ref', {'exception_id':'exc-5','state':'RESOLVED',
      'decision_ref':None,'decision_ref_kind':'AUDIT_EVENT','decision_human_id':'dispatch-lead'}),
      ('second positive control, RESOLVED WITH a decision_ref', {'exception_id':'exc-5b',
      'state':'RESOLVED','decision_ref':'evt-1','decision_ref_kind':'AUDIT_EVENT',
      'decision_human_id':'dispatch-lead'}),
      ('a CANCELLED lifecycle state', {'exception_id':'exc-6','state':'CANCELLED'}),
      ('an EXPIRED lifecycle state', {'exception_id':'exc-7','state':'EXPIRED'}),
      ('an invented SEV3 severity', {'exception_id':'exc-8','severity':'SEV3'})];
      print('exceptions table present:', bool(cols));
      print('the derived positive-control row:', sorted(base.items()));
      [attempt(label, dict(list(base.items()) + [(k,v) for k,v in over.items() if k in cols]))
      for label, over in (variants if cols else [])];
      print('rows that survived:',
      c.execute('select count(*) from exceptions').fetchone()[0] if cols else 'n/a')"
    timeout_s: 300
    contains:
      - "exceptions table present: True"
      - "positive control, a well-formed OPEN exception: ACCEPTED"
      - "an ownerless exception: refused"
      - "an owner who is not a recorded human: refused"
      - "an owner from another tenant: refused"
      - "RESOLVED with no decision_ref: refused"
      - "a CANCELLED lifecycle state: refused"
      - "an EXPIRED lifecycle state: refused"
      - "an invented SEV3 severity: refused"
      - "second positive control, RESOLVED WITH a decision_ref: ACCEPTED"
      - "rows that survived: 2"

  # ### SEVERITY IS A CLOSED THREE-MEMBER VOCABULARY, AND IT IS NEVER DEFAULTED. Entity §12:
  # `severity ∈ {SEV0, SEV1, SEV2}`. Three members, and no fourth — no `SEV3`, no `CRITICAL`, no
  # `HIGH`/`MEDIUM`/`LOW`, no `INFO`, no `WARNING`. A DEFAULT would be worse than a missing CHECK: it
  # is the mechanism by which "nobody said how bad this is" silently becomes a value, and since a
  # Sev-0 auto-engages a brake at its source, a defaulted severity is a safety statement nobody made.
  #
  # The values print in the order the CHECK DECLARES them, so the printed line is itself evidence of
  # derivation rather than of an echo.
  - name: "severity is a closed three-member vocabulary, enforced and never defaulted"
    command: >-
