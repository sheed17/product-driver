  # 3. THE FOUR NEGATIVE CONTROLS. A vocabulary that accepts anything is fuzzing in a costume, and
  #    three of these four hold a canonical "N/A" open rather than letting a probe answer it.
  - name: "an invented fault is refused, so the vocabulary is genuinely closed"
    run: ".venv/bin/python scripts/probe_phase6_exception.py --inject not-a-real-fault"
    expect_exit_code: 2
    timeout_s: 120
    expect_contains:
      - "unknown fault"

  # Entity §27 and machine §24: "Reopening rules. N/A (a recurrence is a new Exception)." A probe that
  # ACCEPTED a reopen fault would be producing passing evidence for a transition the corpus states
  # does not exist — the same shape as M4's refused `unfreeze`, M5's refused `expire-observation`,
  # M6's refused `expire-claim`, M7's refused `expire-conflict` and M8's refused `reopen-expectation`.
  - name: "a reopen fault does not exist, because a recurrence is a new Exception"
    run: ".venv/bin/python scripts/probe_phase6_exception.py --inject reopen-exception"
    expect_exit_code: 2
    timeout_s: 120
    expect_contains:
      - "unknown fault"

  # Entity §23 and machine §25: "Correction rules. N/A." Correction is the tidy-looking thing a build
  # session adds, and it would let a wrong severity or a wrong owner be edited out of history rather
  # than carried through EC-7's event or resolved through EC-3/EC-6.
  - name: "a correction fault does not exist, because correction is N/A for an exception"
    run: ".venv/bin/python scripts/probe_phase6_exception.py --inject correct-exception"
    expect_exit_code: 2
    timeout_s: 120
    expect_contains:
      - "unknown fault"

  # Entity §24 and machine §26: "Supersession rules. N/A." Registry §4 gives M9 no `SUPERSEDED` state
  # and no `ExceptionSuperseded` event is registered anywhere — so accepting the fault would mint both
  # by implication.
  - name: "a supersession fault does not exist, because supersession is N/A for an exception"
    run: ".venv/bin/python scripts/probe_phase6_exception.py --inject supersede-exception"
    expect_exit_code: 2
    timeout_s: 120
    expect_contains:
      - "unknown fault"

  # 4. DETERMINISTIC OPERATION. The probe run whole: every case, its own temporary database per case,
  #    and a narration that says what it saw rather than what it intended.
  - name: "drive the Exception machine through a brokerage narrative, and attack it"
    run: ".venv/bin/python scripts/probe_phase6_exception.py"
    expect_exit_code: 0
    timeout_s: 1800

  # 5. Tests are a signal, never the basis for acceptance.
  - name: "the M9 acceptance and hostile battery"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase6_exception.py"
    expect_exit_code: 0
    timeout_s: 900

  # 6. REGRESSION ANCHORS. M9 adds a table and edits `schema.py`, so every layer that reads a
  #    canonical database can be broken from inside M9. Each is re-run rather than assumed.
  - name: "the P3 checkpoint kernel M9 must not disturb, unbroken"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase3_witness.py eval/tests/test_phase3_claim_cas.py eval/tests/test_phase3_step_order.py eval/tests/test_phase3_brake.py eval/tests/test_phase3_fingerprint.py eval/tests/test_phase3_checkpoint_matrix.py eval/tests/test_phase3_schema.py"
    expect_exit_code: 0
    timeout_s: 900

  - name: "the P4 governed effect boundary M9 must not widen, unbroken"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_import_gate.py eval/tests/test_adapter_boundary_acceptance.py eval/tests/test_p4_governed_write_route.py eval/tests/test_no_mock_effect_in_production.py"
    expect_exit_code: 0
    timeout_s: 900

  # EC-4 and EC-5 are both `T`-triggered and they are the only thing that may move an Exception
  # without a human, so P5's timer substrate is where "it ages and escalates rather than being swept
  # away" actually lives. A builder that invents a sweep leaves this suite untouched and is caught by
  # the DDL/source sweep further down; a builder that BREAKS the substrate is caught here. M9 also
  # emits six already-registered F9 names and mints none of its own, so the canonical event-contract
  # guard is load-bearing rather than incidental.
  - name: "the P5 transport, replay, durable timers and canonical event contracts M9 rides, unbroken"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase5_event_transport.py eval/tests/test_p5_replay_and_audit.py eval/tests/test_p5_durable_timers.py eval/tests/test_p5_event_contracts.py eval/tests/test_p5_canonical_event_mint.py"
    expect_exit_code: 0
    timeout_s: 900

  - name: "M1, M2, M3, M4, M5, M6, M7 and M8, whose schema M9 extends, unbroken"
    run: ".venv/bin/python -m pytest -q -p no:cacheprovider eval/tests/test_phase6_work_item.py eval/tests/test_phase6_pipeline_instance.py eval/tests/test_phase6_external_effect.py eval/tests/test_phase6_approval.py eval/tests/test_phase6_observation.py eval/tests/test_phase6_identity_binding_claim.py eval/tests/test_phase6_conflict.py eval/tests/test_phase6_expectation.py"
    expect_exit_code: 0
    timeout_s: 1800

  # 7. The neighbouring units' OWN deterministic probes, re-run. "M9 broke nothing" is a claim about
  #    THEIR behaviour, so it is measured against THEIR oracles rather than against M9's account of
  #    it. M8's matters most here: it is the most recent landing, its OVERDUE/INDETERMINATE/EXPIRED
  #    rows are three of the five seams that point at M9, and it is the unit a builder is likeliest
  #    to reach into in order to "wire up" the exception seam from the wrong side.
  - name: "M8 still behaves as specified with M9's table in the schema"
    run: ".venv/bin/python scripts/probe_phase6_expectation.py"
    expect_exit_code: 0
    timeout_s: 1800

  - name: "M7 still behaves as specified with M9's table in the schema"
    run: ".venv/bin/python scripts/probe_phase6_conflict.py"
    expect_exit_code: 0
    timeout_s: 1800

  - name: "M5 still behaves as specified with M9's table in the schema"
    run: ".venv/bin/python scripts/probe_phase6_observation.py"
    expect_exit_code: 0
    timeout_s: 1800

  # M6's probe is deliberately NOT re-run, and the absence is reasoned rather than an omission. M9
  # has no read of an identity binding at all — machine §33's consumed set is Acknowledged/Resolved/
  # TimerFired — so the only way M9 can reach M6 is by editing the canonical schema they share, and
  # that is exactly what the M1..M8 pytest anchor above measures. M5's, M7's and M8's probes ARE
  # re-run because their machines carry the "→ Exception" seams M9 is the other half of, which is the
  # one relationship a builder is tempted to close from the wrong side.

  # 8. Every guard proven capable of failing, against a reintroduced defect.
  - name: "the M9 mutation battery"
    run: ".venv/bin/python scripts/mutate_phase6_exception.py"
    expect_exit_code: 0
    timeout_s: 3600

requests: []

# ---------------------------------------------------------------------------
# Persisted state is the oracle. A probe that prints "an exception is never closed by silence"
# proves nothing about a table.
#
# Every check below reads the DATABASE or the SOURCE TREE, not the probe's narration. That is the
# point for this unit above all others: "RESOLVED requires a decision_ref", "an ownerless exception
# is impossible", "there are five states and no sixth" and "severity is exactly three values" are
# each a property of the SCHEMA, and every one of them is a sentence a fully green test suite can
# state while the database enforces none of them.
# ---------------------------------------------------------------------------
expect_state:
  # Built the way production builds it: `create_canonical_schema` is DDL, and it is
  # `enable_and_verify_foreign_keys` — issued OUTSIDE a transaction and read back, because SQLite
  # silently ignores the pragma inside one — that makes every tenant-consistent foreign key more than
  # decoration. A probe that skips it measures a database no caller ever gets.
  #
