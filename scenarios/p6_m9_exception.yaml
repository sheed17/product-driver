# P6 / M9 — Exception.
#
# THIS FILE IS THE PERMANENT BASE, NOT THE SUITE. It gives the dynamic scenario generator five
# things and nothing more:
#
#   1. deterministic basic M9 operation           (the probe, run whole)
#   2. a safe approved M9 command vocabulary      (`probe --case <case>`, argument tails only)
#   3. a bounded MUTATION AXIS to vary cases along (`--inject`, `--actor`, `--decision-ref`, …)
#   4. persisted-state oracles                    (`expect_state`, below)
#   5. focused regression anchors                 (P3 / P4 / P5 / M1 / M2 / M3 / M4 / M5 / M6 / M7 / M8)
#
# Breadth is the generator's job. Stage 1 draws risk-driven cases from the task, the registry and
# the acceptance criteria; stage 2 refines them against the diff the builder actually produced;
# stage 3 grows neighbours around whatever failed. None of that can author shell — a generated case
# may only CHOOSE one of the approved commands below, optionally with an argument tail, and decide
# when it runs and what must be observable afterwards.
#
# WHY THE MUTATION AXIS IS NOT OPTIONAL HERE, for the same reason it was not optional for M3, M4,
# M5, M6, M7 and M8. M9 ships dark: no oversight queue, no dashboard, no notifier, no HTTP surface.
# The executor's only concurrency primitive is `parallel_requests`, which is HTTP — so for this unit
# the generator has NO way to compose ordering, concurrency, timing, duplication, crash or replay
# variation from the outside. The axis is a closed, bounded, argument-only vocabulary; the approval
# boundary is unchanged, because a prefix match already permits argument tails and already refuses
# shell. See docs/SCENARIO-SPACE.md gap G2.
#
# THE TWO AXES THAT ARE THIS UNIT'S OWN. `--actor` is the axis the whole machine turns on: M9's
# entire safety property is a question about WHO MAY ACT — a human acknowledges, a human resolves, a
# timer ages and never resolves, and a model does none of it. `--decision-ref` is the second, and
# `absent` is its load-bearing value: it is the flag that asks whether closure by silence is possible
# at all, which is `F-30`, `GR-14`, `AC-SAFE-024` and `AC-MACH-903` in one argument.
#
# WHAT M9 IS, IN THREE SENTENCES, because everything below is a consequence of them:
#
#   ### AN EXCEPTION IS SOMETHING THAT NEEDS A HUMAN.
#   ### IT REACHES A NAMED HUMAN OWNER FROM CREATION, AND IT IS NEVER CLOSED BY SILENCE.
#   ### AN EXCEPTION CLOSED WITHOUT A DECISION IS NOT CLOSED — IT IS FORGOTTEN.
#
# M9 is the machine every other machine's human-owned state points at: M3's `UNKNOWN_OUTCOME`, M5's
# `UNPARSEABLE`, M6's `AMBIGUOUS`, M7's `OPEN`, M8's `OVERDUE` and `INDETERMINATE`. Collapsing it
# into an alert, a log line or an auto-closable ticket row is exactly the forgetting this machine
# exists to prevent — and each of those is a mechanism for forgetting wearing the costume of hygiene.
#
# THE SIX THINGS THIS FILE DELIBERATELY DOES NOT DECIDE. The corpus disagrees with itself in six
# places, and encoding a resolution here would make Product Driver the author of a canonical
# decision it has no authority to make (see `tasks/neyma_p6_m9.md` §3.8):
#
#   M9-AQ-1  does resolution require a HUMAN, or a human OR an ACTIVE rule? Entity §35, machine §16
#            and §40 say a human; GR-14, K-1, F9's ExceptionResolved row and AC-SAFE-024 all say
#            "an audit_events human-decision row OR an ACTIVE rule_id".
#   M9-AQ-2  what is cancellation? Entity §25 and machine §22 both say a retracted cause cancels
#            "still an event, still a decision_ref"; registry §4 gives M9 five states with no
#            CANCELLED, F9 six contracts with no ExceptionCancelled, and machine §14 seven rows.
#   M9-AQ-3  source_ref is a FOREIGN KEY (entity §18) to what? Entity §9 and §21 enumerate eight-plus
#            aggregate types, four of which have no table, one of which is not keyed by a single id,
#            and three of which are detector findings rather than rows.
#   M9-AQ-4  who wires the five landed "→ Exception" seams? M9's consumed set (machine §33, entity
#            §32) is exactly Acknowledged/Resolved/TimerFired, and EC-1's trigger is S|R — yet five
#            landed machines each deferred their seam to M9 by name.
#   M9-AQ-5  what IS the freeze that EC-1 commits atomically with the raise? Entity §15/§38 and
#            machine §4/§28/§34/§35 require it "where applicable"; every landed freeze
#            representation belongs to another unit and no landed transition an Exception can drive
#            exists (WI-6's triggers are EvidenceMissing/ConflictRaised).
#   M9-AQ-6  does EC-4 age from {OPEN, ACKNOWLEDGED} or from `any`? Machine §14 says the pair; target
#            spec §12.9's row says `any`, and 00-conventions makes the target spec the senior
#            document.
#
# Every oracle below asserts only what EVERY reading agrees on: a named human owner from creation, a
# closure that requires a decision_ref which RESOLVES, five lifecycle states and no sixth, sub_status
# as a field rather than a state, no expiry and no AutoClose, a timer that ages and escalates and
# never resolves, a severity vocabulary of exactly three members whose changes carry their previous
# value, a replay that rebuilds the current severity from the recorded events, and a tenant that is
# first everywhere.

name: p6_m9_exception
phase: "P6"
mode: backend
description: >
  P6 M9: the Exception — something that needs a human, and the one machine in Neyma whose whole job
  is to make sure it reaches a named person and is never quietly forgotten. There is no oversight
  queue, no dashboard and no notifier (M9 ships dark by contract), so the product is exercised
  through its real runtime as a brokerage narrative: a TMS write times out and the outcome is
  unknown, so an Exception is raised with a named human owner from the moment it exists and a
  severity recorded beside it; an authenticated human acknowledges it, which proves they SAW it and
  proves nothing else, and it keeps ageing; nobody acts, so a durable timer moves it to AGEING and
  then ESCALATED — louder, still owned, and never resolved by the clock; someone tries to close it
  with the string "done" and the database refuses, because closure is an event with a decision_ref
  that RESOLVES to an authenticated human decision, and an exception closed without a decision is
  not closed, it is FORGOTTEN; a model tries to clear it and is refused at any confidence; the
  severity is reassessed and that is a FIELD change carrying the value it moved from, so a rebuild
  months later reproduces the severity that is live rather than the one it was born with. What
  matters is not that a row can be created — it is that no inactivity, no AutoClose, no expiry, no
  sweep and no timer can ever close it, that no exception exists without a human whose name is on
  it, and that a carrier's £2,850 nobody can account for reaches a person instead of a log file.

setup:
  - ".venv/bin/python scripts/check_env.py"

# The M9 surface the builder must produce. A missing one is recorded as a failed assertion, so a run
# against a repository where M9 does not exist yet cannot report a verified M9.
fixtures:
  - "pyproject.toml"
  - "src/freight_recon/exception.py"
  - "src/freight_recon/migrations/phase6_exceptions.py"
  - "eval/tests/test_phase6_exception.py"
  - "scripts/probe_phase6_exception.py"
  - "scripts/mutate_phase6_exception.py"

services: []
readiness: []
app_url: ""

commands:
  # 1. THE VOCABULARY, ASSERTED. `--list-cases` is cheap and it is a real coverage oracle: if the
  #    builder ships a probe that cannot exercise one of the canonical risk families, this command
  #    fails here rather than the family silently going unverified. It is also what tells a reader of
  #    this file which `--case` values exist.
  - name: "the M9 probe can exercise every canonical risk family"
    run: ".venv/bin/python scripts/probe_phase6_exception.py --list-cases"
    expect_exit_code: 0
    timeout_s: 120
    expect_contains:
      # EC-1 — the raise, and the named human who owns it from creation
      - "raise-creates-open-with-a-named-human-owner"
      - "an-exception-cannot-be-raised-without-an-owner"
      - "an-ownerless-exception-is-structurally-impossible"
      - "the-owner-is-an-active-human-of-this-tenant"
      - "an-offboarded-human-cannot-own-a-new-exception"
      - "a-model-cannot-own-an-exception"
      - "raise-records-severity-and-the-source-that-raised-it"
      - "an-exception-cannot-be-raised-without-a-severity"
      - "an-exception-cannot-be-raised-without-a-source-ref"
      - "the-source-kind-is-a-closed-vocabulary"
      # EC-1 — the PERMANENT-failure half (L-D, M-74)
      - "a-permanent-auth-failure-raises-immediately-with-zero-retries"
      - "a-permanent-config-failure-raises-immediately-with-zero-retries"
      - "a-transient-failure-is-not-a-permanent-classification"
      - "the-failure-classification-is-supplied-never-inferred-from-a-message"
      # EC-2 — acknowledgement proves SEEN, not resolved
      - "an-authenticated-human-acknowledges-the-exception"
      - "acknowledgement-records-the-actor"
      - "acknowledgement-proves-seen-not-resolved"
      - "a-model-cannot-acknowledge-an-exception"
      - "a-system-actor-cannot-acknowledge-an-exception"
      - "an-acknowledged-exception-still-ages"
      # EC-3 / EC-6 — RESOLUTION AUTHORITY, which is the unit
      - "resolution-requires-a-decision-ref"
      - "closure-without-a-decision-ref-is-structurally-impossible"
      - "a-decision-ref-that-resolves-to-nothing-is-refused"
      - "a-decision-ref-naming-a-non-human-decision-event-is-refused"
      - "a-decision-ref-recorded-by-automation-is-refused"
