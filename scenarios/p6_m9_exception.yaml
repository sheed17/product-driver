      - "RESOLUTION UNBLOCKS THE FROZEN ENTITY"
      - "table present: True"

  - risk_category: restart_recovery
    claim: >-
      A restart loses nothing. An open Exception persists across it and stays open with its named
      human; its ageing timer is durable and re-fires rather than being lost with the process; a
      crash between the age threshold and the transition reaches the canonical state; and the frozen
      entity stays blocked until a resolution unblocks it. Machine §36: an open Exception persists,
      and the frozen entity stays blocked until resolved.
    checks:
      - "drive the Exception machine through a brokerage narrative, and attack it"
      - "ageing and escalation ride P5's existing durable timers rather than a second timer mechanism"
    observations:
